<text x="130" y="632" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">Lines leave and enter on the edge that faces the trunk; no line runs between two stations; cable tag beside the drop, address inside the box</text>
<text x="30" y="732" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444">Overview page (single-line). Station pitch 20 steps; drops 1 straight segment each; a second network gets its own trunk at least 4 steps away.</text>
<text x="30" y="745" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444">A line topology (daisy chain) is drawn as short links between neighbouring stations at the same height instead of drops.</text>
