<text x="670" y="191" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">directional valves (one under each actuator)</text>
<text x="670" y="204" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">signal and processing elements (if pneumatic)</text>
<text x="670" y="217" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">supply line and service unit at the bottom</text>
<text x="670" y="242" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">Cylinders and valves drawn horizontally, in the</text>
<text x="670" y="255" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">initial position; working lines vertical from 2/4</text>
<text x="670" y="268" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">up to the actuator ports; exhausts 3/5 down</text>
<text x="670" y="292" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">Tags (Festo teaching style 1A1, 1V1 shown;</text>
<text x="670" y="305" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">ISO 1219-2:2012 codes or IEC 81346 tags in</text>
<text x="670" y="318" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">practice) left of the component</text>
<text x="670" y="331" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#a04010" font-weight="normal" text-anchor="start">Port numbers at the ports, outside the symbol</text>
<text x="30" y="732" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444">On a fluid page grid (EPLAN default 2 mm; ElektraWatt native 4 mm with 12 mm valve positions). Chain pitch here 30 steps.</text>
<text x="30" y="745" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#444">A valve terminal puts the valves of all chains side by side on one sub-base; its supply gallery replaces the separate drops from the supply line.</text>
