# cargo-about configuration (NFR-LIC-08, ADR-0023): generates the third-party notice file from the dependency
# graph with the template ci/third-party-notices.hbs. Run (CI-PR-09 runs the same command):
#     cargo about generate -o target/THIRD-PARTY-NOTICES.txt ci/third-party-notices.hbs
# The release pipeline (CI-R-07, WP-S6.07) ships the generated file in every artefact.

# The NFR-LIC-04 allowlist, identical to [licenses].allow in deny.toml; keep the two lists in step.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
]

# The workspace's own crates are `publish = false`; they are not third-party components and are left out of the
# notice file (their licences are checked by `cargo xtask check-licence-map`).
private = { ignore = true }
