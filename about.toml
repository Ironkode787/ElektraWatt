# cargo-about configuration (NFR-LIC-08, ADR-0023): generates the third-party notice file from the dependency
# graph with the template ci/third-party-notices.hbs. Run (CI-PR-09 runs the same command):
#     cargo about generate -o target/THIRD-PARTY-NOTICES.txt ci/third-party-notices.hbs
# The release pipeline (CI-R-07, WP-S6.07) ships the generated file in every artefact.

# The NFR-LIC-04 allowlist, identical to [licenses].allow in deny.toml; keep the two lists in step.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",
]

# The workspace's own crates are `publish = false`; they are not third-party components and are left out of the
# notice file (their licences are checked by `cargo xtask check-licence-map`).
private = { ignore = true }

# Dev-dependencies are never built into a shipped artefact, so they are not in the notice file; cargo-deny does not
# walk them either. This keeps `borrow-or-share` (MIT-0, a dev-only dependency of the result-schema validator `boon`
# in bin/ew) out of the notices without adding MIT-0 to the allowlist (decision log ID-906, ID-914).
ignore-dev-dependencies = true

# color_quant 1.1.0 (through gif, krilla's `raster-images`, FT-406) declares MIT and ships only the MIT licence file,
# but its src/lib.rs header also carries the 1994 NeuQuant permission notice, whose one condition is that the notice
# stays intact. cargo-about reads licence files only, so the header (the crate's MIT notice and the NeuQuant notice)
# is added from the crate source here; the checksum pins the extracted text (a new version must be read again).
[color_quant.clarify]
license = "MIT"

[[color_quant.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "592dc80f1a865d20d61a2006a2d29ce34a2bc28cd7e868ab300fdeed6da154ca"

[[color_quant.clarify.files]]
path = "src/lib.rs"
license = "MIT"
start = "NeuQuant Neural-Net Quantization Algorithm"
end = "this copyright notice remain intact."
checksum = "67732f0b6970617387b62d984d47368b7af6c5b3075809d96ad9e7dffc0f81e3"
