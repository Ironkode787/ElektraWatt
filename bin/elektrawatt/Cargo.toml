[package]
name = "elektrawatt"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "The ElektraWatt desktop application."
repository.workspace = true
publish = false

[[bin]]
name = "elektrawatt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ew-ui = { path = "../../crates/ew-ui" }
ew-print = { path = "../../crates/ew-print" }
# The window on the wgpu renderer, so that WP-S2.02 paints into the same device (ADR-0014 decision 1); no glow,
# no persistence, no default_fonts.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11"] }
# Open and Save As dialogs; the XDG-portal backend on Linux (no GTK), pollster as its executor.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
serde_json = "1.0.154"
# tests/headless.rs: the 150 dpi snapshot against golden/J-E-2416/expected/png and the exported PDF's digest.
png = "0.18.1"
sha2 = { workspace = true }
