[package]
name = "elektrawatt"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "The ElektraWatt desktop application."
repository.workspace = true
publish = false

[[bin]]
name = "elektrawatt"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ew-ui = { path = "../../crates/ew-ui" }
# The shell model the window shows, named by its own crate (the window's settings, crash log and print requests).
ew-viewmodel = { path = "../../crates/ew-viewmodel" }
ew-print = { path = "../../crates/ew-print" }
# The GPU flags and the adapter count the window's setup reads, named by their own crate.
ew-render2d = { path = "../../crates/ew-render2d" }
# The window on the wgpu renderer, so that the canvas paints into the same device (ADR-0014 decision 1); no glow,
# no persistence, no default_fonts. `wgpu_no_default_features` instead of `wgpu`: eframe's `wgpu` turns on every
# wgpu backend through egui-wgpu's defaults; the backends are ew-render2d's, one set per operating system:
# DX12 with WARP on Windows, Vulkan and GL on Linux; the Metal set for macOS is kept for portability, dormant.
# Native Copy/Cut/Paste needs the explicit clipboard feature with defaults disabled.
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "wgpu_no_default_features", "wayland", "x11"] }
# Open and Save As dialogs; the XDG-portal backend on Linux (no GTK), pollster as its executor.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
ew-hack = { version = "0.3.5", path = "../../crates/ew-hack" }

# Not used directly: a version floor for a transitive crate (accesskit_unix -> atspi -> zbus-lockstep ->
# zbus_xml). zbus_xml 5.1.0 pulls quick-xml 0.38.4 (RUSTSEC-2026-0194, RUSTSEC-2026-0195), and resolver 3
# prefers it because 5.2.1 needs Rust 1.87 while the workspace MSRV is 1.85, so without this line a
# `cargo update` would bring the advisories back. Remove it when the graph no longer needs the hold.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus_xml = "=5.2.1"
# Not used directly: hold the Wayland clipboard on the existing SCTK 0.19 dependency chain.
# smithay-clipboard 0.7.3 only upgrades that backend; review its new dependencies separately.
smithay-clipboard = "=0.7.2"

[dev-dependencies]
automod.workspace = true
# The starter part versions of the tests (`ew_testkit::library::starter_version`,; dev-only edge).
ew-testkit = { path = "../../crates/ew-testkit" }
# The fresh temporary directory of the tests (dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../../crates/ew-testdir" }
serde_json = "1.0.154"
# tests/it/headless.rs: the 150 dpi snapshot against `ew render`'s PNG of the sample, read back as pixels.
png = "0.18.1"
# tests/it/app_icon.rs: the application icon's PNG rendered from its SVG: the SVG path of
# ew-scene and the CPU renderer (dev-only edges, `[allowed_dev_edges]`; no new package).
ew-scene = { path = "../../crates/ew-scene" }
ew-render-cpu = { path = "../../crates/ew-render-cpu" }
# The display lists and lengths the tests build, named by their own crates (no new package).
ew-dl = { path = "../../crates/ew-dl" }
ew-units = { path = "../../crates/ew-units" }
sha2 = { workspace = true }
