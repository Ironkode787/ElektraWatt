[package]
name = "ew"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "The ElektraWatt command-line interface, MCP server, merge driver, textconv and migration verifier."
repository.workspace = true
publish = false

[[bin]]
name = "ew"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ew-api = { path = "../../crates/ew-api" }
ew-print = { path = "../../crates/ew-print" }
# The parameters of `project.checks.set` that `ew project checks set` submits (already a dev-dependency).
serde_json = "1.0.154"

[dev-dependencies]
# tests/cli.rs: the SHA-256 of `ew export pdf` against `expected/pdf/sha256.txt` (G-M1-01).
sha2 = { workspace = true }
