[package]
name = "ew"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "The ElektraWatt command-line interface, MCP server, merge driver, textconv and migration verifier."
repository.workspace = true
publish = false

[[bin]]
name = "ew"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ew-api = { path = "../../crates/ew-api" }
ew-print = { path = "../../crates/ew-print" }
# The argument parser: the subcommand tree is one derive type (`cli::Cli`), its help and usage are clap's (doc 17
# §3.1, "a thin `clap` front-end").
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# The parameters of `project.checks.set` that `ew project checks set` submits (already a dev-dependency).
serde_json = "1.0.154"
ew-hack = { version = "0.2.0", path = "../../crates/ew-hack" }

[dev-dependencies]
automod.workspace = true
# Only carries the test-only feature to every test build (ci/dep-rules.toml, `[[uniform_test_features]]`).
ew-commands = { path = "../../crates/ew-commands", features = ["testkit"] }
# The fresh temporary directory of the tests (FT-1039; dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../../crates/ew-testdir" }
# tests/it/cli.rs: the SHA-256 of `ew export pdf` against `expected/pdf/sha256.txt` (G-M1-01).
sha2 = { workspace = true }
# tests/conventions.rs (WP-S1.22 part 1, CL-2): an independent JSON Schema validator (draft 2020-12; MIT OR
# Apache-2.0) that checks every `--json` output against its committed file under `schemas/`, and the result types'
# serde traits for the round trip.
boon = "=0.6.1"
serde = { workspace = true }
# tests/it/outputs.rs (FT-1278): reads the pixels of `ew export png` (the version ew-render-cpu writes them with).
png = "0.18.1"
