sha256 = "ce51ae233a9f800a040de2d0cd5983ef86f558c623b342c80942301d7f453f48"
checked_by = "apt, against the signed index of jammy-updates at the snapshot of [apt]; then stage.py debs"
used_for = "the C headers and start files of the Linux release build and the c-only job; the version of the image's libc6"

