# The non-Rust components that the packaging downloads or takes from an image (WP-S6.06 D18): name, version, licence,
# URL and SHA-256 of each. `.github/workflows/package.yml`, the `c-only` job of `ci.yml` and `ci/build-book.sh` read
# their pins from here (`python3 -I packaging/stage.py pin <name> [--field version|url|sha256]`), and WP-S6.07's SBOM
# reads its components from here. They build, stage or check an artefact; NSIS's code alone reaches one, as the
# setup's stub and its uninstaller. The container images stay in the workflows as `*_IMAGE` variables, pinned by
# digest (`cargo xtask check-workflows`).
#
# `checked_by` says what verifies the bytes. The Debian packages come from snapshot.ubuntu.com at the one time of
# `[apt]` below (FT-1222), so the archive never moves under the pins: apt checks each against the SHA-256 of the
# snapshot's signed index, and `stage.py debs` compares every downloaded file with this list before the install
# (FT-1223). A new snapshot, the image digest (`LINUX_BUILD_IMAGE`) and these versions are updated together, in a
# commit of their own (doc 18 §5.3's rule for images).

# map: packaging-components: a new downloaded or image-provided packaging tool or runtime goes here with its version, licence, URL and SHA-256.
[[component]]
name = "gcc"
version = "4:11.2.0-1ubuntu1"
licence = "GPL-3.0-or-later WITH GCC-exception-3.1"
url = "https://snapshot.ubuntu.com/ubuntu/20261102T000000Z/pool/main/g/gcc-defaults/gcc_11.2.0-1ubuntu1_amd64.deb"
sha256 = "be895c1a9611905254f818c41092f147f5f2a566f87f1817b5c36d977020bea7"
checked_by = "apt, against the signed index of jammy at the snapshot of [apt]; then stage.py debs"
used_for = "the C compiler of the build scripts in the Linux release build and the c-only job (NFR-MAINT-09)"

[[component]]
name = "libc6-dev"
version = "2.35-0ubuntu3.15"
licence = "LGPL-2.1-or-later"
url = "https://snapshot.ubuntu.com/ubuntu/20261102T000000Z/pool/main/g/glibc/libc6-dev_2.35-0ubuntu3.15_amd64.deb"
sha256 = "ce51ae233a9f800a040de2d0cd5983ef86f558c623b342c80942301d7f453f48"
checked_by = "apt, against the signed index of jammy-updates at the snapshot of [apt]; then stage.py debs"
used_for = "the C headers and start files of the Linux release build and the c-only job; the version of the image's libc6"

[[component]]
name = "cargo-about"
version = "0.9.2"
licence = "MIT OR Apache-2.0"
url = "https://github.com/EmbarkStudios/cargo-about/releases/tag/0.9.2"
sha256 = ""
checked_by = "taiki-e/install-action, which checks the release asset against the SHA-256 of its own manifest"
used_for = "THIRD-PARTY-NOTICES.txt of the installed tree and the CLI archives (NFR-LIC-08)"

[[component]]
name = "python"
version = "3.12"
licence = "PSF-2.0"
url = "https://www.python.org/"
sha256 = ""
checked_by = "setup-python below on windows-2025 (from the runner's tool cache), the runner's python3 on ubuntu-24.04; stage.py refuses an older Python than 3.11, and the job summary records the exact version"
used_for = "packaging/stage.py, which stages the tree, writes the CLI archives and checks the packages and the installed tree"

[[component]]
name = "setup-python"
version = "7.1.0"
licence = "MIT"
url = "https://github.com/actions/setup-python/tree/6d4fd22b20465ccc0f7354476588e8df7c9ca0e0"
sha256 = ""
checked_by = "pinned by its commit SHA in package.yml (cargo xtask check-workflows); stage.py's own tests compare its version comment and python-version with this list"
used_for = "the Python of package.yml's windows job (FT-1225)"

[[component]]
name = "mdbook"
version = "0.5.4"
licence = "MPL-2.0"
url = "https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz"
sha256 = "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
checked_by = "ci/build-book.sh, sha256sum before the archive is unpacked (the SHA-256 the release publishes); mdbook --version must print the version"
used_for = "builds the user guide (ci/build-book.sh, D7) of docs.yml's docs-book and package.yml's book job; the built book in docs/ of the installed tree carries its theme (FT-1224)"

[[component]]
name = "nsis"
version = "3.13"
licence = "Zlib AND bzip2-1.0.6 AND CPL-1.0"
url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
sha256 = "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8"
checked_by = "package.yml, sha256sum before the archive is unpacked (its MD5 matched the 530e3623c077cba879ed2ae6e13be362 that SourceForge lists); makensis -VERSION must print v<version>"
used_for = "makensis, which compiles packaging/windows/elektrawatt.nsi into the per-user setup (D2, D9), since windows-2025 has no NSIS (image 20261030.317.1); the setup's stub and uninstaller are its zlib-licensed code (zlib compression; the bzip2 and CPL-1.0 LZMA modules are not used)"

# FT-1222: the Linux container's apt reads the Ubuntu archive at this snapshot,
# https://snapshot.ubuntu.com/ubuntu/<snapshot> (jammy and jammy-updates, main), in package.yml's linux job and in
# ci.yml's c-only alike (ci/linux-container.sh). It serves gcc and libc6-dev at the versions above.
[apt]
snapshot = "20261102T000000Z"

