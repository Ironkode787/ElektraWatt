# The non-Rust components that the packaging downloads or takes from an image (WP-S6.06 D18): name, version, licence,
# URL and SHA-256 of each. `.github/workflows/package.yml`, the `c-only` job of `ci.yml` and `ci/build-book.sh` read
# their pins from here (`python3 -I packaging/stage.py pin <name> [--field version|url|sha256]`), and WP-S6.07's SBOM
# reads its components from here. They build, stage or check an artefact; NSIS's code alone reaches one, as the
# setup's stub and its uninstaller. The container images stay in the workflows as `*_IMAGE` variables, pinned by
# digest (`cargo xtask check-workflows`).
#
# `checked_by` says what verifies the bytes. The Debian packages come from snapshot.ubuntu.com at the one time of
# `[apt]` below (FT-1222), so the archive never moves under the pins: apt checks each against the SHA-256 of the
# snapshot's signed index, and `stage.py debs` compares every downloaded file with this list before the install
# (FT-1223). A new snapshot, the image digest (`LINUX_BUILD_IMAGE`) and these versions are updated together, in a
# commit of their own (doc 18 §5.3's rule for images).

# map: packaging-components: a new downloaded or image-provided packaging tool or runtime goes here with its version, licence, URL and SHA-256.
[[component]]
name = "gcc"
version = "4:11.2.0-1ubuntu1"
licence = "GPL-3.0-or-later WITH GCC-exception-3.1"
url = "https://snapshot.ubuntu.com/ubuntu/20261102T000000Z/pool/main/g/gcc-defaults/gcc_11.2.0-1ubuntu1_amd64.deb"
sha256 = "be895c1a9611905254f818c41092f147f5f2a566f87f1817b5c36d977020bea7"
checked_by = "apt, against the signed index of jammy at the snapshot of [apt]; then stage.py debs"
used_for = "the C compiler of the build scripts in the Linux release build and the c-only job (NFR-MAINT-09)"

[[component]]
