# SPDX-FileCopyrightText: 2026 The ElektraWatt contributors
# SPDX-License-Identifier: CC0-1.0

# REUSE annotations (REUSE specification 3.3) for the files that cannot carry an SPDX header, or whose tools
# rewrite them. Every other file carries the header itself. The licences follow the path map of
# docs/design/19-open-source-governance.md §2.1, held in machine form in ci/licence-map.toml; `cargo xtask
# check-licence-map` checks these annotations against that map too. Globs: `*` does not cross `/`, `**` does.

version = 1

# L11: generated or tool-rewritten configuration (CC0-1.0).
[[annotations]]
path = ["Cargo.lock", "docs/plan/tools/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L11: the AI-assistance configuration (agent role files with YAML front matter, settings JSON, workflows).
[[annotations]]
path = ".claude/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L5: the JSON Schemas generated by ew-schema (MIT OR Apache-2.0); JSON cannot carry a header.
[[annotations]]
path = "schemas/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# L1: the command-parameter JSON Schemas generated by ew-commands, the result schemas of `ew` (bin/ew), the query registry snapshot of ew-api (`ew queries --json`), the rule catalogue snapshot generated by
# ew-checks, the expected page texts of ew-viewmodel's `page.describe` tests, the keymap sheet of ew-viewmodel
# (WP-S2.08 part 2) and the blessed token dump of ew-ui (GPL-3.0-or-later, like the crates);
# the CLI snapshot of `ew` and the api_v1 snapshot of ew-sqlview (WP-S1.22 D13) too;
# JSON and the expected texts cannot carry a header (the texts are compared byte for byte).
[[annotations]]
path = ["crates/ew-commands/schemas/**", "bin/ew/schemas/**", "bin/ew/api/**", "crates/ew-sqlview/api/**", "crates/ew-api/api/**", "crates/ew-checks/catalogue/**", "crates/ew-viewmodel/tests/expected/**", "crates/ew-api/tests/expected/**", "crates/ew-ui/tests/expected/**", "crates/ew-viewmodel/keymaps/sheet.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# L9: documentation without headers (Markdown, CSV and the tutorial scripts under docs/, the README's screenshots
# under docs/images/ and the guide's PO files under docs/book/po/, WP-S7.05 D18) and the root prose files README.md
# and CLAUDE.md (CC-BY-4.0).
[[annotations]]
path = ["docs/**.md", "docs/**.csv", "docs/**.ewui", "docs/images/**", "docs/book/po/**", "README.md", "CLAUDE.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# L1: the generated reference pages of the user guide (`cargo xtask docs-gen`). Their text is the doc comments of
# the GPL crates, carried by the command schemas of ew-commands and the rule catalogue of ew-checks, so the pages
# keep those crates' licence (owner ruling, cycle 16); `override` replaces the L9 annotation above for this path.
# The glossary page (WP-S2.08 part 1) is the text of ew-viewmodel's glossary file, so it is GPL too; so is the keymap
# page (WP-S2.08 part 2), the text of ew-viewmodel's keymap sheet. The CLI, query and api_v1 pages (WP-S1.22 D15) are
# the text of the GPL crates' snapshots (bin/ew, ew-api, ew-sqlview), so they keep that licence too (the orchestrator's
# ruling 3, cycle 42: each page keeps its source's licence).
[[annotations]]
path = [
    "docs/book/src/reference/commands/**",
    "docs/book/src/reference/rules/**",
    "docs/book/src/reference/glossary.md",
    "docs/book/src/reference/keymaps.md",
    "docs/book/src/reference/cli/**",
    "docs/book/src/reference/queries.md",
    "docs/book/src/reference/api-v1.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# L5: the generated format reference pages of the user guide (WP-S1.22 D15). Their text is the project format's JSON
# Schemas (schemas/0.1, MIT OR Apache-2.0, L5 above), so they keep that licence (the orchestrator's ruling 3, cycle
# 42); `override` replaces the L9 annotation for these paths.
[[annotations]]
path = "docs/book/src/reference/format/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# L9: the generated release-notes pages of the user guide (WP-S7.05 D13, D18). Their text is the release notes of
# docs/release-notes/ (CC-BY-4.0, L9), so they keep that licence; `override` states it for these paths.
[[annotations]]
path = "docs/book/src/reference/release-notes/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# L9: the blind drafter's prompts, personas, task sheets, recordings and help (WP-S6.13, ID-622); data files and the
# composed prompt cannot carry a header (CC-BY-4.0, like docs/).
[[annotations]]
path = "tools/blind/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# L1: the generated reference file of the blind drafter (the action registry of
# ew-viewmodel, written by its `blind_reference` test): it keeps the crate's licence, as the generated command and
# rule pages do; `override` replaces the annotation above for this path.
[[annotations]]
path = "tools/blind/reference/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# L7: shipped library content as JSON documents (symbols, function definitions, forms), which cannot carry headers.
[[annotations]]
path = "content/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# L8: the generic starter parts (WP-S2.18 D5), part facts written by the library writer as JSON lines and a manifest,
# which cannot carry headers (CC0-1.0, like the other part facts); `override` replaces the L7 annotation above.
[[annotations]]
path = "content/libraries/ew-starter-parts.ewlib/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L8: the sample project's catalogue parts (WP-S7.03 D3), written by the library writer from Golden A's CC0 part and
# manufacturer copies (CC0-1.0); `override` replaces the L7 annotation above.
[[annotations]]
path = "content/libraries/ew-sample-parts.ewlib/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L14: bundled third-party fonts (Noto Sans Regular, SemiBold and Bold, Noto Sans Math Regular, OFL-1.1; ADR-0028),
# binary files. The fonts' own copyright lines come first (Noto Sans 2015, Noto Sans Math 2022), then the collective
# notice for the selection (NFR-LIC-10); provenance in NOTICE.
[[annotations]]
path = "assets/fonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Copyright 2015 Google Inc. All Rights Reserved.",
  "Copyright 2022 Google LLC. All Rights Reserved.",
  "2026 The ElektraWatt contributors",
]
SPDX-License-Identifier = "OFL-1.1"

# L14: the vendored Tabler Icons 3.50.0 outline SVGs (MIT; WP-S2.17 D9). Tabler's copyright line exactly as in its
# LICENSE comes first, then the collective notice for the selection (NFR-LIC-10); provenance in NOTICE.
[[annotations]]
path = "assets/icons/tabler/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Copyright (c) 2020-2026 Paweł Kuna",
  "2026 The ElektraWatt contributors",
]
SPDX-License-Identifier = "MIT"

# L1: the project's own icon glyphs (WP-S2.17 D9), under the application's licence; the SVG files stay
# comment-free so that `cargo xtask gen-icons` reads them like the vendored set.
[[annotations]]
path = "assets/icons/ew/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# L1 and L14: the application icon (WP-S6.06 §13 O5, ID-1280), Tabler's `bolt` (MIT, its path as Tabler draws it,
# scaled) on the project's rounded square, under the application's licence: the SVG comment-free like the glyphs
# above, and the PNG rendered from it, which cannot carry a header; provenance in NOTICE.
[[annotations]]
path = "assets/icons/app/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Copyright (c) 2020-2026 Paweł Kuna",
  "2026 The ElektraWatt contributors",
]
SPDX-License-Identifier = "MIT AND GPL-3.0-or-later"

# L14: the licence file and notices of the AppImage's type-2 runtime (WP-S6.06 D2, ID-1275), which the AppImage
# aggregates; the runtime itself is downloaded by the Linux job, never committed. The file quotes the runtime's MIT
# licence and the notices of the libraries linked into it, whose texts are in LICENSES/; provenance in NOTICE.
[[annotations]]
path = "packaging/linux/type2-runtime-notices.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "2004-23 probonopd",
  "2005-2020 Rich Felker, et al.",
  "2001-2007 Miklos Szeredi",
  "2012 Dave Vasilevsky, Phillip Lougher",
  "Meta Platforms, Inc. and affiliates",
  "Jean-loup Gailly and Mark Adler",
  "2018-2025 Microsoft Corporation, Daan Leijen",
  "2026 The ElektraWatt contributors",
]
SPDX-License-Identifier = "MIT AND LGPL-2.1-only AND BSD-2-Clause AND BSD-3-Clause AND Zlib"

# L8: the golden fixture (19 §2.1 L8, doc 20 §3.1): CSV tables and generated outputs cannot carry a header.
[[annotations]]
path = "golden/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L8: the released formats' frozen corpus (ADR-0011 amendment 6, WP-S6.08 D13): Golden A's files as each release shipped
# them, byte for byte, with the corpus job's expected saves; project files cannot carry a header.
[[annotations]]
path = "fixtures/format/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L8: binary test inputs kept from the former fuzz corpus: three command sequences and one EPLAN archive.
[[annotations]]
path = ["crates/ew-testkit/tests/fixtures/command_fuzz/**", "crates/ew-import-eplan/tests/fixtures/lzma2-7z.edz"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L8: the hostile corpus of WP-S6.04 D10, the project's own attack files in a folder per class: data files that cannot
# carry a header (its index, README.md, carries its own).
[[annotations]]
path = "crates/ew-testkit/hostile/*/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The ElektraWatt contributors"
SPDX-License-Identifier = "CC0-1.0"

# L8: the real-exporter SVG corpus of FT-418: public-domain and CC0 works from Wikimedia Commons, kept byte for byte
# (crates/ew-schema/tests/fixtures/svg-exporters/SOURCES.md lists the source, licence and any change of each file).
[[annotations]]
path = "crates/ew-schema/tests/fixtures/svg-exporters/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Wikimedia Commons contributors (public domain or CC0-1.0; see SOURCES.md)",
  "2026 The ElektraWatt contributors",
]
SPDX-License-Identifier = "CC0-1.0"

# L8: the real-exporter raster corpus of FT-436: public-domain and CC0 works from Wikimedia Commons, kept byte for
# byte (crates/ew-export/tests/fixtures/raster-exporters/SOURCES.md lists the source, licence and verdict of each
# file).
[[annotations]]
path = "crates/ew-export/tests/fixtures/raster-exporters/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Wikimedia Commons contributors (public domain or CC0-1.0; see SOURCES.md)",
  "2026 The ElektraWatt contributors",
]
SPDX-License-Identifier = "CC0-1.0"
