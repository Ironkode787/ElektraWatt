# The requirement map of the acceptance runner (WP-S2.11 D2, NFR-MAINT-11), kept by hand. xtask builds
# `expected/acceptance_requirements.md` from it, the requirement catalogues and doc 20 §21; `cargo xtask acceptance
# --gate M2` runs every test named here and reports pass, fail or missing per row.
#
# A test is `<binary ID> <test path>` as nextest names them (`ew-ui::it ac28::<fn>`). A requirement is mapped to an
# existing test that cites its row ID and asserts on Golden A; no test is written here for a row this map does not
# own (FP-3).

# map: acceptance-requirements: a new GP-named requirement goes here as one [[requirement]] per row ID with its tests; a criterion proven outside ew-api's runner goes in [[criterion]].
