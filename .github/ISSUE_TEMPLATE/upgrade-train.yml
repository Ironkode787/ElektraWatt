# The quarterly upgrade train of the UI stack (NFR-MAINT-04; docs/design/18-quality-security-release.md §6.3;
# WP-S6.06 D17): one issue per quarter, opened in its first month. The weekly workflow weekly.yml reports the lag
# (ci/ui-stack-lag.py) that this train keeps within NFR-MAINT-04's limits.
name: Upgrade train
description: The quarterly lock-step upgrade of the UI stack, the toolchain and the fuzz nightly (doc 18 §6.3).
title: "[Upgrade train]: <yyyy> Q<n>"
labels: ["upgrade-train"]
body:
  - type: markdown
    attributes:
      value: |
        One lock-step upgrade per quarter, in the first month of the quarter and at least four weeks before that quarter's feature freeze (doc 18 §6.3, §7.3). Target cost: about one developer-day (NFR-MAINT-04). The weekly workflow `weekly.yml` writes the current lag of the UI stack (`ci/ui-stack-lag.py`) to its job summary.

        **Bumped together in step 1:** egui, eframe, egui-wgpu, egui_tiles, egui_table, egui_ltreeview, egui_kittest, transform-gizmo-egui, wgpu, winit and AccessKit; the toolchain (`rust-toolchain.toml`, `RUST_TOOLCHAIN` of the workflows) and the fuzz nightly (`fuzz/rust-toolchain.toml`).
        **Bumped in step 5, in a separate commit on the same branch:** the drawing stack: krilla, vello_cpu, parley, fontique, skrifa and harfrust.
  - type: input
    id: branch
    attributes:
      label: Branch
      description: "`upgrade/<yyyy>q<n>`"
      placeholder: upgrade/2027q1
    validations:
      required: true
  - type: textarea
    id: lag
    attributes:
      label: Lag before the train
      description: The table of the latest weekly.yml run (ci/ui-stack-lag.py).
  - type: checkboxes
    id: steps
    attributes:
      label: The seven steps and their pass conditions
      description: Tick a step when its pass condition holds.
      options:
        - label: "1. Branch `upgrade/<yyyy>q<n>`. Bump egui, eframe, egui-wgpu, egui_tiles, egui_table, egui_ltreeview, egui_kittest, transform-gizmo-egui, wgpu, winit and AccessKit together; bump the toolchain and the fuzz nightly. Pass: builds."
        - label: "2. Run the full PR and nightly sets on the branch. Pass: green, except UI snapshot diffs."
        - label: "3. Review the kittest image snapshots: UI changes are accepted, accessibility regressions are not. Pass: the name walker and the contrast lint are green."
        - label: "4. Drawing outputs (golden PNGs, PDFs) are unchanged, because the UI stack does not touch ew-dl, vello_cpu or krilla. Pass: the PNG and PDF digests are unchanged."
        - label: "5. Bump the drawing stack (krilla, vello_cpu, parley, fontique, skrifa, harfrust) in a separate commit on the same branch. Pass: tags, cross-references and wire numbers byte-identical (NFR-REL-09); geometry within tolerance; digest changes listed in the release notes."
        - label: "6. GPU smoke per backend, WARP, the CPU renderer; manual RDP check. Pass: pass."
        - label: "7. Merge. Pass: within 5 working days."
  - type: markdown
    attributes:
      value: |
        **Abort rule.** If the branch is not green after 3 developer-days, ElektraWatt stays on the previous versions for the quarter and files the blockers upstream. The lag limits of NFR-MAINT-04 (two egui minor releases, one wgpu major release) are never exceeded: a second missed quarter makes the upgrade the top-priority task.

        **wasmtime** stays on its LTS line and moves to the next LTS before the current one leaves support (ADR-0020, NFR-MAINT-04).
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Merged, or aborted under the abort rule with the blockers filed upstream (links).
