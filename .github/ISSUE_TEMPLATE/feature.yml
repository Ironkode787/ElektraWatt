name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not attach customer drawings, project files or personal data; use placeholders such as `<customer>` or `<project ref>`. Report security issues privately (see SECURITY.md), not here.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      description: Optional, for example FR-… or NFR-… from the requirement catalogues.
  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: I have removed customer data, personal data and confidential material from this issue.
          required: true
