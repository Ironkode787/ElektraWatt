# The nightly performance and memory gate (WP-S6.03, NFR-PERF-20; docs/design/18-quality-security-release.md
# §3.16 and §5.2): `cargo xtask perf-gate` runs the ew-testkit benches over the fixture classes S and M, compares
# the medians and the memory estimates with ci/perf-baseline.toml (15 % threshold) and writes a Markdown report;
# `ci/ci-times.py` appends the CI-time trend of ci.yml against the 30-minute budget of NFR-MAINT-05 (FT-269,
# decision log ID-381). The M class takes over an hour in full mode on a desktop, hence the long timeout. The report is the job summary and the artifact `perf-report`, next to a candidate baseline.
#
# REPORT-ONLY on the hosted runners: they are not BM-class (a dedicated, isolated machine, decision log DEC-034;
# the BM runner is an owner item), so the job does not set EW_PERF_ASSERT, the one switch that makes a regression
# fail the command (the timing rule of §3.16: no wall-clock assertion elsewhere). A baseline taken on another
# runner is reported as not comparable. When the BM-class runner exists, a job on it sets EW_PERF_RUNNER=bm and
# EW_PERF_ASSERT=1 and the baseline is re-blessed there (`cargo xtask perf-gate --bless`).
#
# Same hardening as ci.yml (§5.4, NFR-SEC-19): actions pinned by commit SHA with a version comment, read-only
# default token, no secrets (ci-times.py reads the public API without a token).

name: perf

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Smoke run (20 samples, 2 runs): not gate evidence"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: perf
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep in step with rust-toolchain.toml and ci.yml.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  perf-gate:
    name: perf-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: ci-times self-test
        run: python3 -I ci/ci-times.py --selftest
      # Report-only: EW_PERF_ASSERT is deliberately not set here.
      - name: cargo xtask perf-gate
        shell: bash
        env:
          QUICK: ${{ inputs.quick && '--quick' || '' }}
        run: cargo xtask perf-gate --report target/perf/report.md $QUICK
      # FT-269: the CI-time trend; an unreadable API is a note in the report, not a failure.
      - name: CI-time trend
        if: always()
        shell: bash
        run: |
          mkdir -p target/perf
          python3 -I ci/ci-times.py --repo "$GITHUB_REPOSITORY" --append target/perf/report.md
      - name: job summary
        if: always()
        shell: bash
        run: |
          if [ -f target/perf/report.md ]; then
            cat target/perf/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "perf-gate wrote no report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-report
          path: |
            target/perf/report.md
            target/perf/baseline.candidate.toml
          if-no-files-found: warn
          retention-days: 90
