# The release workflow of 0.1.x (WP-S6.07 D2, D3, slimmed for an early alpha by ID-1520; doc 18 §5.2 CI-R-01, CI-R-05,
# CI-R-06, CI-R-11). The candidate is the release: a tag `v<X.Y.Z>-rc.<n>` builds a draft prerelease holding every
# release file, and the go publishes those same files as `v<X.Y.Z>`; no tag is built twice or moved. The procedure and
# the checklist: docs/release/README.md, docs/release/checklist.md.
#
# On a candidate tag:
# - `verify` (CI-R-01; D5): ci/release-verify.py checks that the tag's X.Y.Z is the workspace version and that
#   docs/release-notes/<X.Y.Z>.md has notes. It waits for no CI run: CI is off until 1.0 (ID-1519).
# - `package` (CI-R-05): package.yml through workflow_call with `version: X.Y.Z` and `upload: true`: the x86_64 release
#   builds, the notices, the staged trees with their smoke test, the CLI archives, the setup and the AppImage.
# - `sums` (CI-R-06, D8): the release files of the run (the x86_64 CLI archives, the setup and the AppImage; ID-1313,
#   ID-1331 (2)) and `SHA256SUMS` over them, unsigned.
# - `release` (CI-R-11, D13): the draft prerelease `v<X.Y.Z>-rc.<n>` with the release notes and every file, then the
#   files downloaded back and `sha256sum -c SHA256SUMS`. It publishes nothing.
# On a dispatch with `candidate` (the promote): `release` alone. It refuses when `v<X.Y.Z>` exists, finds the
# candidate's draft, checks its files again and, with `dry: false`, publishes them byte for byte as the release
# `v<X.Y.Z>` (latest) on the candidate's commit; with `dry: true` (the default) it prints what it would publish and
# changes nothing. The draft stays as the record of the candidate.
#
# ID-476's hold is lifted for the release (ID-1331 (2), WP-S6.08 D26): `package`'s `upload: true` carries the setup and
# the AppImage into the release files. The candidate may come from a release branch `release/<X.Y>` (ID-1412): no job
# requires the tagged commit to be on `main`, and the promote is dispatched from `main`. The GitHub settings (the `release` environment and its deployment rule, the tag ruleset,
# immutable releases, the read-only default token) are the owner's, set before the first candidate (WP-S6.07 §13 O1).
#
# Hardening (doc 18 §5.4, NFR-SEC-19): top-level `contents: read`; `release` is the only job with a write scope and
# runs in the protected `release` environment (no other job may hold a write scope); no
# secret: the GitHub CLI uses the run's short-lived `GITHUB_TOKEN`; actions pinned by commit SHA; the checkout keeps no
# credentials.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      candidate:
        description: "The candidate tag to promote, v<X.Y.Z>-rc.<n>"
        type: string
        required: true
      dry:
        description: "Print what the promote would publish and change nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # CI-R-01 (D5)
  verify:
    name: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag's version and its release notes (CI-R-01)
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I ci/release-verify.py tag "$TAG" >> "$GITHUB_OUTPUT"

  # CI-R-05: WP-S6.06's packaging, slimmed (ID-1520).
  package:
    name: package
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      upload: true

  # CI-R-06 (D8)
  sums:
    name: sums
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The x86_64 archives, the setup and the AppImage (ID-1313, ID-1331).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ew-${{ needs.verify.outputs.version }}-x86_64-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: SHA256SUMS
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 -I ci/release-verify.py sums "$RUNNER_TEMP/release" --version "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1

  # CI-R-11 (D13): the draft on a candidate tag; the promote on a dispatch.
  release:
    name: release
    needs: [verify, sums]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.verify.result == 'success' && needs.sums.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: github.event_name == 'push'
        with:
          name: release-files
          path: ${{ runner.temp }}/release
      - name: the draft prerelease, downloaded back and checked
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I ci/release-verify.py draft "$TAG" "$RUNNER_TEMP/release" --repo "$GITHUB_REPOSITORY"
      - name: the promote of the candidate's draft
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE: ${{ inputs.candidate }}
          DRY: ${{ inputs.dry }}
        run: |
          set -euo pipefail
          mode=--publish
          if [ "$DRY" != false ]; then mode=--dry; fi
          python3 -I ci/release-verify.py promote "$CANDIDATE" "$RUNNER_TEMP/promote" --repo "$GITHUB_REPOSITORY" "$mode"
