# The nightly command fuzzer (WP-S6.02, FT-272, decision log ID-388; docs/design/18-quality-security-release.md
# §3.6, CI-N-02): the ignored test `fuzz_long` of crates/ew-testkit/tests/command_fuzz runs EW_FUZZ_SEEDS seeds of
# EW_FUZZ_STEPS random steps over Golden A, every registered command among them, with the memo
# oracle, the structural check, the prevent rule, `verify_derived`, the validity oracle of each command, the
# save-and-reload round trips, the CSV table imports and the closing undo-all. The nightly body is this seeded
# test; the cargo-fuzz target that doc 18 §3.6 and FT-272 also list is deferred (FT-272; design pass): the
# repository has no `fuzz/` crate yet (that is the parser-fuzzing package, doc 18 §3.12).
#
# REPORT-ONLY in the sense that the hosted runner gives no verdict on speed; the job is RED for a real fuzzer
# finding (a panic, an invariant or oracle violation, a round-trip mismatch) and for everything that leaves a
# night without coverage or hides a hang: a build that fails (a nightly that does not compile covers nothing and
# nobody would notice a green job), a seed that was running when the run step ended (a hang bounded by the step's
# `timeout`, a stack overflow, an out-of-memory abort: a seed takes about four minutes, so one in flight at the
# timeout is a hang, which is a finding), and a run that ends without a verdict line. A finding is written to
# the findings file first (the test writes `running seed N` before each seed and rewrites the file after it) and
# the file is uploaded with `if: always()`; the verdict step reads its `FINDINGS: n` and `status:` lines. The
# run step is bounded by its own `timeout`, shorter than the job's, so that the verdict step always runs, and the
# test stops starting seeds after EW_FUZZ_BUDGET_SECS (that is `status: budget`, a normal end).
#
# The seeds change every night (a range starting at the day number), so the nightly runs explore new streams;
# the job summary names the seeds, and a finding reproduces locally with the command in the report.
#
# Same hardening as ci.yml and perf.yml (§5.4, NFR-SEC-19): actions pinned by commit SHA with a version comment,
# read-only token, no secrets.

name: fuzz

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds: a comma list or ranges such as 1..=40 (empty: a range from the day number)"
        type: string
        default: ""
      steps:
        description: "Steps per seed"
        type: string
        default: "200"
      budget_minutes:
        description: "No new seed starts after this many minutes"
        type: string
        default: "75"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The release profile with the debug-only checks switched on: about seven times the throughput of the dev
  # profile (a measured local run: 1.4 s a step against 10 s), and the debug assertions and the overflow checks
  # stay part of the oracle (doc 18, the rule on debug-only invariant checks in the fuzzer).
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
  # Keep in step with rust-toolchain.toml and ci.yml.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  command-fuzz:
    name: command-fuzz
    runs-on: ubuntu-24.04
    # Safety net only: the budget (default 75 minutes) and the step timeout below end the run well before.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: build the fuzzer
        id: build
        continue-on-error: true
        shell: bash
        run: cargo test --release -p ew-testkit --test command_fuzz --no-run --locked
      - name: cargo test fuzz_long
        id: fuzz
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          INPUT_SEEDS: ${{ inputs.seeds }}
          INPUT_STEPS: ${{ inputs.steps }}
          INPUT_BUDGET: ${{ inputs.budget_minutes }}
        run: |
          mkdir -p target/fuzz
          budget_min="${INPUT_BUDGET:-75}"
          steps="${INPUT_STEPS:-200}"
          seeds="${INPUT_SEEDS:-}"
          if [ -z "$seeds" ]; then
            # A range from the day number: a new set of 12 seeds every night.
            base=$(( $(date -u +%s) / 86400 * 100 ))
            seeds="${base}..=$(( base + 11 ))"
          fi
          echo "seeds=$seeds steps=$steps budget=${budget_min}min" | tee target/fuzz/params.txt
          # `timeout` is the infrastructure bound (budget plus a margin for the seed in flight); the test stops
          # starting seeds at the budget by itself.
          EW_FUZZ_SEEDS="$seeds" \
          EW_FUZZ_STEPS="$steps" \
          EW_FUZZ_BUDGET_SECS="$(( budget_min * 60 ))" \
          EW_FUZZ_REPORT="$PWD/target/fuzz/findings.md" \
          timeout "$(( budget_min + 45 ))m" \
            cargo test --release -p ew-testkit --test command_fuzz --locked fuzz_long -- --ignored --nocapture \
            2>&1 | tee target/fuzz/log.txt
          exit "${PIPESTATUS[0]}"
      # The verdict. Green only when the build succeeded, the report says `complete` or `budget` and
      # `FINDINGS: 0`. Red for a finding, a failed build, a seed in flight (`running seed N`: the run step ended
      # during it: timeout or abort) and a missing or unfinished report.
      - name: verdict and job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Command fuzzer"
            echo
            [ -f target/fuzz/params.txt ] && echo "Parameters: \`$(cat target/fuzz/params.txt)\`" && echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/fuzz/findings.md ]; then
            cat target/fuzz/findings.md >> "$GITHUB_STEP_SUMMARY"
            findings=$(sed -n 's/^FINDINGS: \([0-9][0-9]*\)$/\1/p' target/fuzz/findings.md | head -n 1)
            status=$(sed -n 's/^status: //p' target/fuzz/findings.md | head -n 1)
          else
            findings=""
            status="no report"
          fi
          red=0
          if [ -n "$findings" ] && [ "$findings" -gt 0 ]; then
            echo "::error::the command fuzzer has $findings finding(s); see the job summary and the artifact fuzz-report"
            red=1
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "::error::the fuzzer did not build: the night has no coverage"
            echo "The fuzzer did not build." >> "$GITHUB_STEP_SUMMARY"
            red=1
          fi
          case "$status" in
            complete|budget) ;;
            "running seed "*)
              echo "::error::seed ${status#running seed } did not finish (hang, timeout or abort): a finding; the log is in the artifact fuzz-report"
              echo "Seed ${status#running seed } was running when the run ended: a hang, a timeout or an abort (stack overflow, out of memory). That is a finding." >> "$GITHUB_STEP_SUMMARY"
              red=1
              ;;
            *)
              if [ "${{ steps.build.outcome }}" = "success" ]; then
                echo "::error::the fuzz run ended without a verdict line (status: ${status:-none})"
                echo "The run ended without a verdict line (status: ${status:-none})." >> "$GITHUB_STEP_SUMMARY"
                red=1
              fi
              ;;
          esac
          exit "$red"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-report
          path: |
            target/fuzz/findings.md
            target/fuzz/params.txt
            target/fuzz/log.txt
          if-no-files-found: warn
          retention-days: 90
