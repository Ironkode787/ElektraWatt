# CI-W-03's lag half (NFR-MAINT-04; docs/design/18-quality-security-release.md §5.2, §6.3; WP-S6.06 D17): weekly and on
# dispatch, ci/ui-stack-lag.py reads the UI stack's locked versions from Cargo.lock and the newest releases from the
# crates.io sparse index and writes the table to the job summary. Red when egui is more than two minor releases or
# wgpu more than one major release behind: then the upgrade train is due (.github/ISSUE_TEMPLATE/upgrade-train.yml).
# Its offline test runs first (IN-19).
#
# Same hardening as ci.yml (§5.4, NFR-SEC-19): actions pinned by commit SHA with a version comment, read-only
# default token, no secret, credentials not persisted by the checkout; the only download is the index's public JSON.

name: weekly

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  ui-stack-lag:
    name: ui-stack-lag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci/ui-stack-lag.py's tests (IN-19)
        run: python3 -I ci/ui-stack-lag.py --test  # IN-19
      # IN-20: the table into the job summary, also when the lag fails.
      - name: the UI stack's lag (NFR-MAINT-04)
        run: |
          set -euo pipefail
          {
            echo "## The UI stack's lag (NFR-MAINT-04)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -I ci/ui-stack-lag.py | tee -a "$GITHUB_STEP_SUMMARY"
