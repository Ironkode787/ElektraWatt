# Documentation and legal checks of gate G-M0 (docs/design/18-quality-security-release.md §5.2): CI-PR-10
# legal-docs (with its docs-book part) and CI-PR-15 docs-diagrams. All three jobs run on every pull request: legal-docs holds
# checks that apply to every change (reuse lint, the licence map, DCO), and a required status check must report on
# every pull request (a path-filtered workflow is shown as "Expected" and blocks the merge).
#
# CI-PR-10 legal-docs (WP-S0.02, WP-S0.03): the plan and document checks; `reuse lint` (NFR-LIC-01, NFR-LIC-02);
# the licence-map and licence-boundary check (19 §5.1, NFR-LIC-10, NFR-MAINT-02); the anonymisation guard
# (NFR-PRIV-09); governance-file presence (NFR-DOC-08); the rustdoc build without warnings (NFR-MAINT-08); and,
# on pull requests only, the DCO check (NFR-LIC-03), the LG-2 merge block for non-maintainer pull requests while
# the exception texts are missing (NFR-LIC-12) and the RFC reference on pull requests labelled `format-major`,
# `api-break` or `licence` (NFR-DOC-09). The pull_request trigger includes `edited`, `labeled` and `unlabeled`
# so that the last two re-run when a label or the description changes. Policy data: ci/README.md.

name: docs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep in step with rust-toolchain.toml and ci.yml.
  RUST_TOOLCHAIN: "1.99.0"
  # reuse-tool, installed into a virtual environment with a pinned encoding detector.
  REUSE_VERSION: "6.2.0"
  CHARSET_NORMALIZER_VERSION: "3.5.2"
  # mdBook, the prebuilt Linux release archive of github.com/rust-lang/mdBook, pinned by version and by the SHA-256
  # that the release publishes for the archive (checked before anything is unpacked; resolved 2026-10-22).
  # Update the version and the digest together. (The variables are not named MDBOOK_*: mdBook reads that prefix as
  # configuration overrides.)
  DOCS_MDBOOK_VERSION: "0.5.4"
  DOCS_MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"

jobs:
  # CI-PR-10
  legal-docs:
    name: legal-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The DCO step reads every commit of the pull request.
          fetch-depth: 0
      - name: plan and document checks
        run: |
          python3 -I docs/plan/tools/totals.py --check
          python3 -I docs/plan/tools/schedule.py --check
          python3 -I docs/plan/tools/trace.py --check
          python3 -I docs/plan/tools/doccheck.py
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: reuse lint
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install --quiet "reuse==$REUSE_VERSION" "charset-normalizer==$CHARSET_NORMALIZER_VERSION"
          "$RUNNER_TEMP/reuse/bin/reuse" lint
      - name: licence map and licence boundary
        run: cargo xtask check-licence-map
      - name: anonymisation guard
        run: cargo xtask check-anonymisation
      - name: governance files
        run: cargo xtask check-governance-files
      - name: rustdoc build
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
      - name: DCO sign-off on every commit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          cargo xtask check-dco "origin/${BASE_REF}..HEAD"
      - name: LG-2 merge block (non-maintainer pull requests)
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "maintainer pull request ($AUTHOR_ASSOCIATION): LG-2 does not apply"
              exit 0
              ;;
          esac
          # The design exception is either the SPDX-listed KiCad libraries exception or a project text
          # (ADR-0024 decision 1, 19 LR-07); either file satisfies the check.
          if [ -f LICENSES/LicenseRef-ElektraWatt-plugin-exception.txt ] \
            && { [ -f LICENSES/KiCad-libraries-exception.txt ] \
                 || [ -f LICENSES/LicenseRef-ElektraWatt-design-exception.txt ]; }; then
            echo "plugin and design exception texts present: LG-2 met"
            exit 0
          fi
          echo "::error::blocked:LG-2 - pull requests from non-maintainers ($AUTHOR_ASSOCIATION) cannot be merged until ADR-0025 is accepted and the plugin and design exception texts are in LICENSES/ (NFR-LIC-12)."
          exit 1
      - name: RFC reference for format-major, api-break and licence pull requests
        if: github.event_name == 'pull_request'
        run: |
          labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")"
          if ! printf '%s\n' "$labels" | grep -qxE 'format-major|api-break|licence'; then
            echo "no format-major, api-break or licence label: no RFC reference needed"
            exit 0
          fi
          if jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | grep -q 'rfcs/'; then
            echo "RFC reference found"
            exit 0
          fi
          echo "::error::This pull request is labelled format-major, api-break or licence; its description must reference the accepted RFC (rfcs/NNNN-title.md) (NFR-DOC-09)."
          exit 1

  # CI-PR-15
  docs-diagrams:
    name: docs-diagrams
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # mermaid-cli 12.0.0, pinned by the digest of its multi-arch image index (ghcr.io, resolved
      # 2026-10-18). The image is only run here, never distributed. Update tag and digest together.
      MERMAID_CLI_IMAGE: ghcr.io/mermaid-js/mermaid-cli/mermaid-cli@sha256:fa995339034aae7e5cd4f61482248b7f5c51be355b1a6f6eda11a2bbf8401f5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pull mermaid-cli
        run: docker pull "$MERMAID_CLI_IMAGE"
      - name: render every Mermaid block
        run: python3 -I ci/render-mermaid.py --image "$MERMAID_CLI_IMAGE"

  # CI-PR-10, book part (WP-S0.06, NFR-DOC-01, NFR-DOC-06, NFR-MAINT-08). Doc 18 §5.2 lists the mdBook build and the
  # generated-reference check with legal-docs; they run here as a job of their own. The job covers the user
  # documentation book (docs/book, an mdBook in the Diátaxis structure): the generated reference pages must be
  # current, the book must build with no network (the build runs in an empty network namespace, so a plugin or
  # theme that fetches fails the job), every link of the built pages must resolve (ci/check-book-links.py: stdlib
  # only, no network, no plugin to pin), and the built book is uploaded as an artifact (the bundle that the
  # installers will take offline, NFR-DOC-01).
  docs-book:
    name: docs-book
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: generated reference pages are current
        run: cargo xtask docs-gen --check
      - name: install mdBook (pinned release, checksum verified)
        run: |
          archive="mdbook-v${DOCS_MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${DOCS_MDBOOK_VERSION}/${archive}"
          echo "${DOCS_MDBOOK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/mdbook"
          "$RUNNER_TEMP/mdbook/mdbook" --version
      - name: build the book offline
        run: |
          sudo unshare --net -- "$RUNNER_TEMP/mdbook/mdbook" build docs/book --dest-dir "$RUNNER_TEMP/book"
      - name: link check of the built book
        run: python3 -I ci/check-book-links.py "$RUNNER_TEMP/book"
      - name: upload the built book
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: user-guide
          path: ${{ runner.temp }}/book
          if-no-files-found: error
          retention-days: 14
