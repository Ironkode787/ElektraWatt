# The release packaging of 0.1.x (WP-S6.06 D8, slimmed for an early alpha by ID-1520; doc 18 §5.2 CI-R-03, CI-R-05):
# one workflow builds, from one commit, the x86_64 release binaries on Windows and Linux, stages the installed tree of
# D3, writes the CLI archives and the installers. It runs by hand and through release.yml's `workflow_call`.
#
# - `book` builds the user guide once (ci/build-book.sh, D7), which the installers ship, and hands it to the OS jobs
#   as an artifact (HTML, no binary).
# - `windows` (D5): the third-party notices (cargo-about), `cargo build --release` with the static C runtime and
#   link.exe, the staged tree (packaging/stage.py, D4), its smoke test (`--version` of both programs and `elektrawatt
#   --smoke` on the staged sample, IN-6), the CLI archive and the per-user setup (makensis, NSIS pinned in
#   packaging/components.toml, compiles packaging/windows/elektrawatt.nsi).
# - `linux` (D6): the notices, then the build in the digest-pinned `ubuntu:22.04` container with `gcc` and
#   `libc6-dev` (exact versions, packaging/components.toml, downloaded from Ubuntu's archive at its snapshot and
#   compared with the list, FT-1222, FT-1223) and no C++ compiler, with no network, the release check of CI-R-03 on
#   both binaries and glibc 2.35 at most (ci/linux-container.sh, IN-3); the staged tree, the same smoke test, the CLI
#   archive, and the AppImage: the AppDir around the staged tree (packaging/stage.py appdir), its squashfs image
#   written by mksquashfs in the build container (squashfs-tools from the same snapshot, zstd) and the pinned type-2
#   runtime before it, `ElektraWatt-<v>-x86_64.AppImage`.
#
# Every tree ships the licence texts and NOTICE (stage.py) beside THIRD-PARTY-NOTICES.txt; NOTICE names the non-crate
# components (the fonts, SQLite, the AppImage's runtime).
#
# ID-476's hold: no binary that links the UI graph leaves its job. With `upload: false` (a dispatch, and every call
# but the release's) a job uploads only its CLI archive, as the artefact `ew-<os>-<arch>-unsigned-dev-<short sha>` for
# 90 days, and its reports. `upload: true` uploads the same archive under its release name for one day, and, the hold
# lifted for the release (ID-1331 (2), WP-S6.08 D26), the setup and the AppImage beside it as
# `ew-<v>-<target>-setup` and `ew-<v>-<target>-appimage`, which the release's `sums` job collects into the release
# files; in every other run they are built but never leave their jobs.
#
# `<v>`: the `version` input, or `<workspace version>-dev.<short sha>` (D8). It names the archives, the setup, the
# staged README and the archive's root folder. The programs print the workspace version (CARGO_PKG_VERSION); the jobs
# assert that they print the version of Cargo.toml and that `<v>` is that version, alone or followed by `-` (FT-1227).
#
# Hardening (§5.4, NFR-SEC-19): actions pinned by commit SHA with a version comment, the image by
# digest, every download by version and SHA-256, read-only default token, no secret, credentials not persisted by the
# checkout. Policy data: ci/README.md.

name: package

on:
  # Off until 1.0 (owner, 2026-11-08, ID-1519): no push, pull-request or schedule trigger; run it by hand.
  workflow_dispatch:
    inputs:
      version:
        description: "The version that names the artefacts (default: <workspace version>-dev.<short sha>)"
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: "The version that names the artefacts (default: <workspace version>-dev.<short sha>)"
        type: string
        default: ""
      upload:
        description: "Upload every artefact for one day under its release name (WP-S6.07's release only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.99.0"
  # The Linux build container of D6: ubuntu:22.04 (glibc 2.35, the oldest Supported Linux), pinned by the digest of
  # its multi-arch image index (Docker Hub, resolved 2026-11-03). Its libc6 is the version of packaging/components.toml's
  # libc6-dev; update the tag, the digest and those versions together.
  LINUX_BUILD_IMAGE: ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11

jobs:
  book:
    name: book
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the book offline
        run: bash ci/build-book.sh "$RUNNER_TEMP/book"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-book
          path: ${{ runner.temp }}/book
          if-no-files-found: error
          retention-days: 1

  # D5, CI-N-12, CI-R-05 (Windows)
  windows:
    name: windows (x86_64)
    needs: book
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_UPLOAD: ${{ inputs.upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: package-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # FT-1225: stage.py needs Python 3.11 or newer (tomllib); the version is packaging/components.toml's, which
      # stage.py's own tests compare with this step.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: the version and the pins
        id: pins
        run: |
          set -euo pipefail
          python --version
          workspace="$(python -I packaging/stage.py version)"
          version="${INPUT_VERSION:-$(python -I packaging/stage.py version --sha "$GITHUB_SHA")}"
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::the version '$version' holds a character a file name cannot"; exit 1; }
          case "$version" in
            "$workspace" | "$workspace"-*) ;;
            *) echo "::error::the version $version is not the workspace version $workspace (Cargo.toml), alone or followed by -"; exit 1 ;;
          esac
          {
            echo "workspace=$workspace"
            echo "version=$version"
            echo "short=${GITHUB_SHA::7}"
            echo "cargo_about=$(python -I packaging/stage.py pin cargo-about)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package-book
          path: ${{ runner.temp }}/book
      # The tree is a distribution of the GPL program: it ships the third-party notices (NFR-LIC-08), written beside
      # the binaries, where stage.py takes them (cargo-about, packaging/components.toml).
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@${{ steps.pins.outputs.cargo_about }}
      - name: third-party notices
        run: |
          mkdir -p target/release
          cargo about generate -o target/release/THIRD-PARTY-NOTICES.txt ci/third-party-notices.hbs
      # D5: an explicit RUSTFLAGS replaces the target rustflags of .cargo/config.toml, so the programs link with
      # link.exe and not with the local builds' rust-lld (ID-746); the C runtime is linked statically (doc 18 §8: no
      # redistributable), and the release check's three path remaps keep the cargo home, the rustup home and the
      # checkout out of the binaries. link.exe writes elektrawatt.pdb and ew.pdb beside them (public symbols only).
      # The release check's environment step runs in the shell that starts the build, with PKG_CONFIG=false as on
      # Linux (no pkg-config probe; harmless here).
      - name: cargo build (release, static C runtime)
        run: |
          set -euo pipefail
          export RUSTFLAGS="-D warnings -C target-feature=+crt-static --remap-path-prefix=${CARGO_HOME:?}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$(rustup show home)}=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/build"
          export PKG_CONFIG=false
          # actions/setup-python exports PKG_CONFIG_PATH (its Python's lib/pkgconfig); the release build reads none.
          unset PKG_CONFIG_PATH
          bash ci/release-check.sh env
          cargo build --release --locked -p elektrawatt -p ew
      - name: stage the installed tree
        env:
          VERSION: ${{ steps.pins.outputs.version }}
        run: python -I packaging/stage.py tree --bin target/release --book "$RUNNER_TEMP/book" --version "$VERSION" --out "$RUNNER_TEMP/tree"
      # IN-6: the staged programs print the workspace version, and the window's program opens the staged sample.
      - name: smoke test of the staged tree
        env:
          WORKSPACE_VERSION: ${{ steps.pins.outputs.workspace }}
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tree"
          test "$("$tree/ew.exe" --version | tr -d '\r')" = "ew $WORKSPACE_VERSION"
          test "$("$tree/elektrawatt.exe" --version | tr -d '\r')" = "elektrawatt $WORKSPACE_VERSION"
          "$tree/elektrawatt.exe" --smoke "$tree/samples/J-E-2416.ew"
      - name: write the CLI archive
        env:
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          archive="ew-$VERSION-$TARGET.zip"
          python -I packaging/stage.py archive --tree "$RUNNER_TEMP/tree" --kind zip --out "$RUNNER_TEMP/dist/$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      # D2, D9: windows-2025 has no NSIS (the image's README, version 20261030.317.1), so makensis comes from NSIS's
      # release archive, pinned by version and SHA-256 in packaging/components.toml and checked before it is unpacked.
      - name: makensis (NSIS, pinned)
        run: |
          set -euo pipefail
          version="$(python -I packaging/stage.py pin nsis)"
          url="$(python -I packaging/stage.py pin nsis --field url)"
          sha256="$(python -I packaging/stage.py pin nsis --field sha256)"
          work="$RUNNER_TEMP/nsis"
          mkdir -p "$work"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --output "$work/nsis.zip" "$url"
          echo "$sha256  $work/nsis.zip" | sha256sum --check --strict -
          python -I -m zipfile -e "$work/nsis.zip" "$work"
          makensis="$work/nsis-$version/makensis.exe"
          printed="$("$makensis" -VERSION | tr -d '\r')"
          test "$printed" = "v$version" || { echo "::error::the downloaded makensis prints '$printed', not 'v$version' (packaging/components.toml)"; exit 1; }
          echo "MAKENSIS=$makensis" >> "$GITHUB_ENV"
          echo "NSIS_VERSION=$version" >> "$GITHUB_ENV"
      # D9: `-D` options, not `/D`, which Git Bash would take for a path.
      - name: compile the per-user setup
        env:
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/setup"
          setup="$RUNNER_TEMP/setup/ElektraWatt-$VERSION-x64-user-setup.exe"
          "$MAKENSIS" -V3 "-DVERSION=$VERSION" "-DTREE=$(cygpath -w "$RUNNER_TEMP/tree")" \
            "-DOUTFILE=$(cygpath -w "$setup")" packaging/windows/elektrawatt.nsi
          echo "SETUP=$(cygpath -w "$setup")" >> "$GITHUB_ENV"
      - name: name the upload
        env:
          VERSION: ${{ steps.pins.outputs.version }}
          SHORT: ${{ steps.pins.outputs.short }}
        run: |
          if [ "$INPUT_UPLOAD" = true ]; then
            { echo "UPLOAD_NAME=ew-$VERSION-$TARGET"; echo "UPLOAD_DAYS=1"; } >> "$GITHUB_ENV"
          else
            { echo "UPLOAD_NAME=ew-windows-x86_64-unsigned-dev-$SHORT"; echo "UPLOAD_DAYS=90"; } >> "$GITHUB_ENV"
          fi
      - name: job summary
        if: always()
        run: |
          {
            echo "Windows (x86_64): $(python --version 2>&1)."
            if [ -n "${SETUP:-}" ]; then
              echo "Compiled \`$(basename "$(cygpath -u "$SETUP")")\` with NSIS ${NSIS_VERSION:-}; it leaves the job only in the release's run (\`upload: true\`, ID-1331 (2))."
            else
              echo "No setup was compiled (see the log)."
            fi
            if [ -n "${UPLOAD_NAME:-}" ]; then
              echo "Built \`${ARCHIVE}\`, uploaded as \`$UPLOAD_NAME\`: an unsigned build, not a release unless the release workflow uploads it."
            else
              echo "No CLI archive was uploaded (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The CLI archive; the setup only in the release's run (below), the staged tree never (ID-476).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.UPLOAD_NAME }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: ${{ env.UPLOAD_DAYS }}
      # WP-S6.08 D26 (ID-1331 (2), ID-476's hold lifted): with `upload: true` the setup joins the release files, under a
      # name the release's `sums` job collects with the archive.
      - if: inputs.upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ew-${{ steps.pins.outputs.version }}-${{ env.TARGET }}-setup
          path: ${{ runner.temp }}/setup/ElektraWatt-${{ steps.pins.outputs.version }}-x64-user-setup.exe
          if-no-files-found: error
          retention-days: 1

  # D6, CI-N-12, CI-R-03, CI-R-05 (Linux)
  linux:
    name: linux (x86_64)
    needs: book
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-unknown-linux-gnu
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_UPLOAD: ${{ inputs.upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: package-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: the version and the pins
        id: pins
        run: |
          set -euo pipefail
          python3 --version
          workspace="$(python3 -I packaging/stage.py version)"
          version="${INPUT_VERSION:-$(python3 -I packaging/stage.py version --sha "$GITHUB_SHA")}"
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::the version '$version' holds a character a file name cannot"; exit 1; }
          case "$version" in
            "$workspace" | "$workspace"-*) ;;
            *) echo "::error::the version $version is not the workspace version $workspace (Cargo.toml), alone or followed by -"; exit 1 ;;
          esac
          {
            echo "workspace=$workspace"
            echo "version=$version"
            echo "short=${GITHUB_SHA::7}"
            echo "cargo_about=$(python3 -I packaging/stage.py pin cargo-about)"
            echo "gcc=$(python3 -I packaging/stage.py pin gcc)"
            echo "libc6_dev=$(python3 -I packaging/stage.py pin libc6-dev)"
            echo "apt_snapshot=$(python3 -I packaging/stage.py snapshot)"
            echo "squashfs_tools=$(python3 -I packaging/stage.py pin squashfs-tools)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package-book
          path: ${{ runner.temp }}/book
      # cargo-about for the notices.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@${{ steps.pins.outputs.cargo_about }}
      - name: third-party notices
        run: |
          mkdir -p target/release
          cargo about generate -o target/release/THIRD-PARTY-NOTICES.txt ci/third-party-notices.hbs
      # With network, on the runner: the crates into the cargo home that the container mounts (the build has none).
      - name: cargo fetch
        run: cargo fetch --locked
      - name: pull the container image
        run: |
          for attempt in 1 2 3; do
            docker pull "$LINUX_BUILD_IMAGE" && exit 0
            echo "docker pull failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::docker pull of $LINUX_BUILD_IMAGE failed three times: the job has no release build without the image"
          exit 1
      # FT-1222: the archive of Ubuntu at the snapshot of packaging/components.toml, over HTTPS with the runner's CA
      # bundle (the image has none); squashfs-tools for the AppImage (D2).
      - name: download gcc, libc6-dev and squashfs-tools in the container
        env:
          EW_GCC_VERSION: ${{ steps.pins.outputs.gcc }}
          EW_LIBC6_DEV_VERSION: ${{ steps.pins.outputs.libc6_dev }}
          EW_APT_SNAPSHOT: ${{ steps.pins.outputs.apt_snapshot }}
          EW_SQUASHFS_TOOLS_VERSION: ${{ steps.pins.outputs.squashfs_tools }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apt/archives/partial" "$RUNNER_TEMP/apt/lists/partial"
          docker run --rm --env EW_GCC_VERSION --env EW_LIBC6_DEV_VERSION --env EW_APT_SNAPSHOT \
            --env EW_SQUASHFS_TOOLS_VERSION \
            --volume /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            --volume "$RUNNER_TEMP/apt/archives:/var/cache/apt/archives" \
            --volume "$RUNNER_TEMP/apt/lists:/var/lib/apt/lists" \
            --volume "$PWD/ci/linux-container.sh:/linux-container.sh:ro" \
            "$LINUX_BUILD_IMAGE" bash /linux-container.sh download
      # FT-1223: the downloaded packages are those of packaging/components.toml, each with its SHA-256.
      - name: compare the downloaded packages with packaging/components.toml
        run: python3 -I packaging/stage.py debs "$RUNNER_TEMP/apt/archives"
      # IN-3: no network, no C++ compiler (asserted), PKG_CONFIG=false and the release check's remaps; the checkout,
      # the cargo home and the toolchain are mounted at their runner paths, so the remaps and the scan see those paths.
      - name: cargo build (release) in the container, release check
        env:
          EW_GCC_VERSION: ${{ steps.pins.outputs.gcc }}
          EW_LIBC6_DEV_VERSION: ${{ steps.pins.outputs.libc6_dev }}
          EW_APT_SNAPSHOT: ${{ steps.pins.outputs.apt_snapshot }}
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          toolchain="$(dirname "$(dirname "$(rustup which --toolchain "$RUST_TOOLCHAIN" cargo)")")"
          export EW_TOOLCHAIN_BIN="$toolchain/bin" EW_UID="$(id -u)" EW_GID="$(id -g)" PKG_CONFIG=false
          export RUSTFLAGS="-D warnings --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$RUSTUP_HOME=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/build"
          docker run --rm --network none \
            --env EW_GCC_VERSION --env EW_LIBC6_DEV_VERSION --env EW_APT_SNAPSHOT --env EW_TOOLCHAIN_BIN \
            --env EW_UID --env EW_GID \
            --env PKG_CONFIG --env RUSTFLAGS --env CARGO_HOME --env RUSTUP_HOME --env CARGO_TERM_COLOR \
            --env GITHUB_WORKSPACE --env GITHUB_SHA --env RUNNER_TEMP \
            --volume "$RUNNER_TEMP/apt/archives:/var/cache/apt/archives" \
            --volume "$RUNNER_TEMP/apt/lists:/var/lib/apt/lists" \
            --volume "$toolchain:$toolchain:ro" \
            --volume "$CARGO_HOME:$CARGO_HOME" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "$LINUX_BUILD_IMAGE" bash ci/linux-container.sh release
      - name: stage the installed tree
        env:
          VERSION: ${{ steps.pins.outputs.version }}
        run: python3 -I packaging/stage.py tree --bin target/release --book "$RUNNER_TEMP/book" --version "$VERSION" --out "$RUNNER_TEMP/tree"
      # IN-6
      - name: smoke test of the staged tree
        env:
          WORKSPACE_VERSION: ${{ steps.pins.outputs.workspace }}
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/tree"
          test "$("$tree/ew" --version)" = "ew $WORKSPACE_VERSION"
          test "$("$tree/elektrawatt" --version)" = "elektrawatt $WORKSPACE_VERSION"
          "$tree/elektrawatt" --smoke "$tree/samples/J-E-2416.ew"
      - name: write the CLI archive
        env:
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          archive="ew-$VERSION-$TARGET.tar.gz"
          python3 -I packaging/stage.py archive --tree "$RUNNER_TEMP/tree" --kind tar.gz --out "$RUNNER_TEMP/dist/$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      # D2, ID-1275: the static type-2 runtime, pinned by URL and SHA-256 in packaging/components.toml and checked
      # before it is used, so an upstream asset that changes fails here.
      - name: the AppImage runtime (pinned)
        run: |
          set -euo pipefail
          url="$(python3 -I packaging/stage.py pin appimage-type2-runtime --field url)"
          sha256="$(python3 -I packaging/stage.py pin appimage-type2-runtime --field sha256)"
          mkdir -p "$RUNNER_TEMP/runtime"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --output "$RUNNER_TEMP/runtime/runtime" "$url"
          echo "$sha256  $RUNNER_TEMP/runtime/runtime" | sha256sum --check --strict -
      # D10: the AppDir around the staged tree; its squashfs image in the container with no network (mksquashfs
      # -root-owned -noappend -comp zstd, ci/linux-container.sh); then the runtime and the image, mode 0755.
      - name: build the AppImage (D10)
        env:
          VERSION: ${{ steps.pins.outputs.version }}
          EW_GCC_VERSION: ${{ steps.pins.outputs.gcc }}
          EW_LIBC6_DEV_VERSION: ${{ steps.pins.outputs.libc6_dev }}
          EW_APT_SNAPSHOT: ${{ steps.pins.outputs.apt_snapshot }}
          EW_SQUASHFS_TOOLS_VERSION: ${{ steps.pins.outputs.squashfs_tools }}
        run: |
          set -euo pipefail
          python3 -I packaging/stage.py appdir --tree "$RUNNER_TEMP/tree" --out "$RUNNER_TEMP/AppDir"
          export EW_UID="$(id -u)" EW_GID="$(id -g)" EW_APPDIR="$RUNNER_TEMP/AppDir" EW_SQUASHFS="$RUNNER_TEMP/AppDir.squashfs"
          docker run --rm --network none \
            --env EW_GCC_VERSION --env EW_LIBC6_DEV_VERSION --env EW_APT_SNAPSHOT --env EW_SQUASHFS_TOOLS_VERSION \
            --env EW_UID --env EW_GID --env EW_APPDIR --env EW_SQUASHFS \
            --volume "$RUNNER_TEMP/apt/archives:/var/cache/apt/archives" \
            --volume "$RUNNER_TEMP/apt/lists:/var/lib/apt/lists" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            "$LINUX_BUILD_IMAGE" bash ci/linux-container.sh appimage
          appimage="ElektraWatt-$VERSION-x86_64.AppImage"
          mkdir -p "$RUNNER_TEMP/appimage"
          python3 -I packaging/stage.py appimage --runtime "$RUNNER_TEMP/runtime/runtime" --image "$RUNNER_TEMP/AppDir.squashfs" --out "$RUNNER_TEMP/appimage/$appimage"
          echo "APPIMAGE=$appimage" >> "$GITHUB_ENV"
      - name: name the upload
        env:
          VERSION: ${{ steps.pins.outputs.version }}
          SHORT: ${{ steps.pins.outputs.short }}
        run: |
          if [ "$INPUT_UPLOAD" = true ]; then
            { echo "UPLOAD_NAME=ew-$VERSION-$TARGET"; echo "UPLOAD_DAYS=1"; } >> "$GITHUB_ENV"
          else
            { echo "UPLOAD_NAME=ew-linux-x86_64-unsigned-dev-$SHORT"; echo "UPLOAD_DAYS=90"; } >> "$GITHUB_ENV"
          fi
      - name: job summary
        if: always()
        env:
          EW_GCC_VERSION: ${{ steps.pins.outputs.gcc }}
          EW_LIBC6_DEV_VERSION: ${{ steps.pins.outputs.libc6_dev }}
          EW_APT_SNAPSHOT: ${{ steps.pins.outputs.apt_snapshot }}
        run: |
          {
            echo "Linux (x86_64): built in \`$LINUX_BUILD_IMAGE\` with gcc $EW_GCC_VERSION and libc6-dev $EW_LIBC6_DEV_VERSION from Ubuntu's archive at $EW_APT_SNAPSHOT; staged with $(python3 --version 2>&1)."
            echo
            if [ -f target/container-packages.txt ]; then
              echo "The container's packages (\`dpkg-query --show\`):"
              echo
              echo '```'
              cat target/container-packages.txt
              echo '```'
            else
              echo "No package list of the container: the build did not reach it (see the log)."
            fi
            echo
            for binary in elektrawatt ew; do
              if [ -f "target/release-check-$binary.md" ]; then
                cat "target/release-check-$binary.md"
              else
                echo "No release-check report for \`$binary\`: the environment check or the build failed (see the log)."
              fi
              echo
            done
            if [ -n "${APPIMAGE:-}" ]; then
              echo "Built \`$APPIMAGE\` with the type-2 runtime $(python3 -I packaging/stage.py pin appimage-type2-runtime) and $(cat target/squashfs-tools-version.txt 2> /dev/null || echo 'mksquashfs') (zstd); it leaves the job only in the release's run (\`upload: true\`, ID-1331 (2))."
            else
              echo "No AppImage was built (see the log)."
            fi
            echo
            if [ -n "${UPLOAD_NAME:-}" ]; then
              echo "Built \`${ARCHIVE}\`, uploaded as \`$UPLOAD_NAME\`: an unsigned build, not a release unless the release workflow uploads it."
            else
              echo "No CLI archive was uploaded (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The reports only; the AppImage leaves the job only in the release's run (below, ID-1331 (2)).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-check-report
          path: target/release-check-*.md
          if-no-files-found: ignore
          retention-days: 30
      # The CLI archive; the AppImage only in the release's run (below, ID-1331 (2)).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.UPLOAD_NAME }}
          path: ${{ runner.temp }}/dist/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: ${{ env.UPLOAD_DAYS }}
      # WP-S6.08 D26 (ID-1331 (2), ID-476's hold lifted): with `upload: true` the AppImage joins the release files, under
      # a name the release's `sums` job collects with the archive.
      - if: inputs.upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ew-${{ steps.pins.outputs.version }}-${{ env.TARGET }}-appimage
          path: ${{ runner.temp }}/appimage/${{ env.APPIMAGE }}
          if-no-files-found: error
          retention-days: 1
