# The nightly CLI artefact (FT-299, WP-S6.02, gate criterion G-M1-22; docs/design/18-quality-security-release.md §5.2,
# CI-N-12): builds the `ew` command-line program in the release profile on ubuntu-24.04, windows-2025 and macos-15
# and uploads one artefact per platform, named `ew-<os>-<arch>-unsigned-dev-<short sha>`, with a README that says
# "unsigned development build, not a release" and the licence texts and third-party notices. Nothing is signed,
# notarised or published: there is no release
# creation, no tag and no secret, and the artefacts expire after 90 days. Publishing a binary (and signing it) is a
# release item of WP-S6.07 and the owner's.
#
# The second job, `release-check` (FT-333; §5.2, CI-R-03 before WP-S6.07), builds the GUI program `elektrawatt` in
# the release profile on ubuntu-24.04 with PKG_CONFIG=false and asserts what the release build of CI-R-03 must hold:
# no pkg-config override in the build environment, no build-host path in the binary, no hard link to libwayland,
# libxkbcommon, libX11, libxcb, libEGL, libGL or libvulkan, and no library directory in x11-dl's generated config
# (ci/release-check.sh). It uploads
# only its report, never the binary: no binary that links the UI graph is distributed before ID-476's hold lifts.
#
# Same hardening as ci.yml (§5.4, NFR-SEC-19): actions pinned by commit SHA with a version comment, read-only default
# token, no configured secrets, credentials not persisted by the checkout. Policy data: ci/README.md.

name: cli-artefact

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-artefact
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep in step with rust-toolchain.toml and ci.yml.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # CI-N-12
  cli-artefact:
    name: cli-artefact (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # An explicit RUSTFLAGS replaces the target rustflags of .cargo/config.toml, so the Windows artefact links with
    # link.exe and not with the local builds' rust-lld (ID-746). `-D warnings` as ci.yml: the release build of `ew`
    # is warning-free (checked with `cargo check -p ew --release` under these flags), and it is the flag set CI
    # already builds with. The path remaps stay with the release-check job of the GUI binary.
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            exe: ew
          - os: windows
            arch: x86_64
            runner: windows-2025
            exe: ew.exe
          - os: macos
            arch: aarch64
            runner: macos-15
            exe: ew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ew-cli-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: short commit id
        id: rev
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # The archive is a distribution of the GPL program: it ships the licence texts and the third-party notices
      # (NFR-LIC-08, ADR-0023), generated here as the supply-chain job of ci.yml does.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - name: third-party notices
        shell: bash
        run: |
          mkdir -p target
          cargo about generate -o target/THIRD-PARTY-NOTICES.txt ci/third-party-notices.hbs
      - name: cargo build (release)
        shell: bash
        run: cargo build -p ew --release --locked
      - name: smoke test
        shell: bash
        env:
          EXE: ${{ matrix.exe }}
        run: |
          "target/release/$EXE" --version
          "target/release/$EXE" --help > /dev/null
      - name: stage the artefact
        shell: bash
        env:
          ARTEFACT: ew-${{ matrix.os }}-${{ matrix.arch }}-unsigned-dev-${{ steps.rev.outputs.short }}
          EXE: ${{ matrix.exe }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          stage="stage/$ARTEFACT"
          mkdir -p "$stage"
          cp "target/release/$EXE" "$stage/$EXE"
          # The licence texts and notices themselves (not the map in LICENSE.md, whose links are dead outside the
          # repository): the program's GPL, the CC-BY-SA symbols and the OFL fonts that it embeds.
          mkdir -p "$stage/LICENSES"
          cp LICENSES/GPL-3.0-or-later.txt LICENSES/CC-BY-SA-4.0.txt LICENSES/OFL-1.1.txt "$stage/LICENSES/"
          cp NOTICE "$stage/NOTICE"
          cp target/THIRD-PARTY-NOTICES.txt "$stage/THIRD-PARTY-NOTICES.txt"
          cp ci/cli-artefact-README.md "$stage/README.md"
          if command -v sha256sum > /dev/null; then
            digest="$(sha256sum "$stage/$EXE" | cut -d' ' -f1)"
          else
            digest="$(shasum -a 256 "$stage/$EXE" | cut -d' ' -f1)"
          fi
          {
            echo "Build"
            echo
            echo "- artefact: $ARTEFACT"
            echo "- commit: $GITHUB_SHA"
            echo "- runner: $RUNNER_LABEL"
            echo "- toolchain: Rust $RUST_TOOLCHAIN, release profile, locked dependencies"
            echo "- sha256 of $EXE: $digest"
          } >> "$stage/README.md"
          echo "ARTEFACT=$ARTEFACT" >> "$GITHUB_ENV"
          ls -l "$stage"
      - name: job summary
        if: always()
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          if [ -n "${ARTEFACT:-}" ]; then
            echo "Built \`$ARTEFACT\`: an unsigned development build, not a release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No artefact was built on $RUNNER_LABEL." >> "$GITHUB_STEP_SUMMARY"
          fi
      # A failed build or smoke test leaves nothing worth keeping (the log of the run has the failure), so this
      # upload is not `if: always()`; the summary step above is.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTEFACT }}
          path: stage/${{ env.ARTEFACT }}
          if-no-files-found: error
          retention-days: 90

  # CI-R-03 before the release pipeline (FT-333): report-only, a nightly check that gates nothing; red on any hit.
  release-check:
    name: release-check (elektrawatt, linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # x11-dl's build script asks pkg-config for 16 X library directories and writes them into the binary; with
      # `false` as the pkg-config program every lookup fails and every entry is None (doc 18 §5.4).
      PKG_CONFIG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: elektrawatt-release-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The assertions and the build share one shell, so the environment checked is the one cargo inherits.
      # --remap-path-prefix keeps the registry, toolchain and checkout paths of panic locations out of the binary
      # (Cargo's `trim-paths` is not stable on the pinned toolchain); the release build of CI-R-03 takes the same flags.
      - name: cargo build (release, PKG_CONFIG=false)
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          export RUSTFLAGS="--remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$rustup_home=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/build"
          echo "RUSTFLAGS=$RUSTFLAGS" >> "$GITHUB_ENV"
          bash ci/release-check.sh env
          cargo build -p elektrawatt --release --locked
      - name: scan the binary
        shell: bash
        run: bash ci/release-check.sh scan target/release/elektrawatt target release-check-report.md
      - name: job summary
        if: always()
        shell: bash
        run: |
          if [ -f release-check-report.md ]; then
            cat release-check-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-check report: the environment check or the build failed (see the log)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The report only; the binary is never uploaded (ID-476).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-check-report
          path: release-check-report.md
          if-no-files-found: ignore
          retention-days: 30
