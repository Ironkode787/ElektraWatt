# Per-PR CI set of gate G-M0 (docs/design/18-quality-security-release.md §5.2): CI-PR-01 lint,
# CI-PR-02/03/04 tests on Linux, Windows and macOS, CI-PR-05 headless (the evidence job of G-M1-01), CI-PR-08
# fuzz-smoke (path-filtered, 60 s per affected cargo-fuzz target on the pinned nightly; G-M1-13), CI-N-09
# verapdf (the evidence job of G-M1-02; a nightly in the catalogue, per push here), CI-PR-09 supply-chain. Job
# names are the required status checks (ci/README.md). Hardening per §5.4 and NFR-SEC-19: actions pinned by
# commit SHA with a version comment (Renovate keeps them current), container images pinned by digest (checked
# by `cargo xtask check-workflows`), read-only default token, no secrets, no test retries (NFR-MAINT-13;
# .config/nextest.toml sets retries = 0).

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  # Keep in step with rust-toolchain.toml and the workspace rust-version in Cargo.toml.
  RUST_TOOLCHAIN: "1.99.0"
  RUST_MSRV: "1.85.0"
  # The headless container of CI-PR-05: ubuntu:24.04, pinned by the digest of its multi-arch image index (Docker Hub,
  # resolved 2026-10-22). The image has no fonts, no fontconfig, no display or GPU libraries and a glibc (2.39) as
  # new as the one of the runner that builds `ew`. Update the tag and the digest together.
  HEADLESS_IMAGE: ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
  # veraPDF 1.30.3: the CLI image `verapdf/cli` of the veraPDF project on Docker Hub (a self-contained Java CLI),
  # pinned by the digest of its image manifest (resolved 2026-10-22 from the Docker Hub tag `v1.30.3`). The image is
  # only run here, with no network, never distributed. Update the version and the digest together.
  VERAPDF_VERSION: "1.30.3"
  VERAPDF_IMAGE: verapdf/cli@sha256:d565095c67a083e693aebf7d1a15784007370571053fc1aa5b502665b9a78f9c
  # The nightly of the fuzz-smoke job (CI-PR-08): the one of fuzz/rust-toolchain.toml and deep-nightly.yml (a test of
  # xtask compares the three). cargo-fuzz, pinned as in deep-nightly.yml (built from source: taiki-e/install-action has
  # no manifest for it).
  NIGHTLY_TOOLCHAIN: "nightly-2026-10-08"
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  # CI-PR-01
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: cargo fmt
        run: cargo fmt --all --check
      # An unresolvable `disallowed-methods` or `disallowed-types` path in the generated clippy.toml is only a warning,
      # which
      # `-D warnings` does not turn into an error: fail on it here (ADR-0001 amendment 2).
      - name: cargo clippy
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
          test ${PIPESTATUS[0]} -eq 0 && ! grep -q "does not refer to a reachable" clippy.log
      - name: cargo clippy (all features)
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy.log
          test ${PIPESTATUS[0]} -eq 0 && ! grep -q "does not refer to a reachable" clippy.log
      # FT-297: the cargo-fuzz crate is not a workspace member (its own workspace; it runs on a nightly), but it is
      # formatted, checked and linted here on the stable toolchain. rustup takes the toolchain from the working
      # directory (the root's rust-toolchain.toml), not from the manifest's directory, so fuzz/rust-toolchain.toml
      # does not apply; libfuzzer-sys's build script needs a C++ compiler (the runner has one), not a nightly.
      - name: fuzz crate (fmt, check, clippy)
        shell: bash
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings 2>&1 | tee clippy-fuzz.log
          test ${PIPESTATUS[0]} -eq 0 && ! grep -q "does not refer to a reachable" clippy-fuzz.log
      # FT-271: the std hash containers are `disallowed-types` in the generated clippy.toml; the sites that allow
      # them (iteration order never reaches output) are listed in ci/ordered-collections-allow.toml.
      - name: ordered collections
        run: cargo xtask check-ordered-collections
      # FT-317: the wall clock, the process environment and randomness are `disallowed-methods` in the same file
      # (doc 18 §3.5); the sites that allow them, and the calls in the reader crates, which opt out of the lint,
      # are listed in ci/disallowed-methods-allow.toml.
      - name: wall clock, environment and randomness
        run: cargo xtask check-disallowed-methods

  # CI-PR-02, CI-PR-03, CI-PR-04 (test-linux and test-linux-default; test-windows-build, -1 and -2; test-macos)
  test-linux:
    name: test-linux
    runs-on: ubuntu-24.04
    # The GPU canvas tests fail instead of skipping when no adapter is found: these runners have one (Mesa's lavapipe
    # on Linux, WARP on Windows, Metal on macOS), so a skip here would hide a broken setup (WP-S2.02 part 2, spec section 8).
    env:
      EW_REQUIRE_GPU_ADAPTER: "1"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # Mesa's software Vulkan driver (lavapipe): the GPU canvas's parity test (WP-S2.02 part 2, spec section 8 item 4)
      # needs an adapter; without one the test prints `skipped: no adapter` and passes, which proves nothing on Linux.
      - name: install Mesa's lavapipe for the GPU canvas tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers
      - name: cargo build
        run: cargo build --workspace --locked
      # FT-353 (decision log ID-527): the default-features run moved to the job test-linux-default, so that the two
      # runs, which compile separately anyway, take about 15 and 17 minutes in parallel instead of 30 in sequence.
      # The headless acceptance tests (about 2 min) and the command fuzzer's `fuzz_smoke` (15 to 19 s) run once per
      # job, here, in the all-features run: the filter that the other jobs use is the rule of .config/nextest.toml
      # and is kept equal to xtask's ONCE_PER_JOB_FILTER by a test (FT-268, FT-306).
      # Feature-gated code (for example ew-ids/testkit) is only compiled and tested with its feature on.
      - name: cargo nextest (all features, with the acceptance tests and the fuzzer)
        run: cargo nextest run --workspace --all-features --locked --profile ci
      # Names every failed nextest case as a check-run annotation (the job log needs admin rights to read).
      - name: failed tests as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          p = os.path.join("target", "nextest", "ci", "junit.xml")
          if not os.path.exists(p):
              print("::warning title=nextest::no junit.xml was written")
              raise SystemExit(0)
          n = 0
          for tc in ET.parse(p).getroot().iter("testcase"):
              f = tc.find("failure")
              if f is None:
                  f = tc.find("error")
              if f is None:
                  continue
              n += 1
              text = ((f.get("message") or "") + "\n" + (f.text or "")).strip()[:1500]
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=nextest {tc.get('classname')}::{tc.get('name')}::{text}")
          print(f"{n} failed test case(s) annotated")
          PY
      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --doc --workspace --locked
      - name: cargo test --doc (all features)
        run: cargo test --doc --workspace --all-features --locked

  test-linux-default:
    name: test-linux-default
    runs-on: ubuntu-24.04
    # The GPU canvas tests fail instead of skipping when no adapter is found: these runners have one (Mesa's lavapipe
    # on Linux, WARP on Windows, Metal on macOS), so a skip here would hide a broken setup (WP-S2.02 part 2, spec section 8).
    env:
      EW_REQUIRE_GPU_ADAPTER: "1"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # Mesa's software Vulkan driver (lavapipe): the GPU canvas's parity test (WP-S2.02 part 2, spec section 8 item 4)
      # needs an adapter; without one the test prints `skipped: no adapter` and passes, which proves nothing on Linux.
      - name: install Mesa's lavapipe for the GPU canvas tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers
      - name: cargo build
        run: cargo build --workspace --locked
      # The default-features run of the Linux test (FT-353, decision log ID-527), without the headless acceptance
      # tests and the command fuzzer, which run once per job in the all-features run of test-linux (the filter is
      # xtask's ONCE_PER_JOB_FILTER, kept equal by a test: FT-268, FT-306).
      - name: cargo nextest (without the acceptance tests and the fuzzer)
        run: cargo nextest run --workspace --locked --profile ci -E 'not (package(ew-api) and binary(acceptance)) and not (package(ew-testkit) and binary(command_fuzz))'
      # Names every failed nextest case as a check-run annotation (the job log needs admin rights to read).
      - name: failed tests as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          p = os.path.join("target", "nextest", "ci", "junit.xml")
          if not os.path.exists(p):
              print("::warning title=nextest::no junit.xml was written")
              raise SystemExit(0)
          n = 0
          for tc in ET.parse(p).getroot().iter("testcase"):
              f = tc.find("failure")
              if f is None:
                  f = tc.find("error")
              if f is None:
                  continue
              n += 1
              text = ((f.get("message") or "") + "\n" + (f.text or "")).strip()[:1500]
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=nextest {tc.get('classname')}::{tc.get('name')}::{text}")
          print(f"{n} failed test case(s) annotated")
          PY

  test-windows-build:
    name: test-windows-build
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # Windows runs the all-features suite only (FT-330, decision log ID-482) and, from FT-353 (ID-527), builds it once
      # and runs it in two halves on the nextest archive: ci run 39797238020 took 33 min 20 s for one job. Doctests
      # do not run on Windows (platform-neutral; Linux, macOS and `cargo xtask ci` run them). This job builds, saves
      # the rust-cache (on main only, as `headless` does) and uploads the archive; the two run jobs have no cache:
      # their key would be their own job name, which never saves. The tests start the CLI binaries through
      # `NEXTEST_BIN_EXE_<name>` (xtask guards that) because the archive is unpacked elsewhere than the compile-time
      # path. About 36 test files use `env!("CARGO_MANIFEST_DIR")` or `CARGO_TARGET_TMPDIR`, which only works
      # because the build and run jobs check out to the same workspace path on windows-2025.
      - name: cargo nextest archive (all features)
        shell: bash
        run: cargo nextest archive --workspace --all-features --locked --archive-file ${{ runner.temp }}/nextest-archive.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive-windows
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-windows-1:
    name: test-windows-1
    needs: test-windows-build
    runs-on: windows-2025
    # The GPU canvas tests fail instead of skipping when no adapter is found: these runners have one (Mesa's lavapipe
    # on Linux, WARP on Windows, Metal on macOS), so a skip here would hide a broken setup (WP-S2.02 part 2, spec section 8).
    env:
      EW_REQUIRE_GPU_ADAPTER: "1"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nextest-archive-windows
          # Outside the checkout: the licence-map test walks the working tree and flagged the archive in the first
          # split run (ci run 39846775852, test-windows-1).
          path: ${{ runner.temp }}/nextest-archive
      # Half 1 of 2 of the all-features suite (FT-353). nextest partitions by test, so the acceptance tests and the
      # command fuzzer, which belong to the all-features run unfiltered, each run once in total, in one partition.
      # The xtask tests run `cargo metadata`, which needs the registry sources.
      - name: cargo fetch
        shell: bash
        run: cargo fetch --locked
      - name: cargo nextest (all features, partition 1/2)
        shell: bash
        run: cargo nextest run --archive-file ${{ runner.temp }}/nextest-archive/nextest-archive.tar.zst --workspace-remap . --partition count:1/2 --profile ci
      # Names every failed nextest case as a check-run annotation (the job log needs admin rights to read).
      - name: failed tests as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          p = os.path.join("target", "nextest", "ci", "junit.xml")
          if not os.path.exists(p):
              print("::warning title=nextest::no junit.xml was written")
              raise SystemExit(0)
          n = 0
          for tc in ET.parse(p).getroot().iter("testcase"):
              f = tc.find("failure")
              if f is None:
                  f = tc.find("error")
              if f is None:
                  continue
              n += 1
              text = ((f.get("message") or "") + "\n" + (f.text or "")).strip()[:1500]
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=nextest {tc.get('classname')}::{tc.get('name')}::{text}")
          print(f"{n} failed test case(s) annotated")
          PY

  test-windows-2:
    name: test-windows-2
    needs: test-windows-build
    runs-on: windows-2025
    # The GPU canvas tests fail instead of skipping when no adapter is found: these runners have one (Mesa's lavapipe
    # on Linux, WARP on Windows, Metal on macOS), so a skip here would hide a broken setup (WP-S2.02 part 2, spec section 8).
    env:
      EW_REQUIRE_GPU_ADAPTER: "1"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nextest-archive-windows
          # Outside the checkout: the licence-map test walks the working tree and flagged the archive in the first
          # split run (ci run 39846775852, test-windows-1).
          path: ${{ runner.temp }}/nextest-archive
      # Half 2 of 2 of the all-features suite (FT-353). nextest partitions by test, so the acceptance tests and the
      # command fuzzer, which belong to the all-features run unfiltered, each run once in total, in one partition.
      # The xtask tests run `cargo metadata`, which needs the registry sources.
      - name: cargo fetch
        shell: bash
        run: cargo fetch --locked
      - name: cargo nextest (all features, partition 2/2)
        shell: bash
        run: cargo nextest run --archive-file ${{ runner.temp }}/nextest-archive/nextest-archive.tar.zst --workspace-remap . --partition count:2/2 --profile ci
      # Names every failed nextest case as a check-run annotation (the job log needs admin rights to read).
      - name: failed tests as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          p = os.path.join("target", "nextest", "ci", "junit.xml")
          if not os.path.exists(p):
              print("::warning title=nextest::no junit.xml was written")
              raise SystemExit(0)
          n = 0
          for tc in ET.parse(p).getroot().iter("testcase"):
              f = tc.find("failure")
              if f is None:
                  f = tc.find("error")
              if f is None:
                  continue
              n += 1
              text = ((f.get("message") or "") + "\n" + (f.text or "")).strip()[:1500]
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=nextest {tc.get('classname')}::{tc.get('name')}::{text}")
          print(f"{n} failed test case(s) annotated")
          PY

  test-macos:
    name: test-macos
    runs-on: macos-15
    # The GPU canvas tests fail instead of skipping when no adapter is found: these runners have one (Mesa's lavapipe
    # on Linux, WARP on Windows, Metal on macOS), so a skip here would hide a broken setup (WP-S2.02 part 2, spec section 8).
    env:
      EW_REQUIRE_GPU_ADAPTER: "1"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: cargo build
        run: cargo build --workspace --locked
      # The headless acceptance tests (about 2 min) and the command fuzzer's `fuzz_smoke` (15 to 19 s) run once per
      # job, in the all-features run below: the filter is the rule of .config/nextest.toml and is kept equal to
      # xtask's ONCE_PER_JOB_FILTER by a test (FT-268, FT-306).
      - name: cargo nextest (without the acceptance tests and the fuzzer)
        run: cargo nextest run --workspace --locked --profile ci -E 'not (package(ew-api) and binary(acceptance)) and not (package(ew-testkit) and binary(command_fuzz))'
      # Feature-gated code (for example ew-ids/testkit) is only compiled and tested with its feature on.
      - name: cargo nextest (all features, with the acceptance tests and the fuzzer)
        run: cargo nextest run --workspace --all-features --locked --profile ci
      # Names every failed nextest case as a check-run annotation (the job log needs admin rights to read).
      - name: failed tests as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          p = os.path.join("target", "nextest", "ci", "junit.xml")
          if not os.path.exists(p):
              print("::warning title=nextest::no junit.xml was written")
              raise SystemExit(0)
          n = 0
          for tc in ET.parse(p).getroot().iter("testcase"):
              f = tc.find("failure")
              if f is None:
                  f = tc.find("error")
              if f is None:
                  continue
              n += 1
              text = ((f.get("message") or "") + "\n" + (f.text or "")).strip()[:1500]
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=nextest {tc.get('classname')}::{tc.get('name')}::{text}")
          print(f"{n} failed test case(s) annotated")
          PY
      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --doc --workspace --locked
      - name: cargo test --doc (all features)
        run: cargo test --doc --workspace --all-features --locked

  # CI-PR-05 (FT-295, evidence for G-M1-01, NFR-PLAT-04, NFR-REL-11): the shipped `ew export pdf` over
  # golden/J-E-2416.ew inside a bare Linux container (ci/headless-export.sh checks inside it that there is no
  # display, no GPU, no font file and no user directory content), on one thread and on four, with no network. The PDF
  # of each run must be byte for byte the committed digest of golden/J-E-2416/expected/pdf/sha256.txt. The PNG export
  # (`ew render --page 103 --png`, FT-254) joins the job when that command exists. Why a container and what it does
  # not cover: ci/README.md.
  headless:
    name: headless
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ew-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: cargo build ew
        run: cargo build -p ew --locked
      - name: pull the container image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            docker pull "$HEADLESS_IMAGE" && exit 0
            echo "docker pull failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::docker pull of $HEADLESS_IMAGE failed three times: the job has no evidence without the image"
          exit 1
      # The container: no network, a read-only root file system, no device (so no /dev/dri), and no capability but
      # the three that the script needs: it runs its checks as root (DAC_READ_SEARCH, so that the font search reads
      # every directory) and drops to the runner's uid and gid (SETUID, SETGID; EW_UID, EW_GID) for the export. The
      # three mounts are listed in ci/headless-export.sh.
      - name: export the golden PDF in the container
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/headless"
          mkdir -p "$out"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 --cap-drop ALL \
            --cap-add DAC_READ_SEARCH --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --env EW_UID="$(id -u)" --env EW_GID="$(id -g)" \
            --volume "$PWD/target/debug/ew:/ew:ro" \
            --volume "$PWD/golden/J-E-2416.ew:/project:ro" \
            --volume "$PWD/ci/headless-export.sh:/headless-export.sh:ro" \
            --volume "$out:/out" \
            "$HEADLESS_IMAGE" sh /headless-export.sh
      - name: the PDFs are the committed digest
        shell: bash
        run: |
          set -euo pipefail
          want="$(tr -d '\n' < golden/J-E-2416/expected/pdf/sha256.txt)"
          for threads in 1 4; do
            got="$(sha256sum "$RUNNER_TEMP/headless/golden-$threads.pdf" | cut -d' ' -f1)"
            echo "$threads thread(s): $got (committed: $want)"
            test "$got" = "$want" || { echo "::error::the PDF of the headless container ($threads thread(s)) is not the committed digest of golden/J-E-2416/expected/pdf/sha256.txt"; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: headless-pdf
          path: ${{ runner.temp }}/headless
          if-no-files-found: warn
          retention-days: 14

  # CI-N-09, FT-294. The doc 18 catalogue lists CI-N-09 as a nightly; it runs here, on every pull request and push to
  # main, so that a PDF/A regression is caught where it is made, and so that its time enters the CI-time trend
  # (ci/ci-times.py reads the jobs of this workflow; docs.yml also fires on edited/labeled/unlabeled events and
  # would cancel and rebuild the job on every label change). About 5 minutes expected, not measured before its
  # first runs; it does not lengthen the 30-minute wall time of the test jobs. Not a required check until its first
  # runs are green (ci/README.md). The golden PDF is exported by the shipped binary (`ew export pdf`, the path that the
  # acceptance
  # runner's AC-15 path (c) runs in process) in three variants: the whole folio set with the model's date, the same
  # set dated by SOURCE_DATE_EPOCH, and a page selection. veraPDF 1.30.3 (image pinned by digest, run with no
  # network) validates each against PDF/A-2b. The Java runtime is inside the image, so the runner's JDK does not
  # matter. The verdict is `ci/verapdf-check.py` over the XML report, not veraPDF's exit status: it fails on any
  # non-compliant file, on a file that did not parse, on a job count that is not three and on an unreadable report.
  # The report is uploaded as the artifact `verapdf-report`; `EW_VERAPDF_REPORT=<report.xml> cargo xtask acceptance
  # --milestone <report.md>` makes the AC-13 entry of the acceptance report read it (the headless report, which does
  # not set the variable, keeps the entry `not_applicable`).
  verapdf:
    name: verapdf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ew-cli
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: verapdf-check self-test
        run: python3 -I ci/verapdf-check.py --selftest
      - name: build ew
        run: cargo build -p ew --locked
      - name: export the golden PDF variants
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pdf"
          mkdir -p "$out"
          ew=target/debug/ew
          "$ew" export pdf golden/J-E-2416.ew --out "$out/golden-all.pdf"
          SOURCE_DATE_EPOCH=1700000000 "$ew" export pdf golden/J-E-2416.ew --out "$out/golden-dated.pdf"
          "$ew" export pdf golden/J-E-2416.ew --pages 101-106,901 --out "$out/golden-pages.pdf"
          # The full export must be the committed digest, so that the file validated here is the file of G-M1-01.
          echo "$(tr -d '\n' < golden/J-E-2416/expected/pdf/sha256.txt)  $out/golden-all.pdf" | sha256sum --check --strict -
          ls -l "$out"
      - name: pull veraPDF
        shell: bash
        run: |
          for attempt in 1 2 3; do
            docker pull "$VERAPDF_IMAGE" && exit 0
            echo "docker pull failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::docker pull of $VERAPDF_IMAGE failed three times: the job has no evidence without the image"
          exit 1
      - name: validate against PDF/A-2b
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/pdf"
          # The exit status is printed and not trusted: the verdict of the next step reads the report.
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --volume "$out:/data:ro" "$VERAPDF_IMAGE" --flavour 2b --format xml \
            /data/golden-all.pdf /data/golden-dated.pdf /data/golden-pages.pdf \
            > "$out/verapdf-report.xml" 2> "$out/verapdf-stderr.txt"
          echo "veraPDF $VERAPDF_VERSION exit status: $?"
          cat "$out/verapdf-stderr.txt"
          ls -l "$out/verapdf-report.xml"
      - name: veraPDF verdict
        run: python3 -I ci/verapdf-check.py "$RUNNER_TEMP/pdf/verapdf-report.xml" --expect-jobs 3 --profile 2B --summary "$GITHUB_STEP_SUMMARY"
      - name: upload the veraPDF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verapdf-report
          path: |
            ${{ runner.temp }}/pdf/verapdf-report.xml
            ${{ runner.temp }}/pdf/verapdf-stderr.txt
            ${{ runner.temp }}/pdf/golden-*.pdf
          if-no-files-found: warn
          retention-days: 14

  # CI-PR-08 (FT-335, evidence for G-M1-13): 60 s of every cargo-fuzz target of `fuzz/` that a change of the pull request
  # can reach, on the nightly pinned in fuzz/rust-toolchain.toml, with the committed corpus as seeds. `ci/fuzz-smoke-targets.py`
  # is the path filter (the changed paths of the pull request, or of a push, against the base; a dispatch and a push without a
  # usable base run every target): a change of `fuzz/` itself or of a crate in the path-dependency closure of a target
  # (ci/fuzz-smoke-targets.toml, which a test of xtask recomputes from the Cargo.toml files) runs that target. A pull request
  # that changes none of them runs the filter and nothing else, so the job is always there for the required check and costs
  # seconds. RED for a finding (a crash, an out-of-memory, a leak or a timeout of one input: an artifact of libFuzzer), for a
  # build that fails, and for a run that ends without a verdict, the run's own bound (`timeout`, exit code 124) included: libFuzzer's
  # `-timeout=120` bounds one input, so a target that is still running after the 8 minutes is a hang the oracle missed or a broken
  # setup, and the job has no evidence. The crash inputs are uploaded with `if: always()` and committed under fuzz/regressions/<target>/ by the person who reports the finding, never
  # fixed in the change that finds it (fuzz/README.md). The nightly is for this job only; the other jobs use the stable one.
  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The repository's rust-toolchain.toml names the stable toolchain, which this job does not install; rustup takes this
      # variable before the file. Keep equal to NIGHTLY_TOOLCHAIN (a test of xtask compares them; the variable cannot read the
      # workflow's `env` context at job level).
      RUSTUP_TOOLCHAIN: nightly-2026-10-08
      # No `-D warnings` from the workflow's RUSTFLAGS: a lint that a newer nightly adds is not a finding. The debug assertions
      # and the overflow checks stay part of every oracle (cargo-fuzz's release build adds them only with `-a`), as in
      # deep-nightly.yml.
      RUSTFLAGS: ""
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      # The whole history, so that the base revision of the change is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: path filter self-test
        run: python3 -I ci/fuzz-smoke-targets.py --selftest
      - name: select the targets
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed paths against $base:"
            git diff --name-only "$base" HEAD | sed 's/^/  /'
            targets="$(git diff --name-only "$base" HEAD | python3 -I ci/fuzz-smoke-targets.py)"
          else
            echo "no base revision for a $EVENT event: every target"
            targets="$(python3 -I ci/fuzz-smoke-targets.py --all)"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          {
            echo "## Fuzz smoke (CI-PR-08)"
            echo
            if [ -n "$targets" ]; then
              echo "Targets (name:max_len): \`$targets\`"
            else
              echo "No change reaches a fuzz target: nothing to run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The pinned nightly. Inside `fuzz/` rustup takes the toolchain from fuzz/rust-toolchain.toml, the same date.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.select.outputs.targets != ''
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.select.outputs.targets != ''
        with:
          workspaces: fuzz
          shared-key: ew-fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        if: steps.select.outputs.targets != ''
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      - name: install cargo-fuzz
        if: steps.select.outputs.targets != ''
        shell: bash
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      # cargo-fuzz has no `--locked`: the committed fuzz/Cargo.lock must already be complete.
      - name: check the lock file of the fuzz crate
        if: steps.select.outputs.targets != ''
        shell: bash
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: build the targets
        id: build
        if: steps.select.outputs.targets != ''
        continue-on-error: true
        shell: bash
        working-directory: fuzz
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          set -euo pipefail
          rustc -V
          for pair in $TARGETS; do
            cargo fuzz build "${pair%%:*}"
          done
      # 60 s per target (`-max_total_time`; libFuzzer's own limits bound one input: `-timeout=120`, `-rss_limit_mb=4096`),
      # the committed seeds as the second corpus directory, the first being the working one. `timeout` is the bound of the
      # run itself, a margin over the 60 s for the corpus load and the start-up; the exit code of each target goes to the
      # results file, which the verdict reads.
      - name: cargo fuzz run (60 s per target)
        id: fuzz
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: fuzz
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          mkdir -p ../target/smoke
          : > ../target/smoke/results.txt
          for pair in $TARGETS; do
            t="${pair%%:*}"
            max_len="${pair##*:}"
            mkdir -p "target/corpus/$t"
            echo "== $t: 60 s, max_len $max_len"
            set +e
            timeout 8m cargo fuzz run "$t" "target/corpus/$t" "corpus/$t" -- \
              -max_total_time=60 -max_len="$max_len" -timeout=120 -rss_limit_mb=4096 -print_final_stats=1 \
              2>&1 | tee "../target/smoke/$t-log.txt"
            code="${PIPESTATUS[0]}"
            set -e
            echo "$t $code" >> ../target/smoke/results.txt
          done
      # The verdict: green when every target built and ended with exit code 0 and no crash, out-of-memory, timeout or leak
      # input was written. Anything else is red: an exit code that is not 0, 124 (GNU `timeout` killed the run: no verdict) included,
      # and a missing exit code (the step ended in the middle of a target).
      - name: verdict and job summary
        if: always() && steps.select.outputs.targets != ''
        shell: bash
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          red=0
          if [ "$BUILD" != "success" ]; then
            echo "::error::a fuzz target did not build: the pull request has no fuzz evidence"
            echo "A fuzz target did not build." >> "$GITHUB_STEP_SUMMARY"
            red=1
          else
            for pair in $TARGETS; do
              t="${pair%%:*}"
              code="$(sed -n "s/^$t //p" target/smoke/results.txt 2>/dev/null | head -n 1 || true)"
              found="$(find "fuzz/artifacts/$t" -maxdepth 1 -type f \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' -o -name 'leak-*' \) 2>/dev/null | sort || true)"
              {
                echo
                echo "### \`$t\`: exit code \`${code:-none}\`"
                if [ -n "$found" ]; then
                  for f in $found; do
                    echo
                    echo "- finding \`$f\` ($(wc -c < "$f") bytes); reproduce: \`cd fuzz && cargo fuzz run $t artifacts/$t/$(basename "$f")\`"
                    echo "  base64: \`$(head -c 1024 "$f" | base64 -w 0)\`"
                  done
                fi
                if [ -f "target/smoke/$t-log.txt" ]; then
                  echo
                  echo '```text'
                  tail -n 15 "target/smoke/$t-log.txt" | cut -c1-300
                  echo '```'
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$found" ]; then
                echo "::error::the fuzz target $t found a crash, an out-of-memory, a timeout or a leak; the input is in the artifact fuzz-smoke and in the job summary"
                red=1
              elif [ "$code" = "0" ]; then
                :
              elif [ "$code" = "124" ]; then
                echo "::error::the fuzz target $t did not end within its time bound (a hang the oracle missed, or a broken setup): no verdict; see the log in the artifact fuzz-smoke"
                red=1
              else
                echo "::error::the fuzz target $t ended without a verdict (exit code ${code:-none}); see the log in the artifact fuzz-smoke"
                red=1
              fi
            done
          fi
          exit "$red"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.select.outputs.targets != ''
        with:
          name: fuzz-smoke
          path: |
            target/smoke/*
            fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  # CI-PR-09
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NFR-REL-07: ICU4X_DATA_DIR swaps the ICU segmentation data at build time and changes line breaks.
      - name: assert ICU4X_DATA_DIR is unset
        shell: bash
        run: test -z "${ICU4X_DATA_DIR:-}"
      # install-action verifies the checksums of the prebuilt binaries it downloads.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-about@0.9.2
      # install-action has no prebuilt cargo-vet 0.10.2; build it from crates.io with its own lockfile.
      # RUSTFLAGS is cleared so that new rustc warnings in the tool's own code cannot break its installation.
      - name: install cargo-vet
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-vet --locked --version 0.10.2
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo audit
        run: cargo audit
      - name: cargo vet
        run: cargo vet --locked
      # ADR-0023 amendment 5: the imported audit sets in supply-chain/imports.lock carry no auditor names or e-mail addresses.
      - name: vet imports carry no auditor identity
        run: cargo xtask check-vet-imports
      - name: dependency rules
        run: cargo xtask check-deps
      # ADR-0001 amendment 2 (FT-01, ID-50): no raw read of ew-model in non-test source outside its readers.
      - name: raw-read source guard
        run: cargo xtask check-raw-read
      # CI-PR-09 feature bans: testkit, test-confirm, inspection, unchecked and egui_mcp on non-test edges only.
      - name: feature bans
        run: cargo xtask check-features
      - name: build-script allowlist
        run: cargo xtask check-build-scripts
      - name: workflow lint
        run: cargo xtask check-workflows
      # NFR-LIC-08: the third-party notice file must generate, so a crate without a usable licence fails the PR.
      # The release pipeline (CI-R-07, WP-S6.07) ships the file; here it is only generated, not uploaded.
      - name: third-party notices
        run: cargo about generate -o target/THIRD-PARTY-NOTICES.txt ci/third-party-notices.hbs
      # MSRV of the permissive crates (NFR-MAINT-03, 18 §6.2), built against an MSRV lockfile produced by
      # the MSRV-aware resolver, so the application lockfile can move ahead. The committed Cargo.lock is not
      # modified in the repository; the generated one lives only in this job.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - name: MSRV check of the permissive crates
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          cargo +"$RUST_MSRV" generate-lockfile
          cargo +"$RUST_MSRV" check --locked \
            -p ew-units -p ew-ids -p ew-mltext -p ew-rds -p ew-schema -p ew-format -p ew-interop-api \
            -p ew-dl -p ew-step-proto -p ew-memo -p ew-plcaddr -p ew-caex -p ew-devdesc -p ew-ewpp
