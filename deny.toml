# cargo-deny 0.20 configuration (ADR-0023 decision 1, NFR-SEC-10, NFR-LIC-04). Run: `cargo deny check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail (the default). Yanked crates fail.
yanked = "deny"
# "Unmaintained" advisories fail for crates the workspace depends on directly. Each one needs an owner
# decision within 90 days (replace, vendor with an owner, or a dated `ignore` entry with a reason).
unmaintained = "workspace"
ignore = []

[licenses]
# The NFR-LIC-04 allowlist (shared by ADR-0023 and ADR-0024). Not yet listed, by decision:
# - LGPL-2.1: OCCT, allowed in ew-step-worker only; added as a per-crate exception with that work package.
# - BSL-1.0: added only if `cargo deny list` shows it (NFR-LIC-04).
# - the osifont expression: only if ADR-0028 bundles that font.
# GPL-2.0-only, AGPL and non-OSI licences are never added.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
]
confidence-threshold = 0.93
# The list is the project-wide policy; entries not used by the current graph are expected.
unused-allowed-license = "allow"
# The workspace's own crates are `publish = false`; their licences (GPL layer included) are checked by the
# licence-map job of CI-PR-10 against ci/licence-map.toml, not here.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version; they are not wildcards in the crates.io sense.
allow-wildcard-paths = true
# Crate bans arrive with the dependencies they concern, e.g. crates whose build scripts download binaries
# (C-5, ADR-0023 "Bans: downloader build scripts").
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
