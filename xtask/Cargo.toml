[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Repository policy checks (crate-dependency rules, build-script allowlist, workflow pinning, licence map and boundary, anonymisation guard, DCO, governance files) and the local mirror of the per-PR CI set."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cargo_metadata.workspace = true
# `gen-icons` (WP-S2.17 part 6, D9): SVG path parsing for the icon table; already in the graph through ew-dl and
# ew-render2d with the same features, no new package.
kurbo = { version = "0.13.1", default-features = false, features = ["std"] }
serde.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
spdx.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
uuid = { version = "1.26", default-features = false, features = ["v5"] }
