# One profile. A test is never retried: a test that fails now and then is fixed or removed.
[profile.default]
retries = 0
fail-fast = false
# Only failures and the summary are printed, each failure once more at the end.
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate-final"
success-output = "never"
# A hung test is ended after two minutes and fails under its name.
slow-timeout = { period = "60s", terminate-after = 2 }

# The long tests: the acceptance run, the command fuzzer, the memo oracle and the page output take about two minutes
# on a busy machine.
[[profile.default.overrides]]
filter = 'binary(acceptance) or binary(command_fuzz) or binary(memo_oracle) or binary(page_output)'
slow-timeout = { period = "60s", terminate-after = 10 }
