# The ElektraWatt cargo workspace. Crate layout and dependency rules: docs/design/04-architecture.md §3;
# `cargo xtask rules` enforces them against ci/dep-rules.toml.

[workspace]
resolver = "3"
members = ["crates/*", "bin/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# MSRV of the permissive crates (docs/design/18-quality-security-release.md §6.2); the application itself
# builds with the exact toolchain of rust-toolchain.toml.
rust-version = "1.85"
repository = "https://github.com/Ironkode787/ElektraWatt"

# The versions that more than one member shares; a crate used by one member is pinned in that member's manifest.
[workspace.dependencies]
anyhow = "1.0.104"
# Declares the tests/it modules of each test binary (automod::dir!).
automod = "1.0.17"
cargo_metadata = "0.23.1"
# The XLSX reader of the parts import (ew-import-catalog): miniz_oxide inflates the archive's
# entries with an output cap, quick-xml streams the workbook's XML. Both at the versions the graph already holds
# (png's miniz_oxide, wayland-scanner's quick-xml) and with no feature beyond those the graph enables: a ZIP crate
# would turn on flate2's zlib-rs backend, through which krilla compresses, and change the PDF bytes.
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
quick-xml = { version = "=0.41.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
spdx = "0.13.6"
toml = "1.1.8"
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# A small, deliberate set on top of clippy's defaults. `cargo xtask check` runs clippy with `-D warnings`, so each
# `warn` below fails the check.
[workspace.lints.clippy]
# No debugging leftovers in committed code.
dbg_macro = "warn"
# Unfinished code paths are tracked in issues, not left as panics.
todo = "warn"
unimplemented = "warn"
# Any future `unsafe` exception carries a SAFETY comment (NFR-SEC-04).
undocumented_unsafe_blocks = "warn"
# Leaking resources is never intended.
mem_forget = "warn"

# The workspace's own crates build at opt-level 1 in dev and test builds. Most tests open the golden project, and
# loading and deriving it in unoptimised code was most of their time: the tests of ew-viewmodel ran in 71 s instead of
# 157 s with the crates below it optimised (2026-11-11, one run). Debug assertions and overflow checks stay on.
[profile.dev]
opt-level = 1

# The three crates where most edits happen stay at opt-level 0, which compiles fastest; their own code is not where
# the tests spend their time.
[profile.dev.package.ew-api]
opt-level = 0

[profile.dev.package.ew-viewmodel]
opt-level = 0

[profile.dev.package.ew-ui]
opt-level = 0

# Dependencies build at opt-level 1 too, and without debug info: every test binary's PDB had carried the line tables
# of the whole dependency tree (wgpu, naga, egui, windows), about 285 MB each. The workspace's own crates take the
# debug info that `CARGO_PROFILE_DEV_DEBUG` sets (none in `.claude/settings.json`); a panic message keeps its file and
# line without it.
[profile.dev.package."*"]
opt-level = 1
debug = false

# kurbo stays at opt-level 0: an optimiser may merge a `sin` and a `cos` of one angle into one call whose last bit
# differs (seen on macOS), and the icon generator's coordinates then differ from the committed table.
[profile.dev.package.kurbo]
opt-level = 0

# The confidential-token rule of `cargo xtask rules` hashes every word n-gram of the repository (about 2.5 million
# SHA-256 digests) inside xtask; optimised, it takes a few seconds.
[profile.dev.package.xtask]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3
