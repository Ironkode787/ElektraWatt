# The ElektraWatt cargo workspace. Crate layout and dependency rules: docs/design/04-architecture.md §3;
# the rules are enforced by `cargo xtask check-deps` against ci/dep-rules.toml.

[workspace]
resolver = "3"
members = ["crates/*", "bin/*", "xtask"]
# The cargo-fuzz crate builds on a nightly toolchain with sanitizer instrumentation and is its own workspace
# (fuzz/Cargo.toml, FT-297): `cargo build --workspace` and `cargo xtask ci` on the stable toolchain never see it.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV of the permissive crates (docs/design/18-quality-security-release.md §6.2); the application itself
# builds with the exact toolchain of rust-toolchain.toml.
rust-version = "1.85"
repository = "https://github.com/Ironkode787/ElektraWatt"

# Only the development tools (xtask) use external crates so far. Product crates get theirs with their own
# work packages.
[workspace.dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
# The XLSX reader of the parts import (ew-import-catalog, WP-S1.19 part 4, D11): miniz_oxide inflates the archive's
# entries with an output cap, quick-xml streams the workbook's XML. Both at the versions the graph already holds
# (png's miniz_oxide, wayland-scanner's quick-xml) and with no feature beyond those the graph enables: a ZIP crate
# would turn on flate2's zlib-rs backend, through which krilla compresses, and change the PDF bytes.
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
quick-xml = { version = "=0.41.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
spdx = "0.13.6"
toml = "1.1.8"
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# A small, deliberate set on top of clippy's defaults. CI runs clippy with `-D warnings`, so each `warn`
# below blocks a merge.
[workspace.lints.clippy]
# No debugging leftovers in committed code.
dbg_macro = "warn"
# Unfinished code paths are tracked in issues, not left as panics.
todo = "warn"
unimplemented = "warn"
# Any future `unsafe` exception carries a SAFETY comment (NFR-SEC-04).
undocumented_unsafe_blocks = "warn"
# Leaking resources is never intended.
mem_forget = "warn"

# The anonymisation guard (`cargo xtask check-anonymisation`) hashes every word n-gram of the repository (about
# 2.5 million SHA-256 digests). The hashing code is generic and is instantiated inside xtask, so xtask itself is
# optimised in the dev profile; that keeps the guard at a few seconds. Product crates are unaffected.
# Dependencies build at opt-level 1 in dev and test builds: the test suite runs about 20 % faster (workspace nextest
# 180 s -> 143 s) for about 50 s more on a clean build (cycle 36, measured on the owner's machine). The workspace's
# own crates stay at opt-level 0.
# Dependencies also build without debug info; the workspace's own crates keep the profile's line tables (owner,
# 2026-10-31). Every test binary's PDB had carried the line tables of the whole dependency tree (wgpu, naga, egui,
# windows), about 285 MB each and 83 of a lane's 111 GB of `target`. Panic messages keep their file and line without
# debug info (`#[track_caller]` locations).
[profile.dev.package."*"]
opt-level = 1
debug = false

# kurbo stays at opt-level 0, kept for portability (macOS is no longer a CI or supported platform, ID-880): on
# macOS, LLVM's optimiser merges a `sin` and a `cos` of one angle into Apple's `__sincos_stret`, whose last bit can
# differ, and the icon generator's arcs-to-cubics coordinates (rounded to 1/1000) then differ from the committed
# table (historical: CI on the cycle-36 delivery, the former test-macos and test-macos-all-features jobs).
[profile.dev.package.kurbo]
opt-level = 0

[profile.dev.package.xtask]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3
