# Overlay for `dsh --profile headless` when the DeepSeek harness codes for this repository under Claude Code's
# orchestration (see CLAUDE.md "DeepSeek coder (dsh)"). dsh-task.py passes it with `--patch`, together with a per-round
# overlay that selects the model, reasoning effort and permissions. A row's `config` replaces that plugin's whole config.

# No project instruction files: the default AGENTS.md/CLAUDE.md chain would load CLAUDE.md, the orchestrator's routing
# rules, which would mislead the coder. dsh-task.py sets DSH_AGENTS_HOME to this directory instead, so the user-global
# chain loads .claude/deepseek/AGENTS.md, the coder brief (candidates here may only be bare file names).
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: []
    localInstructionFileCandidates: []
