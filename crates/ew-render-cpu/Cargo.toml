[package]
name = "ew-render-cpu"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "CPU renderer: GPU-less fallback, thumbnails, golden PNGs and banded printing."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-dl = { path = "../ew-dl" }
# The CPU rasteriser (ARCH §3, ADR-0015 decision 3). Default features off: `std` and the glyph renderer
# (`text`, glyph outlines from the bundled font bytes) on the u8 pipeline; PNG encoding uses `png` directly.
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
# PNG encoding with fixed settings (FR-OUT-014; already in the graph through vello_cpu's tree).
png = "0.18.1"
# JPEG image items (FT-406, decision log ID-605): the version already in the graph through tiff, image and krilla
# (licence `MIT OR Apache-2.0 OR Zlib`, no build script); a new edge, no new package.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
# Validates a font file when it is first resolved (the version vello_cpu's glyph stack uses).
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[dev-dependencies]
# Test pages shape their text with the bundled fonts.
ew-text = { path = "../ew-text" }
ew-units = { path = "../ew-units" }
sha2 = { workspace = true }
