[package]
name = "ew-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Save protocol, lock file, journal, recovery, watcher, external-change diff, transport, as-built archive and git integration."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The format: paths, canonical lines, manifest, reader; and, re-exported, the record types of ew-schema.
ew-format = { path = "../ew-format" }
# The writer reads rows untracked (ARCH §3 rule 1, ADR-0001 amendment 2): `ew-store` is one of the three
# crates allowed to enable `raw-read` (ci/dep-rules.toml).
ew-model = { path = "../ew-model", features = ["raw-read"] }
# The lock record and the journal lines (doc 05 §7.1, §8.1); rows as JSON for the journal's field diffs.
serde_json = "1.0.154"
# The asset purge hashes asset files while it streams them (FT-380 review fix 9; already in the graph through
# ew-format).
sha2 = { workspace = true }
# The as-built archive's deflate (WP-S1.18 D11): the own deterministic ZIP writer and reader (`zip`), on the raw deflate
# already in the graph through ew-import-catalog and png (decision log ID-827); no ZIP crate.
miniz_oxide.workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The fresh temporary directory of the tests (FT-569; dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../ew-testdir" }
