[package]
name = "ew-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "rhai automation bindings over queries and commands."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-commands = { path = "../ew-commands" }
ew-rhai = { path = "../ew-rhai" }
ew-hack = { version = "0.1.0", path = "../ew-hack" }

[dev-dependencies]
# Only carries the test-only feature to every test build (ci/dep-rules.toml, `[[uniform_test_features]]`).
ew-commands = { path = "../ew-commands", features = ["testkit"] }
