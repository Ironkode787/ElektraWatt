[package]
name = "ew-ids"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Typed identifiers: UUIDv7 for new records, UUIDv5 for instantiated, imported and generated ones."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# ADR-0004 pins uuid 1.28.0, which Cargo.lock carries. The requirement stays at 1.26, the newest line whose
# rust-version is 1.85, so the MSRV job of the permissive crates can resolve a compatible version.
uuid = { version = "1.26", default-features = false, features = ["std", "v5"] }
getrandom = "0.4.3"
serde.workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
