[package]
name = "ew-ids"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Typed identifiers: UUIDv7 for new records, UUIDv5 for instantiated, imported and generated ones, and a per-session interner."
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Seeded, reproducible UUIDv7 source for tests and snapshots (docs/design/18-quality-security-release.md
# §2.2). Test-only by policy: the release pipeline asserts that this feature is absent (CI-R-09).
testkit = ["dep:chacha20", "dep:rand_core"]

[dependencies]
# ADR-0004 pins uuid 1.28.0, which Cargo.lock carries. The requirement stays at 1.26, the newest line whose
# rust-version is 1.85, so the MSRV job of the permissive crates can resolve a compatible version.
uuid = { version = "1.26", default-features = false, features = ["std", "v5"] }
getrandom = "0.4.3"
serde.workspace = true
# The same lines proptest uses (rand 0.10), so the graph holds one getrandom and one rand_core.
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"], optional = true }
rand_core = { version = "0.10.1", default-features = false, optional = true }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
