[package]
name = "ew-reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Built-in report row queries, sandboxed user SQL reports, pagination into virtual pages, and XLSX and CSV tables."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-derive = { path = "../ew-derive" }
ew-sqlview = { path = "../ew-sqlview" }
# The open-items list (`ew_checks::open_items`, WP-S3.06 D8): the open findings of the open-item rules.
ew-checks = { path = "../ew-checks" }
ew-text = { path = "../ew-text" }
# `profile_tables` reads the provisional `colour_profile` and `size_profile` members of the project settings
# (`ProjectSettings.extra`, doc 03 §5.1) as JSON values.
serde_json = "1.0.154"
# The XLSX writer's container (WP-S3.08 D3, decision log ID-1145): the own deterministic ZIP, no ZIP or XLSX crate.
ew-zip = { path = "../ew-zip" }
ew-hack = { version = "0.1.0", path = "../ew-hack" }
# The `Exporter` trait the table writers implement (WP-S3.09 D14, decision log ID-1016); its crates are in the graph.
ew-interop-api = { path = "../ew-interop-api" }

[dev-dependencies]
automod.workspace = true
# Unit tests build small snapshots (`Model::from_records`) to run row queries over a `Q`; no `raw-read`.
ew-model = { path = "../ew-model" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
