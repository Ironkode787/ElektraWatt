[package]
name = "ew-reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Built-in report row queries, sandboxed user SQL reports, pagination into virtual pages, and XLSX and CSV tables."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-derive = { path = "../ew-derive" }
# The open-items list (`ew_checks::open_items`): the open findings of the open-item rules.
ew-checks = { path = "../ew-checks" }
# `profile_tables` reads the provisional `colour_profile` and `size_profile` members of the project settings
# (`ProjectSettings.extra`, doc 03 §5.1) as JSON values.
serde_json = "1.0.154"
# The XLSX writer's container: the own deterministic ZIP, no ZIP or XLSX crate.
ew-zip = { path = "../ew-zip" }
# The words of the lists by key (`texts/`, `ew_reports::words`), rendered by the one renderer.
ew-l10n = { path = "../ew-l10n" }
ew-hack = { version = "0.3.5", path = "../ew-hack" }
ew-ids = { path = "../ew-ids" }
ew-mltext = { path = "../ew-mltext" }
# The revision stamp of a row set; the unit tests' model snapshots (`Model::from_records`, no `raw-read`).
ew-model = { path = "../ew-model" }
ew-plcaddr = { path = "../ew-plcaddr" }
ew-schema = { path = "../ew-schema" }
ew-units = { path = "../ew-units" }

[build-dependencies]
# The generator of the key table that `build.rs` writes.
ew-l10n = { path = "../ew-l10n" }

[dev-dependencies]
automod.workspace = true
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
