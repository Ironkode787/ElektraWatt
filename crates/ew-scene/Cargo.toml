[package]
name = "ew-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Model to display lists per page and layer, forms engine, spatial index and hit-testing."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-reports = { path = "../ew-reports" }
ew-dl = { path = "../ew-dl" }
ew-text = { path = "../ew-text" }
ew-schema = { path = "../ew-schema" }
ew-units = { path = "../ew-units" }
ew-mltext = { path = "../ew-mltext" }
ew-ids = { path = "../ew-ids" }
# `extra` members (layout hints such as `ew.frame.line_width`) are `serde_json::Value`s.
serde_json = "1.0.154"

[dev-dependencies]
sha2 = { workspace = true }
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
