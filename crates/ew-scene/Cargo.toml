[package]
name = "ew-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "A page as display lists per layer, the forms engine, and the entities its items draw."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Its pure functions only, never a `Q`: the drawn path of a connection (`route::connection_polyline` builds on
# `ew_derive::stored_path`), one rule for the page, normaliser 7 and EW-TERM-006, and
# a representation's text frame.
ew-derive = { path = "../ew-derive" }
# The page as the layout sees it, and the one text placer that the labels layer draws its texts with
# (docs/design/06a-drafting.md §5).
ew-drafting = { path = "../ew-drafting" }
ew-dl = { path = "../ew-dl" }
ew-text = { path = "../ew-text" }
ew-schema = { path = "../ew-schema" }
ew-units = { path = "../ew-units" }
ew-mltext = { path = "../ew-mltext" }
ew-ids = { path = "../ew-ids" }
# `extra` members (layout hints such as `ew.frame.line_width`) are `serde_json::Value`s.
serde_json = "1.0.154"
# SVG assets parsed, normalised and turned into display-list paths (usvg yes, resvg
# no). Default features off: no text shaping, no system fonts, no svgz, no writer; external files and images are
# never resolved (the resolvers are set to nothing). Licence `Apache-2.0 OR MIT` for this exact version.
usvg = { version = "=0.48.1", default-features = false }
# PDF underlays rasterised (doc 14 §5.5, FR-IMP-030; ADR-0015 amendment 1). Default features off but the embedded
# standard fonts: no SIMD detection, no CJK character maps. Licence `Apache-2.0 OR MIT`.
hayro = { version = "=0.8.0", default-features = false, features = ["embed-fonts"] }
ew-hack = { version = "0.3.5", path = "../ew-hack" }

[dev-dependencies]
automod.workspace = true
# The expected files and their re-bless (dev-only crate).
ew-testdir = { path = "../ew-testdir" }
sha2 = { workspace = true }
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
