[package]
name = "ew-mltext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Multilingual text with EPLAN neutral-xor-languages semantics, BCP 47 language tags, NFC identifiers, confusable detection and natural-sort keys."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
unicode-normalization.workspace = true
# UTS #39 confusable skeletons, mixed-script detection and the General Security Profile (ADR-0005).
unicode-security = "0.1.2"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
