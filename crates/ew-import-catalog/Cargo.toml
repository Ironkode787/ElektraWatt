[package]
name = "ew-import-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Parts import from CSV and XLSX, later BMEcat and ETIM xChange."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-interop-api = { path = "../ew-interop-api" }
# The record types and IDs come through ew-interop-api's re-exports (`ew_schema`, `ew_ids`; D11): no other edge.
# XLSX (D11): the archive's entries inflated with a hard output cap, the workbook's XML streamed.
miniz_oxide.workspace = true
quick-xml.workspace = true
# Parts are built as their JSON form and read back through `ew_schema`'s strict readers; the item hash.
serde_json = "1.0.154"
sha2.workspace = true
# The column map file (`<config dir>/imports/<source key>.toml`, D11).
serde.workspace = true
toml.workspace = true
