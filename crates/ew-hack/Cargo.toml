# The workspace-hack crate of cargo-hakari (RD43 R17, ci/README.md "Workspace hack"): the section between the
# HAKARI markers is generated by `cargo hakari generate` (`cargo xtask settle`, step `hakari`); never edit it by hand.

[package]
name = "ew-hack"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "The workspace-hack crate: unified third-party features of the GPL members (managed by cargo-hakari)."
repository.workspace = true
publish = false

[lints]
workspace = true

### BEGIN HAKARI SECTION
[dependencies]
ahash = { version = "0.8", features = ["no-rng", "serde"] }
