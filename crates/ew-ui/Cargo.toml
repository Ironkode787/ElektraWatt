[package]
name = "ew-ui"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "egui widgets, canvas host, tools, command palette, keymaps and the action registry."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-viewmodel = { path = "../ew-viewmodel" }
ew-render2d = { path = "../ew-render2d" }
ew-render-cpu = { path = "../ew-render-cpu" }
# The display list and the lengths the canvas paints, named by their own crates (foundation edges, ARCH §3 rule 6).
ew-dl = { path = "../ew-dl" }
ew-units = { path = "../ew-units" }
# The widgets (AccessKit is a hard dependency of egui 0.37, not a feature). `default_fonts` is off: egui's default fonts carry the Ubuntu font under its own licence, which
# deny.toml does not allow; the UI uses the bundled Noto Sans.
egui = { version = "=0.37.0", default-features = false }
# Docking: the dock tree of the project view. 0.18.0 is the release for egui 0.37 (ADR-0014 named 0.17.1,
# which needs egui 0.36). The serde feature is off: the workspace files use the toolkit-neutral layout of
# ew-viewmodel.
egui_tiles = { version = "=0.18.0", default-features = false }
# The navigators' table mode: the virtualised table with a frozen key column. 0.11.0 is the
# release for egui 0.37. It turns on egui's `serde` feature, which brings `enumn` through `accesskit/serde`; with
# `vec1` that makes three new packages (enumn accepted by the orchestrator, transitive via egui/serde).
egui_table = { version = "=0.11.0", default-features = false }
# The canvas texture is registered with the renderer of eframe's render state (ADR-0014 as built).
# No default features: the wgpu backends are ew-render2d's, per operating system. Locked through eframe.
egui-wgpu = { version = "=0.37.0", default-features = false }
# The headless transcript.
serde_json = "1.0.154"
# The frame spans of the canvas (`frame`, `frame.input`, `frame.scene`, `frame.render`, `frame.paint`);
# already in the graph through ew-memo, no new package.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Picks the regular face among the bundled fonts by its family name and weight (already in the graph through
# ew-render-cpu).
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# A visual run's frame line carries its PNG's SHA-256 (the dev-dependency below, promoted; already
# in the graph through ew-api, no new package).
sha2 = { workspace = true }
ew-hack = { version = "0.3.5", path = "../ew-hack" }

[dev-dependencies]
automod.workspace = true
# Interaction tests and the accessible-name walker, without rendering (no snapshot or wgpu feature: it would
# bring more packages; the chrome snapshots use `tests/it/snapshots/offscreen.rs`).
egui_kittest = { version = "=0.37.0", default-features = false }
# The row dumps and the registry of the tests.
ew-commands = { path = "../ew-commands" }
# The snapshot gate reads its blessed PNG files (the version ew-render-cpu writes them with).
png = "0.18.1"
# The fresh temporary directory of the tests (dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../ew-testdir" }
