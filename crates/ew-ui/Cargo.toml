[package]
name = "ew-ui"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "egui widgets, canvas host, tools, command palette, keymaps and the action registry."
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# WP-S2.17 DL6: the chrome snapshot tests and their pixel gate (Windows only), rendered offscreen with this crate's
# egui-wgpu and ew-render2d's headless device (no new package; D7 as amended). Without it they are not compiled.
snapshots = []

[dependencies]
ew-viewmodel = { path = "../ew-viewmodel" }
ew-render2d = { path = "../ew-render2d" }
ew-render-cpu = { path = "../ew-render-cpu" }
ew-render3d = { path = "../ew-render3d" }
# The widgets (AccessKit is a hard dependency of egui 0.37, not a feature). `default_fonts` is off: egui's default fonts carry the Ubuntu font under its own licence, which
# deny.toml does not allow; the UI uses the bundled Noto Sans (WP-S2.01 spec section 4).
egui = { version = "=0.37.0", default-features = false }
# Docking (FT-309): the dock tree of the project view. 0.18.0 is the release for egui 0.37 (ADR-0014 named 0.17.1,
# which needs egui 0.36). The serde feature is off: the workspace files use the toolkit-neutral layout of
# ew-viewmodel.
egui_tiles = { version = "=0.18.0", default-features = false }
# The navigators' table mode (WP-S2.06 part 3, D9): the virtualised table with a frozen key column. 0.11.0 is the
# release for egui 0.37. It turns on egui's `serde` feature, which brings `enumn` through `accesskit/serde`; with
# `vec1` that makes three new packages (enumn accepted by the orchestrator, cycle 31, transitive via egui/serde).
egui_table = { version = "=0.11.0", default-features = false }
# The canvas texture is registered with the renderer of eframe's render state (WP-S2.02 part 2, ADR-0014 as built).
# No default features: the wgpu backends are ew-render2d's, per operating system (FT-328). Locked through eframe.
egui-wgpu = { version = "=0.37.0", default-features = false }
# The headless transcript.
serde_json = "1.0.154"
# The frame spans of the canvas (`frame`, `frame.input`, `frame.scene`, `frame.render`, `frame.paint`; WP-S2.02
# section 9); already in the graph through ew-memo, no new package.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Picks the regular face among the bundled fonts by its family name and weight (already in the graph through
# ew-render-cpu).
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }

[dev-dependencies]
# Interaction tests and the accessible-name walker, without rendering (no snapshot or wgpu feature: WP-S2.17 D7 would
# bring packages beyond the spec's, see the part 1 report; the chrome snapshots use `tests/offscreen`).
egui_kittest = { version = "=0.37.0", default-features = false }
# WP-S2.09 part 1: the window's running export is held at a gate (`ShellModel::set_job_gate_for_tests`, feature
# `testkit`, dev-only by `ci/dep-rules.toml`); the normal edge above is the same package.
ew-viewmodel = { path = "../ew-viewmodel", features = ["testkit"] }
# WP-S2.17 part 1: the SemiBold face is pinned by SHA-256 in a unit test (ADR-0028 recommendation 6).
sha2 = { workspace = true }
# WP-S2.17 DL6: the snapshot gate reads its blessed PNG files (the version ew-render-cpu writes them with).
png = "0.18.1"

# The canvas frame-time bench (WP-S2.02 section 9); `cargo xtask perf-gate` runs it once per gate run.
[[bench]]
name = "canvas"
harness = false
