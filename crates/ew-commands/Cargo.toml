[package]
name = "ew-commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Commands, transaction builder, normalisers, validators, numbering engine, history, previews, macros and import application."
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The row dumps (`rows`), `Preview::ops` and `HistoryEntry::transaction` for tests (ARCH §3 rule 1, F9). Test-only
# by policy: `cargo xtask check-features` allows it on dev-dependency edges only, and every package whose test build
# reaches this crate requests it on one, so every test build compiles the crate the same way (ci/dep-rules.toml,
# `[[uniform_test_features]]`).
testkit = []

[dependencies]
# The tracked read layer; no query is used yet (previews and prevent rules read through it from WP-S1.05 on).
ew-derive = { path = "../ew-derive" }
# A transaction reads the `before` rows of its ops: the untracked read API (ARCH §3 rule 1, ADR-0001
# amendment 1), allowed on this normal edge by `cargo xtask check-features`.
ew-model = { path = "../ew-model", features = ["raw-read"] }
ew-schema = { path = "../ew-schema" }
ew-ids = { path = "../ew-ids" }
ew-units = { path = "../ew-units" }
ew-mltext = { path = "../ew-mltext" }
ew-rds = { path = "../ew-rds" }
serde.workspace = true
# Command parameters as JSON (`AnyCommand`, the journal form of a transaction), the field paths of
# `fields.set` and of `diff_model`.
serde_json = "1.0.154"
# The JSON Schema of every command's parameters (FR-EXT-015, doc 17 §2.1).
schemars = "1.2.3"
# `library.embed` checks a copy's lineage hash (doc 05 §13.2, the rule of EW-CORE-014).
sha2.workspace = true
ew-hack = { version = "0.1.0", path = "../ew-hack" }

[dev-dependencies]
automod.workspace = true
# The crate's own integration tests read records through `testkit` (`rows`, `Preview::ops`, history ops;
# F9: without the feature those untracked row dumps are crate-private).
ew-commands = { path = ".", features = ["testkit"] }
# The seeded, reproducible ID source of the tests (doc 18 §2.2; dev-only crate).
ew-testids = { path = "../ew-testids" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
