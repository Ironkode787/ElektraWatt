#
# The identifier sets shipped in ew-rds (ADR-0026 decisions 1-3, FR-NUM-003): for each set, the letter code a
# function category gets and the letter codes it also accepts without an EW-RDS-003 finding.
#
# Rules for this file:
# - No standard text or table is copied (NFR-COMP-05). Category descriptions are written by the project.
# - Every mapping carries `verified`. No mapping has been checked against a licensed copy of the standards yet,
#   so all are `false` and EW-RDS-003 findings stay advisory (ADR-0026, Consequences). Set a mapping to `true`
#   only after that check, and say in the commit which edition and table it was checked against.
# - Sources of the unverified mappings: docs/research/standards.md §1.4-§1.5 (2009 single letters as quoted by
#   the QElectroTech documentation, 2019 classes after the CCI table, IEC 60750 letters from author knowledge)
#   and ADR-0026 amendment 1 (Q with QM for directional valves, S for main and door switches, U for
#   valve-terminal assemblies and modules in the 2009 set).
# - A category key is the first level of an FnDef category (docs/design/07-symbols-parts-macros.md §2.4),
#   UpperCamelCase ASCII. An optional `group` (the second level) refines it; a lookup tries the
#   category-and-group row first, then the category row.
# - Letter codes are 1-3 letters A-Z. I and O never appear in a letter code (EW-RDS-007), and a set's
#   `reserved` letters are never the first letter of one of its codes.
# - A category may be missing from a set: its devices then get no suggestion from that set.
#
# src/sets/data.rs is generated from this file. After a change, run
#     EW_RDS_BLESS=1 cargo test -p ew-rds --test identifier_sets
# and commit both files; the test fails while they disagree.

[[set]]
key = "EN81346-2:2009"
title = "EN 81346-2:2009 single-letter classes"
reserved = ["D"]

[[set]]
key = "IEC81346-2:2019"
title = "IEC 81346-2:2019 classes and subclasses"
# A is not used as a class code; D, J, L, V, Y and Z are reserved.
reserved = ["A", "D", "J", "L", "V", "Y", "Z"]

[[set]]
key = "IEC60750-legacy"
title = "IEC 60750 / DIN 40719-2 legacy letters"
reserved = []

