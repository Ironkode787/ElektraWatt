[package]
name = "ew-zip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "The own deterministic ZIP writer and its strict reader: the container of the as-built archive and of XLSX."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The raw deflate of the writer and the reader: already in the graph through
# ew-import-catalog and png; no ZIP crate.
miniz_oxide.workspace = true
ew-hack = { version = "0.3.5", path = "../ew-hack" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
