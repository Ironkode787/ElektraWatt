[package]
name = "ew-zip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "The own deterministic ZIP writer and its strict reader: the container of the as-built archive and of XLSX."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The raw deflate of the writer and the reader (WP-S1.18 D11, WP-S3.08 D3): already in the graph through
# ew-import-catalog and png (decision log ID-827, ID-1145); no ZIP crate.
miniz_oxide.workspace = true
ew-hack = { version = "0.0.0", path = "../ew-hack" }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
