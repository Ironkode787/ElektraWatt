[package]
name = "ew-l10n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "A text for a person by key and arguments, the key tables of the crates that say something, and the one renderer over Fluent."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The renderer (`render`): a language's Fluent sources as one bundle (ADR-0024: MIT OR Apache-2.0), the messages of a
# source (`fluent-syntax`) and the bundle's language (`unic-langid`), at the versions fluent-bundle itself uses.
fluent-bundle = { version = "=0.16.0", default-features = false }
fluent-syntax = { version = "=0.12.0", default-features = false }
unic-langid = { version = "=0.9.6", default-features = false }
# A name a person wrote in several languages as an argument (`TextArg::Ml`), in the reader's language.
ew-mltext = { path = "../ew-mltext" }
ew-hack = { version = "0.3", path = "../ew-hack" }
