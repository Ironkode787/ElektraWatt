[package]
name = "ew-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "The Session facade shared by every front-end."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-store = { path = "../ew-store" }
ew-commands = { path = "../ew-commands" }
ew-checks = { path = "../ew-checks" }
ew-sqlview = { path = "../ew-sqlview" }
ew-library = { path = "../ew-library" }
ew-scene = { path = "../ew-scene" }
ew-export = { path = "../ew-export" }
ew-plc = { path = "../ew-plc" }
ew-panel = { path = "../ew-panel" }
ew-mfg = { path = "../ew-mfg" }
ew-import-qet = { path = "../ew-import-qet" }
ew-import-eplan = { path = "../ew-import-eplan" }
ew-import-dxf = { path = "../ew-import-dxf" }
ew-import-catalog = { path = "../ew-import-catalog" }
ew-import-tables = { path = "../ew-import-tables" }
ew-script = { path = "../ew-script" }
ew-plugin-host = { path = "../ew-plugin-host" }
ew-jobs = { path = "../ew-jobs" }
# The snapshot type and its revision. Without `raw-read`: the Session hands snapshots out and never reads rows
# itself (ARCH §3 rule 1: the untracked read API stays with ew-derive, ew-commands and ew-store).
ew-model = { path = "../ew-model" }
# The derivation notes of a snapshot (unknown profile, schemes not applied, default frame, malformed
# settings), surfaced as findings on load and on demand. Tracked reads only: no `raw-read`.
ew-derive = { path = "../ew-derive" }
# The report engine: the Session installs it on every `Q` so that `page_order` includes generated report pages
# (WP-S3.03).
ew-reports = { path = "../ew-reports" }
# The record types of `Session::from_records`.
ew-schema = { path = "../ew-schema" }

[dev-dependencies]
ew-commands = { path = "../ew-commands", features = ["testkit"] }
# `tests/golden_csv.rs` compares the derived anchor cells, CPs and tags of the loaded golden model with its tables.
ew-model = { path = "../ew-model", features = ["raw-read"] }
serde_json = "1.0.154"
