[package]
name = "ew-viewmodel"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Toolkit-agnostic panel models with revision stamps."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-api = { path = "../ew-api" }
# The display list and the lengths of the pages the shell shows, named by their own crates (foundation edges, ARCH §3
# rule 6).
ew-dl = { path = "../ew-dl" }
ew-units = { path = "../ew-units" }
# UI-script lines, command parameters and the transcript (ew.uiscript/1, ew.uitranscript/1).
serde_json = "1.0.154"
# settings.toml; a `toml::Table` keeps unknown keys, sorted. Serde reads and writes the settings' members.
toml = { workspace = true }
serde = { workspace = true }
# The shell's texts in Fluent: `texts/<locale>/<area>.ftl`, compiled into the binary and rendered by
# the one renderer, as `ew-checks` renders its rule messages (architecture §18).
ew-l10n = { path = "../ew-l10n" }
ew-hack = { version = "0.3.5", path = "../ew-hack" }

[build-dependencies]
# The generator of the key list that `build.rs` writes.
ew-l10n = { path = "../ew-l10n" }

[dev-dependencies]
automod.workspace = true
# The row dumps of the tests (`ew_commands::rows`, a debug build's).
ew-commands = { path = "../ew-commands" }
# The fresh temporary directory of the tests (dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../ew-testdir" }
# The starter part versions of the tests (`ew_testkit::library::starter_version`,; dev-only edge).
ew-testkit = { path = "../ew-testkit" }
