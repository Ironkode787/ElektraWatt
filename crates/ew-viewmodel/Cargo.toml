[package]
name = "ew-viewmodel"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Toolkit-agnostic panel models with revision stamps."
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test-only (WP-S2.03 §7.6): `ShellModel::set_tool_for_tests`, which installs a tool outside the registry, so that the
# probe tool of `tests/probe.rs` can exercise the commit path that no shipped tool takes; and (FT-439)
# `ShellModel::set_id_source_for_tests`, the ID source of `tests/replay_order.rs`; and (WP-S2.09 part 1)
# `ShellModel::set_job_gate_for_tests` and `set_job_panic_for_tests`, the held gate and the fault of `tests/jobs.rs`.
# A non-dev edge must never request it: `ci/dep-rules.toml` bans it outside dev-dependencies, and every package whose
# test build reaches this crate requests it on a dev edge, this crate's own tests included (`[[uniform_test_features]]`;
# `cargo xtask check-features`). So the tests above need no `required-features` and are never skipped.
testkit = []

[dependencies]
ew-api = { path = "../ew-api" }
# UI-script lines, command parameters and the transcript (ew.uiscript/1, ew.uitranscript/1).
serde_json = "1.0.154"
# settings.toml; a `toml::Table` keeps unknown keys, sorted.
toml = { workspace = true }
# The shell's texts in Fluent (WP-S2.08 D9), as `ew-checks` loads its rule messages: `locales/<locale>/shell.ftl`,
# compiled into the binary. `unic-langid` names a bundle's language, at the version fluent-bundle itself uses.
fluent-bundle = { version = "=0.16.0", default-features = false }
unic-langid = { version = "=0.9.6", default-features = false }
ew-hack = { version = "0.1.0", path = "../ew-hack" }

[dev-dependencies]
automod.workspace = true
# The test hooks of `testkit` for this crate's own tests (`probe`, `replay_order`, `jobs`), and ew-commands' `testkit`:
# both are uniform test features (ci/dep-rules.toml).
ew-viewmodel = { path = ".", features = ["testkit"] }
ew-commands = { path = "../ew-commands", features = ["testkit"] }
# The fresh temporary directory of the tests (FT-586; dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../ew-testdir" }
# The starter part versions of the tests (`ew_testkit::library::starter_version`, FT-1041; dev-only edge).
ew-testkit = { path = "../ew-testkit" }
