[package]
name = "ew-viewmodel"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Toolkit-agnostic panel models with revision stamps."
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Test-only (WP-S2.03 §7.6): `ShellModel::set_tool_for_tests`, which installs a tool outside the registry, so that the
# probe tool of `tests/probe.rs` can exercise the commit path that no shipped tool takes. A non-dev edge must never
# request it: `ci/dep-rules.toml` bans it outside dev-dependencies (`cargo xtask check-features`).
testkit = []

[[test]]
name = "probe"
required-features = ["testkit"]

[dependencies]
ew-api = { path = "../ew-api" }
# UI-script lines, command parameters and the transcript (ew.uiscript/1, ew.uitranscript/1).
serde_json = "1.0.154"
# settings.toml; a `toml::Table` keeps unknown keys, sorted.
toml = { workspace = true }
