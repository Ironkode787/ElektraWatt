nl-NL = "Het elektrische net waartoe een verbinding behoort (24VDC-1, PE); het wordt afgeleid, en de aderkleur volgt eruit."

[[term]]
ew = "Supply voltage"
eplan = []
qet = []
actions = ["potential.draw"]
[term.labels]
en-GB = "Supply voltage"
nl-NL = "Voedingsspanning"
[term.definition]
en-GB = "The type and voltage of a supply potential (L+ at 24 V DC); they are given where the potential is defined."
nl-NL = "Het type en de spanning van een voedingspotentiaal (L+ op 24 V DC); ze worden opgegeven waar de potentiaal is gedefinieerd."

[[term]]
ew = "Cross-reference"
eplan = ["Cross-reference", "Contact image"]
qet = ["Cross-reference"]
actions = []
[term.labels]
en-GB = "Cross-reference"
nl-NL = "Kruisverwijzing"
[term.definition]
en-GB = "The derived reference between a device's main and auxiliary functions on their pages, with the contact image."
nl-NL = "De afgeleide verwijzing tussen de hoofd- en hulpfuncties van een apparaat op hun pagina's, met het contactbeeld."

[[term]]
ew = "Bus topology"
eplan = ["Network", "Topology", "Fieldbus", "PROFINET", "PROFIBUS"]
qet = []
