[package]
name = "ew-library"
version.workspace = true
edition.workspace = true
# rusqlite 0.41 (the bundled SQLite 3.54, RUSTSEC-2026-0459) asks for it.
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Parts, symbol, form and macro libraries as canonical .ewlib text directories, with a derived full-text index."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-schema = { path = "../ew-schema" }
ew-format = { path = "../ew-format" }
# The copy IDs `v5(NS_LIBCOPY, library ‖ item)` and new library IDs (ADR-0004: ew-ids owns the formulas).
ew-ids = { path = "../ew-ids" }
# A part hit's description in its languages (FT-2066).
ew-mltext = { path = "../ew-mltext" }
# ARCH §3 rule 2: the derived per-user search index (FTS5 with the trigram tokenizer, doc 07 §4.3). The same pin as
# ew-sqlview; `bundled` compiles the vendored SQLite with FTS5.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
# Library record lines, `library.json` and the index columns of typed values. Never with `preserve_order`.
serde = { workspace = true }
serde_json = "1.0.154"
ew-hack = { version = "0.3.0", path = "../ew-hack" }

[dev-dependencies]
automod.workspace = true
# The fresh temporary directory of the tests (FT-569; dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../ew-testdir" }
# The content audit parses the shipped parts' map expressions and designation patterns with the derivation's own
# parsers (WP-S7.03 D4; `ew_plcaddr` through its re-export; dev-only edge, `[allowed_dev_edges]`).
ew-derive = { path = "../ew-derive" }
