[package]
name = "ew-testkit"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "The builder DSL and a synthetic parts library, for the tests."
repository.workspace = true
publish = false

# The workspace's lints with `unsafe_code` at deny: the hostile corpus test's
# counting allocator, `tests/hostile_corpus/alloc.rs`, allows it; the library keeps `#![forbid(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"

[dependencies]
ew-model = { path = "../ew-model" }
ew-schema = { path = "../ew-schema" }
ew-ids = { path = "../ew-ids" }
ew-units = { path = "../ew-units" }
serde = { workspace = true }
serde_json = "1.0.154"
ew-hack = { version = "0.4.0", path = "../ew-hack" }

[dev-dependencies]
automod.workspace = true
# The command fuzzer's import step reads the test tables (fixtures/tables) with the tables importer.
ew-import-tables = { path = "../ew-import-tables" }
# Tests load the generated projects through the Session facade and run commands on them.
ew-api = { path = "../ew-api" }
ew-commands = { path = "../ew-commands" }
# The tests hash the library copies they embed as the format does (doc 05 §13.2).
ew-format = { path = "../ew-format" }
# The seeded, reproducible ID source of the tests (doc 18 §2.2; dev-only crate).
ew-testids = { path = "../ew-testids" }
# The tests build texts and reference designations.
ew-mltext = { path = "../ew-mltext" }
ew-rds = { path = "../ew-rds" }
serde_json = "1.0.154"
# The command fuzz test reads the derived connectivity (dev-only edge, `[allowed_dev_edges]`).
ew-derive = { path = "../ew-derive" }
# The fresh temporary directory of the tests (dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../ew-testdir" }
# The hostile corpus test decodes a raster asset as the renderers do (dev-only edge,
# `[allowed_dev_edges]`).
ew-render-cpu = { path = "../ew-render-cpu" }
# The hostile corpus test names the image formats of the display list.
ew-dl = { path = "../ew-dl" }
# The command fuzzer's import step runs the importer contract (dev-only edge, `[allowed_dev_edges]`).
ew-interop-api = { path = "../ew-interop-api" }
