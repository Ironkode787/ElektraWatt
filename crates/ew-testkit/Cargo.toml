[package]
name = "ew-testkit"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Golden builders, project generators, oracle comparator and acceptance runner."
repository.workspace = true
publish = false

# The workspace's lints with `unsafe_code` at deny (ci/unsafe-allowlist.toml, WP-S6.04 D7): the hostile corpus test's
# counting allocator, `tests/hostile_corpus/alloc.rs`, allows it; the library keeps `#![forbid(unsafe_code)]` (ID-1334).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"

[dependencies]
# The generator (`ew_testkit::synth`) builds format-level records and the model snapshot from them.
ew-model = { path = "../ew-model" }
ew-schema = { path = "../ew-schema" }
# IDs come from `V7Generator` over a seeded source of this crate, so no test-only feature is needed here.
ew-ids = { path = "../ew-ids" }
ew-units = { path = "../ew-units" }
ew-mltext = { path = "../ew-mltext" }
ew-rds = { path = "../ew-rds" }
# The golden builders (WP-S6.01): path (a), the CSV bootstrap, and path (b), the builder DSL, which reads the
# bootstrap batch as its typed description and speaks the JSON parameters of the commands (doc 17 §3.5).
ew-import-tables = { path = "../ew-import-tables" }
serde = { workspace = true }
serde_json = "1.0.154"
ew-hack = { version = "0.1.0", path = "../ew-hack" }

[dev-dependencies]
automod.workspace = true
# Tests and benches load the generated projects through the Session facade and run commands on them.
ew-api = { path = "../ew-api" }
ew-commands = { path = "../ew-commands", features = ["testkit"] }
# The seeded, reproducible ID source of the tests and benches (doc 18 §2.2; dev-only crate).
ew-testids = { path = "../ew-testids" }
serde_json = "1.0.154"
# The G-SP spike (WP-S1.05, `benches/spike.rs`): the connectivity families of ew-derive measured cold and
# through its memo backend `MemoStore` (dev-only edge, `[allowed_dev_edges]`).
ew-derive = { path = "../ew-derive" }
# The fresh temporary directory of the tests (FT-569; dev-only edge, `[allowed_dev_edges]`).
ew-testdir = { path = "../ew-testdir" }
# The hostile corpus test (WP-S6.04 D10) decodes a raster asset as the renderers do (dev-only edge,
# `[allowed_dev_edges]`).
ew-render-cpu = { path = "../ew-render-cpu" }

[[bench]]
name = "cold_ops"
harness = false

[[bench]]
name = "spike"
harness = false
