[package]
name = "ew-interop-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Importer and exporter traits over ew-schema records: import batches, reports, source references, table images and proposals."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-schema = { path = "../ew-schema" }
ew-ids = { path = "../ew-ids" }
# SHA-256 of the input bytes (`ImportInput::new`); the same line as xtask, MSRV 1.72.
sha2.workspace = true
# The parameters of a quick-fix proposal (`ReportEntry::fix`, doc 15 §2.6). Never with `preserve_order`.
serde_json = "1.0.154"
