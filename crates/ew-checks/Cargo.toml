[package]
name = "ew-checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Rule engine, rule packs, the rule-implementation registry, online and offline checks, waivers and quick fixes."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The tracked-read context every rule reads through (no `raw-read`: ARCH §3 rule 1).
ew-derive = { path = "../ew-derive" }
# The exchange image and its drift from the last exchange's snapshot (EW-PLC-016).
ew-plc = { path = "../ew-plc" }
# Finding fingerprints: the first 128 bits of SHA-256 (doc 15 §2.5, FR-CHK-044).
sha2.workspace = true
# Quick-fix parameters (command JSON) and the reserved waiver records.
serde_json = "1.0.154"
# The typed JSON result `ew.check-result/1` and its published schema; both already in the graph.
serde.workspace = true
schemars = "1.2.3"
# Rule data shipped with the packs (`data/*.toml`); already in the graph through `ew-derive`.
toml.workspace = true
# The rule messages in Fluent (doc 15 §3.8): one `rules.ftl` per language, compiled into the binary and
# rendered by the one renderer (architecture §18).
ew-l10n = { path = "../ew-l10n" }
ew-hack = { version = "0.4.0", path = "../ew-hack" }
ew-ids = { path = "../ew-ids" }
ew-mltext = { path = "../ew-mltext" }
# The endpoint key of the stitch graph's nodes; the unit tests' model snapshots (no `raw-read`).
ew-model = { path = "../ew-model" }
ew-plcaddr = { path = "../ew-plcaddr" }
ew-rds = { path = "../ew-rds" }
ew-schema = { path = "../ew-schema" }
ew-units = { path = "../ew-units" }

[dev-dependencies]
automod.workspace = true

[build-dependencies]
# The generator of the key table that `build.rs` writes.
ew-l10n = { path = "../ew-l10n" }
