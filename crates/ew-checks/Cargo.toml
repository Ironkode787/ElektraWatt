[package]
name = "ew-checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Rule engine, rule packs, the rule-implementation registry, online and offline checks, waivers and quick fixes."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The tracked-read context every rule reads through (no `raw-read`: ARCH §3 rule 1).
ew-derive = { path = "../ew-derive" }
ew-rhai = { path = "../ew-rhai" }
# Finding fingerprints: the first 128 bits of SHA-256 (doc 15 §2.5, FR-CHK-044).
sha2.workspace = true
# Quick-fix parameters (command JSON) and the reserved waiver records.
serde_json = "1.0.154"
# The typed JSON result `ew.check-result/1` and its published schema (WP-S1.22 D5); both already in the graph.
serde.workspace = true
schemars = "1.2.3"
# Rule data shipped with the packs (`data/*.toml`, WP-S1.16 D5); already in the graph through `ew-derive`.
toml.workspace = true
# The rule messages in Fluent (WP-S1.16 D6, doc 15 §3.8; ADR-0024: MIT OR Apache-2.0): one `rules.ftl` per language,
# compiled into the binary. `unic-langid` names a bundle's language, at the version fluent-bundle itself uses.
fluent-bundle = { version = "=0.16.0", default-features = false }
unic-langid = { version = "=0.9.6", default-features = false }

[dev-dependencies]
# Unit tests build small model snapshots to evaluate rules over a `Q` (no `raw-read`).
ew-model = { path = "../ew-model" }
