[package]
name = "ew-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "All domain queries and the tracked-read context."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The untracked read API of ew-model (ARCH §3 rule 1, ADR-0001 amendment 1): ew-derive is the tracked read
# layer, so it reads tables and indexes raw and records each read through `Q`'s tracker. Allowed on this
# normal edge by `cargo xtask check-features` (ci/dep-rules.toml).
ew-model = { path = "../ew-model", features = ["raw-read"] }
ew-memo = { path = "../ew-memo" }
ew-rhai = { path = "../ew-rhai" }
ew-plcaddr = { path = "../ew-plcaddr" }
# The record types, IDs, units and text that queries read and return.
ew-schema = { path = "../ew-schema" }
ew-ids = { path = "../ew-ids" }
ew-units = { path = "../ew-units" }
ew-mltext = { path = "../ew-mltext" }
# Reference designations and identifier sets (ADR-0026).
ew-rds = { path = "../ew-rds" }
# Persistent maps for the incremental connectivity values (the partition and its index families): O(1)
# clones and diffs that skip shared subtrees, so an edit costs what it touches (ADR-0002 amendment 4). MPL-2.0+,
# as in ew-memo and ew-model.
imbl = "7.0.2"
serde.workspace = true
# Settings members still kept in `ProjectSettings.extra` (doc 03 §5.1) and reserved records.
serde_json = "1.0.154"
# The shipped derivation profiles are TOML data (ADR-0003, ARCH §6.6).
toml.workspace = true

[dev-dependencies]
# Agreement tests: the main representation and the counters of the command layer (tests/agreement.rs).
ew-commands = { path = "../ew-commands" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
