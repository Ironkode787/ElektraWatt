[package]
name = "ew-export"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "PDF, SVG, DXF and PNG export."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-dl = { path = "../ew-dl" }
ew-render-cpu = { path = "../ew-render-cpu" }
# PDF/A-2b writer (ARCH §3, §8.4; ADR-0015 decision 5). Default features off: no built-in shaper (glyphs come shaped
# from ew-text). `raster-images` on for PNG and JPEG image items (FT-406, decision log ID-605); it brings krilla's
# png, zune-jpeg, gif, image-webp and imagesize decoders. Only PNG and JPEG reach krilla, after ew-render-cpu has
# decoded them within its MAX_IMAGE_PIXELS; krilla's GIF and WebP paths are never called.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
# Not used directly: pins the two decoders `raster-images` admits to the versions their cargo-vet audits cover
# (licence `MIT OR Apache-2.0` for these exact versions; no build scripts). Their features come from krilla.
gif = { version = "=0.14.2", default-features = false }
image-webp = { version = "=0.2.4", default-features = false }

[dev-dependencies]
ew-text = { path = "../ew-text" }
ew-units = { path = "../ew-units" }
sha2 = { workspace = true }
# Destination IDs of the test pages.
uuid = { version = "1.26", default-features = false }
