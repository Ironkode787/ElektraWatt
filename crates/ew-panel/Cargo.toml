[package]
name = "ew-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Panel layout queries, collision reconciler, wire routing, lengths, duct fill, 2D projection and glTF/STL output."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ew-commands = { path = "../ew-commands" }
ew-step-proto = { path = "../ew-step-proto" }
ew-hack = { version = "0.0.0", path = "../ew-hack" }

[dev-dependencies]
# Only carries the test-only feature to every test build (ci/dep-rules.toml, `[[uniform_test_features]]`).
ew-commands = { path = "../ew-commands", features = ["testkit"] }
