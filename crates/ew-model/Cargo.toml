[package]
name = "ew-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
description = "Tables of ew-schema records, the Model snapshot, Op apply and invert, base reverse indexes, structural invariants and link delete policies."
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The untracked read API (`Model::table`, `row`, `lib`, `indexes`, the table and index getters): ARCH §3
# rule 1, ADR-0002 decision 1. Off by default. `cargo xtask check-features` allows it on normal edges of
# ew-derive, ew-commands and ew-store only, and on dev-dependency edges (ci/dep-rules.toml).
raw-read = []

[dependencies]
ew-schema = { path = "../ew-schema" }
ew-ids = { path = "../ew-ids" }
# Persistent ordered maps and sets: O(1) snapshots and deterministic order (ADR-0001 decision 1). MPL-2.0+, on
# the GPL-layer allowlist; `Table<T>` and `RevIndex` encapsulate it.
imbl = "7.0.2"
# `extra` members of the project settings (the strictness read-through) and the order of unknown records.
serde_json = "1.0.154"

[dev-dependencies]
# Value types of the test fixture's records (coordinates, decimals, identifiers, aspects).
ew-units = { path = "../ew-units" }
ew-mltext = { path = "../ew-mltext" }
ew-rds = { path = "../ew-rds" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
