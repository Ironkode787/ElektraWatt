[package]
name = "ew-import-eplan"
version.workspace = true
edition.workspace = true
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "Bounded EPLAN EDZ, PXF macro XML and parts XML import: symbol drafts and part drafts."
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The importer contract (doc 14 §2.1): limits, report entries and the part draft; permissive crates only (ARCH §3).
ew-interop-api = { path = "../ew-interop-api" }
ew-mltext = { path = "../ew-mltext" }
# The parts XML is streamed (doc 14 §5.3); the same pin as the XLSX reader of ew-import-catalog.
quick-xml.workspace = true
# The function-definition table `fndef-map.toml` (doc 14 §5.2).
toml.workspace = true
roxmltree = { version = "=0.21.1", default-features = false, features = ["std", "positions"] }
serde_json = "1.0.154"
serde.workspace = true
miniz_oxide.workspace = true
crc32fast = "=1.5.2"
# The 7z reader of ADR-0021 §5 (ID-1460), without default features: no encryption, compression or further codecs.
# The header is walked under EW's own bounds first (src/seven.rs), which decodes an encoded header through
# lzma-rust2, in the graph through sevenz-rust2 already and with the same features.
sevenz-rust2 = { version = "=0.24.2", default-features = false }
lzma-rust2 = { version = "=0.23.0", default-features = false, features = ["std", "optimization"] }

[dev-dependencies]
automod.workspace = true
