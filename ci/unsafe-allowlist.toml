# The crates that may use `unsafe` and the files where it may stand (doc 18 §11.2, NFR-SEC-04; WP-S3.07 D12 and ruling
# 6 of ID-1218), each file relative to its crate's directory. `cargo xtask check-unsafe` reads it: every other crate
# forbids `unsafe_code` (its crate roots' `#![forbid(unsafe_code)]`, or the workspace's lints through
# `[lints] workspace = true`), and the keyword stands in no file outside this list. A listed crate's manifest copies
# the workspace's lints with `unsafe_code = "deny"`, its root denies it and the listed module allows it; each `unsafe`
# block carries a `SAFETY:` comment (clippy's `undocumented_unsafe_blocks`), reviewed by the cycle's independent
# reviewer (NFR-SEC-04, ID-1030).

# map: unsafe-allowlist: a new crate that needs unsafe goes in [crates] with the files where it stands, its manifest copying the workspace's lints with unsafe_code at deny.
[crates]
# The Windows print adapter: the print dialog, the printer's device context and the bands sent with StretchDIBits.
ew-print = ["src/windows.rs"]
# The counting allocator of the hostile corpus test, that test binary's global allocator only (WP-S6.04 D7, D10).
ew-testkit = ["tests/hostile_corpus/alloc.rs"]
