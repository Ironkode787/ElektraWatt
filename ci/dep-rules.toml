# Crate-dependency rules of docs/design/04-architecture.md §3 (Rules 2-4 and the dependency graph),
# NFR-MAINT-01 and ADR-0024 decision 4, in machine form. Checked by `cargo xtask check-deps` over
# `cargo metadata` (direct, declared dependencies of every workspace package, all kinds and targets).
#
# The check fails when:
# - a workspace package is missing from [layers] or [allowed_edges], or this file names a package that
#   neither exists nor is listed under `planned`;
# - a workspace-to-workspace edge is not listed in [allowed_edges] (dev-dependencies may also use
#   [allowed_dev_edges]): this is "no crate depends on a crate above it" in checkable form;
# - a permissive crate depends on a non-permissive workspace crate (any dependency kind);
# - an external crate matched by an [[external_owner]] rule is a direct dependency of a non-owner;
# - an importer depends on a workspace crate outside the permissive layer;
# - a [[confined]] crate has a direct dependent outside its list, or is reachable from a forbidden crate.
#
# Separately, `cargo xtask check-features` reads [[banned_features]] and banned_crates (18 §5.2 CI-PR-09): a
# banned feature must not be requested on a dependency edge whose kind is not in allowed_kinds (unless the
# package is in the rule's allowed_packages), a banned crate may only be a dev-dependency, no workspace package's
# own `default` feature may reach a banned feature, and with a non-empty allowed_packages no package outside it
# may forward the feature (`dep/feature`) from any of its own features.
#
# Changing an edge here is an architecture change: it needs the matching change in 04-architecture.md §3
# (and an ADR where the rules themselves change).

# Crates that may appear as dev-dependencies only (18 §5.2 CI-PR-09: egui_mcp in any non-test target).
banned_crates = ["egui_mcp"]

[layers]
# MIT OR Apache-2.0; closed under dependencies (ADR-0024 decision 2).
permissive = [
  "ew-units", "ew-ids", "ew-mltext", "ew-rds", "ew-schema", "ew-format", "ew-interop-api", "ew-dl",
  "ew-step-proto", "ew-memo", "ew-plcaddr", "ew-caex", "ew-devdesc", "ew-ewpp",
]
# GPL-3.0-or-later application layer, including the binaries.
gpl = [
  "ew-model", "ew-rhai", "ew-derive", "ew-commands", "ew-checks", "ew-sqlview", "ew-library", "ew-store",
  "ew-text", "ew-reports", "ew-scene", "ew-render2d", "ew-render-cpu", "ew-export", "ew-print", "ew-plc",
  "ew-panel", "ew-render3d", "ew-mfg", "ew-import-qet", "ew-import-eplan", "ew-import-dxf",
  "ew-import-catalog", "ew-import-tables", "ew-script", "ew-plugin-host", "ew-jobs", "ew-api",
  "ew-viewmodel", "ew-ui", "ew-testkit", "elektrawatt", "ew", "ew-step-worker",
]
# Development-only packages outside the product crate table; they may not be depended on.
tools = ["xtask"]
# Crates of §3 that are not in the workspace yet (1.0 and v1.x). They may appear in owner lists only;
# when one is added to the workspace it moves to a layer above and gets an [allowed_edges] entry.
planned = ["ew-viewer", "ew-wiring-viewer", "ew-plugin-wit", "ew-plugin-sdk", "ew-py"]

# Every permitted direct edge between workspace packages: the arrows of the §3 Mermaid graph.
# Every workspace package has an entry, even when empty.
[allowed_edges]
"ew-units" = []
"ew-ids" = []
"ew-mltext" = []
"ew-rds" = []
"ew-schema" = ["ew-units", "ew-ids", "ew-mltext", "ew-rds"]
"ew-format" = ["ew-schema"]
"ew-interop-api" = ["ew-schema", "ew-ids"]
"ew-dl" = ["ew-units"]
"ew-step-proto" = ["ew-units"]
"ew-memo" = []
"ew-plcaddr" = []
"ew-caex" = []
"ew-devdesc" = []
"ew-ewpp" = []
"ew-model" = ["ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds"]
"ew-rhai" = []
"ew-derive" = ["ew-model", "ew-memo", "ew-rhai", "ew-plcaddr", "ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds"]
"ew-commands" = ["ew-derive", "ew-model", "ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds"]
"ew-checks" = ["ew-derive", "ew-rhai"]
"ew-sqlview" = ["ew-derive", "ew-checks"]
"ew-library" = ["ew-schema", "ew-format"]
"ew-store" = ["ew-format", "ew-model"]
"ew-text" = ["ew-dl", "ew-units"]
"ew-reports" = ["ew-derive", "ew-sqlview", "ew-text"]
"ew-scene" = ["ew-reports", "ew-dl", "ew-text", "ew-schema", "ew-units", "ew-ids", "ew-mltext"]
"ew-render2d" = ["ew-dl"]
"ew-render-cpu" = ["ew-dl"]
"ew-export" = ["ew-dl", "ew-render-cpu"]
"ew-print" = ["ew-export", "ew-render-cpu"]
"ew-plc" = ["ew-commands", "ew-plcaddr", "ew-caex", "ew-devdesc"]
"ew-panel" = ["ew-commands", "ew-step-proto"]
"ew-render3d" = ["ew-panel"]
"ew-mfg" = ["ew-reports", "ew-panel", "ew-ewpp"]
"ew-import-qet" = ["ew-interop-api", "ew-schema", "ew-units", "ew-ids", "ew-mltext"]
"ew-import-eplan" = ["ew-interop-api"]
"ew-import-dxf" = ["ew-interop-api"]
"ew-import-catalog" = ["ew-interop-api"]
"ew-import-tables" = ["ew-interop-api", "ew-schema", "ew-units", "ew-ids", "ew-mltext", "ew-rds"]
"ew-script" = ["ew-commands", "ew-rhai"]
"ew-plugin-host" = ["ew-commands", "ew-sqlview", "ew-checks"]
"ew-jobs" = []
"ew-api" = [
  "ew-store", "ew-commands", "ew-checks", "ew-sqlview", "ew-library", "ew-scene", "ew-export", "ew-plc",
  "ew-panel", "ew-mfg", "ew-import-qet", "ew-import-eplan", "ew-import-dxf", "ew-import-catalog",
  "ew-import-tables", "ew-script", "ew-plugin-host", "ew-jobs", "ew-model", "ew-schema", "ew-derive",
  "ew-reports",
]
"ew-viewmodel" = ["ew-api"]
"ew-ui" = ["ew-viewmodel", "ew-render2d", "ew-render-cpu", "ew-render3d"]
# The synthetic S-XL generator (WP-S1.05) emits records and builds the model snapshot.
"ew-testkit" = [
  "ew-import-tables", "ew-model", "ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds",
]
"elektrawatt" = ["ew-ui", "ew-print"]
"ew" = ["ew-api", "ew-print"]
"ew-step-worker" = ["ew-step-proto"]
"xtask" = []

# Additional edges allowed for dev-dependencies only (for example a test helper crate).
[allowed_dev_edges]
# ew-commands' own integration tests enable its `testkit` feature (row dumps, `Preview::ops`, history ops),
# which is crate-private otherwise (ARCH §3 rule 1).
"ew-commands" = ["ew-commands"]
# ew-testkit's tests and benches load generated projects through the Session facade and run commands
# (WP-S1.05 benchmark harness); the G-SP spike bench measures the ew-derive queries cold and through its memo
# backend `MemoStore` (WP-S1.05, WP-S1.07, `benches/spike.rs`).
"ew-testkit" = ["ew-api", "ew-commands", "ew-derive"]

# ew-derive's agreement tests compare its main-representation and tag rules with the numbering of ew-commands.
"ew-derive" = ["ew-commands"]
# ew-api's golden CSV test compares the derived anchor cells, CPs and tags of the loaded golden model with its
# tables (the importer may not depend on the model, so the test lives in ew-api). Its page-output test (WP-S3.04)
# builds page display lists, PNGs and PDFs of the golden folios with the bundled fonts.
"ew-api" = ["ew-derive", "ew-text", "ew-dl", "ew-render-cpu", "ew-ids", "ew-units", "ew-mltext"]
# The renderer's and the PDF writer's tests shape their text with the bundled fonts (WP-S3.04).
"ew-render-cpu" = ["ew-text", "ew-units"]
"ew-export" = ["ew-text", "ew-units"]

# ew-reports' unit tests build small model snapshots to run report row queries over a `Q` (no `raw-read`).
"ew-reports" = ["ew-model"]

# ARCH §3 Rule 2: only ew-sqlview and ew-library link rusqlite.
[[external_owner]]
crates = ["rusqlite", "libsqlite3-sys"]
owners = ["ew-sqlview", "ew-library"]
reason = "ARCH §3 rule 2 (SQLite)"

# ARCH §3 Rule 3: only ew-ui, ew-viewer, the app binary and the ew-wiring-viewer binary know egui.
[[external_owner]]
crates = ["egui", "eframe", "egui-wgpu", "egui_*", "egui-*"]
owners = ["ew-ui", "ew-viewer", "elektrawatt", "ew-wiring-viewer"]
reason = "ARCH §3 rule 3 (UI toolkit)"

# ARCH §3 Rule 3: only the renderers know wgpu.
[[external_owner]]
crates = ["wgpu", "wgpu-*"]
owners = ["ew-render2d", "ew-render3d"]
reason = "ARCH §3 rule 3 (GPU)"

# 18 §5.2 CI-PR-09 feature bans: test-only or unsafe features that must never be enabled on a non-test edge.
# allowed_kinds lists the dependency kinds (normal, dev, build) on which enabling the feature is fine.
[[banned_features]]
crate = "ew-ids"
feature = "testkit"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "ew-commands"
feature = "testkit"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "rhai"
feature = "unchecked"
allowed_kinds = []

[[banned_features]]
crate = "egui"
feature = "inspection"
allowed_kinds = []

[[banned_features]]
crate = "ew"
feature = "test-confirm"
allowed_kinds = ["dev"]

# Doc 05 §3.1, §10.3: canonical JSON needs serde_json's sorted `Map`; `preserve_order` switches every
# `Map` in the build to insertion order through feature unification and would change the bytes of unknown
# records and manifest members. Requested on no edge of any kind; ew-format's unit test
# `serde_json_objects_serialise_in_key_order` catches a third-party crate that enables it.
[[banned_features]]
crate = "serde_json"
feature = "preserve_order"
allowed_kinds = []

# ARCH §3 rule 1, ADR-0002 decision 1: the untracked read API of ew-model. The tracked read layer, the
# transaction layer and the writer may enable it; any crate may enable it for tests.
[[banned_features]]
crate = "ew-model"
feature = "raw-read"
allowed_kinds = ["dev"]
allowed_packages = ["ew-derive", "ew-commands", "ew-store"]

# ARCH §3 Rule 4: importers depend on ew-interop-api, their parsers and permissive helpers only; they never
# see ew-model. Packages matching `pattern` may depend on permissive workspace crates only.
[importers]
pattern = "ew-import-*"

# ADR-0024 decision 4 and NFR-LIC-05: QET-derived code is confined. Only ew-api depends on ew-import-qet;
# ew-plugin-host and the permissive crates never reach it, directly or transitively ("@permissive" stands
# for every crate of the permissive layer).
[[confined]]
crate = "ew-import-qet"
only_direct_dependents = ["ew-api"]
never_reached_from = ["ew-plugin-host", "@permissive"]
reason = "ADR-0024 decision 4 (QET-derived code)"

# `cargo xtask check-raw-read` (ADR-0001 amendment 2, decision log ID-50, FT-01) guards the raw readers that
# ew-model declares under its `raw-read` feature, in two halves (details: the module doc of xtask/src/raw_read.rs).
#
# Calls: the workspace-root `clippy.toml` (`clippy_config`) is GENERATED from ew-model's own source by
# `cargo xtask check-raw-read --bless` and lists every reader as a clippy `disallowed-methods` path
# (`ew_model::Model::row`, ...), which clippy resolves through the type. The reader crates opt out with
# `#![allow(clippy::disallowed_methods)]` at each target root; no other crate may. The check fails when the
# committed file is missing, stale or hand-edited, when another `clippy.toml`/`.clippy.toml` shadows it, when
# `.cargo/config.toml` or a workflow mentions `CLIPPY_CONF_DIR` or `disallowed_methods`, and when a reader is
# not re-exported at ew-model's crate root (clippy would only warn about the unresolvable path).
#
# Lexical rules: the non-test Rust source of a workspace package outside `readers` (that reaches ew-model through
# normal dependencies) must not invoke the `raw_read!` macro, name the `raw-read` feature, or suppress the guard
# (`allow`/`expect` of `disallowed_methods`, `clippy::style`, `clippy::all` or `warnings`, also in `cfg_attr`); its
# manifest must not enable the feature or set `disallowed_methods`, `style` or `all` to `allow` under
# `[lints.clippy]` (nor may `[workspace.lints.clippy]`). Test code is exempt: the `tests/`, `benches/` and
# `examples/` directories, and items under `#[cfg(test)]` or `#[cfg(all(test, ..))]`; a `cfg(any(test, ..))` is
# production code.
#
# A false positive gets an `[[raw_read.allow]]` entry (file, item, reason); the item of a suppression finding is
# `disallowed_methods`. Inline suppressions of this check are not honoured, and an entry that matches nothing fails.
[raw_read]
crate = "ew-model"
feature = "raw-read"
macro = "raw_read"
readers = ["ew-model", "ew-derive", "ew-commands", "ew-store"]
# The generated clippy configuration, relative to the workspace root.
clippy_config = "clippy.toml"
# The guard's own source names the feature and the macro.
exempt_packages = ["xtask"]
# [[raw_read.allow]]
# path = "crates/ew-example/src/lib.rs"   # relative to the workspace root, forward slashes
# item = "raw_read!"                      # "raw_read!", "raw-read" or "disallowed_methods"
# reason = "a third-party macro that is not ew-model's"
