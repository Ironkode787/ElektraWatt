# Crate-dependency rules of docs/design/04-architecture.md §3 (Rules 2-4 and the dependency graph),
# NFR-MAINT-01 and ADR-0024 decision 4, in machine form. Checked by `cargo xtask check-deps` over
# `cargo metadata` (direct, declared dependencies of every workspace package, all kinds and targets).
#
# The check fails when:
# - a workspace package is missing from [layers] or [allowed_edges], or this file names a package that
#   neither exists nor is listed under `planned`;
# - a workspace-to-workspace edge is not listed in [allowed_edges] (dev-dependencies may also use
#   [allowed_dev_edges]): this is "no crate depends on a crate above it" in checkable form;
# - a permissive crate depends on a non-permissive workspace crate (any dependency kind);
# - an external crate matched by an [[external_owner]] rule is a direct dependency of a non-owner;
# - an importer depends on a workspace crate outside the permissive layer;
# - a [[confined]] crate has a direct dependent outside its list, or is reachable from a forbidden crate.
#
# Separately, `cargo xtask check-features` reads [[banned_features]] and banned_crates (18 §5.2 CI-PR-09): a
# banned feature must not be requested on a dependency edge whose kind is not in allowed_kinds (unless the
# package is in the rule's allowed_packages), a banned crate may only be a dev-dependency, no workspace package's
# own `default` feature may reach a banned feature, and with a non-empty allowed_packages no package outside it
# may forward the feature (`dep/feature`) from any of its own features. It also reads [[uniform_test_features]]:
# every workspace package whose test build reaches the crate requests the feature on a dev edge. And the shipped
# binaries' resolved graph (`cargo tree --target all -e normal,build`) holds no banned crate and no feature banned outside dev
# edges (18 CI-R-09).
#
# Changing an edge here is an architecture change: it needs the matching change in 04-architecture.md §3
# (and an ADR where the rules themselves change).

# Crates that may appear as dev-dependencies only (18 §5.2 CI-PR-09: egui_mcp in any non-test target).
# ew-testids, the seeded ID source of the tests (doc 18 §2.2), likewise.
banned_crates = ["egui_mcp", "ew-testids"]

# map: dep-rules: a new workspace crate goes in [layers], [allowed_edges] (its edges from 04-architecture §3) and a [crates] table (its §3 row); a permissive one also in `.config/hakari.toml` final-excludes.
[layers]
# MIT OR Apache-2.0; closed under dependencies (ADR-0024 decision 2).
permissive = [
  "ew-units", "ew-ids", "ew-mltext", "ew-rds", "ew-schema", "ew-format", "ew-interop-api", "ew-dl",
  "ew-step-proto", "ew-memo", "ew-plcaddr", "ew-caex", "ew-devdesc", "ew-ewpp", "ew-testdir",
  "ew-testids",
]
# GPL-3.0-or-later application layer, including the binaries.
gpl = [
  "ew-model", "ew-rhai", "ew-derive", "ew-commands", "ew-checks", "ew-sqlview", "ew-library", "ew-store",
  "ew-text", "ew-reports", "ew-scene", "ew-render2d", "ew-render-cpu", "ew-export", "ew-print", "ew-plc",
  "ew-panel", "ew-render3d", "ew-mfg", "ew-import-qet", "ew-import-eplan", "ew-import-dxf",
  "ew-import-catalog", "ew-import-tables", "ew-script", "ew-plugin-host", "ew-jobs", "ew-api",
  "ew-viewmodel", "ew-ui", "ew-testkit", "elektrawatt", "ew", "ew-step-worker",
  # The workspace-hack crate of cargo-hakari (RD43 R17; .config/hakari.toml).
  "ew-hack",
]
# Development-only packages outside the product crate table; they may not be depended on.
tools = ["xtask"]
# Crates of §3 that are not in the workspace yet (1.0 and v1.x). They may appear in owner lists only;
# when one is added to the workspace it moves to a layer above and gets an [allowed_edges] entry.
planned = ["ew-viewer", "ew-wiring-viewer", "ew-plugin-wit", "ew-plugin-sdk", "ew-py", "ew-sysprobe"]

# Every permitted direct edge between workspace packages: the arrows of the §3 Mermaid graph.
# Every workspace package has an entry, even when empty.
[allowed_edges]
"ew-units" = []
"ew-ids" = []
"ew-mltext" = []
"ew-rds" = []
"ew-schema" = ["ew-units", "ew-ids", "ew-mltext", "ew-rds"]
"ew-format" = ["ew-schema"]
"ew-interop-api" = ["ew-schema", "ew-ids"]
"ew-dl" = ["ew-units"]
"ew-step-proto" = ["ew-units"]
"ew-memo" = []
"ew-plcaddr" = []
"ew-caex" = []
"ew-devdesc" = []
"ew-ewpp" = []
# The fresh temporary directory of the tests (FT-569, FT-586): dev-only, no dependencies.
"ew-testdir" = []
# The seeded UUIDv7 source of the tests (doc 18 §2.2, RD43 T1): dev-only, on the ID crate alone.
"ew-testids" = ["ew-ids"]
"ew-model" = ["ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds", "ew-hack"]
"ew-rhai" = ["ew-hack"]
"ew-derive" = ["ew-model", "ew-memo", "ew-rhai", "ew-plcaddr", "ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds", "ew-hack"]
"ew-commands" = ["ew-derive", "ew-model", "ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds", "ew-hack"]
"ew-checks" = ["ew-derive", "ew-rhai", "ew-hack"]
"ew-sqlview" = ["ew-derive", "ew-checks", "ew-hack"]
"ew-library" = ["ew-schema", "ew-format", "ew-ids", "ew-hack"]
"ew-store" = ["ew-format", "ew-model", "ew-hack"]
"ew-text" = ["ew-dl", "ew-units", "ew-hack"]
# The open-items kind reads `ew_checks::open_items` (WP-S3.06 D8); `ew-checks` was already in the graph through `ew-sqlview`.
"ew-reports" = ["ew-derive", "ew-sqlview", "ew-text", "ew-checks", "ew-hack"]
# The drawn path of a connection (decision log ID-1111): `ew-derive` was already in the graph through `ew-reports`.
"ew-scene" = ["ew-reports", "ew-derive", "ew-dl", "ew-text", "ew-schema", "ew-units", "ew-ids", "ew-mltext", "ew-hack"]
"ew-render2d" = ["ew-dl", "ew-render-cpu", "ew-hack"]
"ew-render-cpu" = ["ew-dl", "ew-hack"]
"ew-export" = ["ew-dl", "ew-render-cpu", "ew-hack"]
"ew-print" = ["ew-export", "ew-render-cpu", "ew-hack"]
"ew-plc" = ["ew-commands", "ew-plcaddr", "ew-caex", "ew-devdesc", "ew-hack"]
"ew-panel" = ["ew-commands", "ew-step-proto", "ew-hack"]
"ew-render3d" = ["ew-panel", "ew-hack"]
"ew-mfg" = ["ew-reports", "ew-panel", "ew-ewpp", "ew-hack"]
"ew-import-qet" = ["ew-interop-api", "ew-schema", "ew-units", "ew-ids", "ew-mltext"]
"ew-import-eplan" = ["ew-interop-api"]
"ew-import-dxf" = ["ew-interop-api"]
"ew-import-catalog" = ["ew-interop-api"]
"ew-import-tables" = ["ew-interop-api", "ew-schema", "ew-units", "ew-ids", "ew-mltext", "ew-rds"]
"ew-script" = ["ew-commands", "ew-rhai", "ew-hack"]
"ew-plugin-host" = ["ew-commands", "ew-sqlview", "ew-checks", "ew-hack"]
"ew-jobs" = ["ew-hack"]
"ew-api" = [
  "ew-store", "ew-commands", "ew-checks", "ew-sqlview", "ew-library", "ew-scene", "ew-export", "ew-plc",
  "ew-panel", "ew-mfg", "ew-import-qet", "ew-import-eplan", "ew-import-dxf", "ew-import-catalog",
  "ew-import-tables", "ew-script", "ew-plugin-host", "ew-jobs", "ew-model", "ew-schema", "ew-derive",
  "ew-reports",
  # The export job (FT-59): the bundled fonts of ew-text and the display-list types of ew-dl.
  "ew-text", "ew-dl",
  # WP-S2.05 part 1 (§4.1 rule 2; decision log ID-600): the field parser and formatter of the property grid
  # name the integer value types and the multi-language text. Normal edges since cycle 24, dev edges before.
  "ew-units", "ew-mltext",
  "ew-hack",
]
"ew-viewmodel" = ["ew-api", "ew-hack"]
"ew-ui" = ["ew-viewmodel", "ew-render2d", "ew-render-cpu", "ew-render3d", "ew-hack"]
# The synthetic S-XL generator (WP-S1.05) emits records and builds the model snapshot.
"ew-testkit" = [
  "ew-import-tables", "ew-model", "ew-schema", "ew-ids", "ew-units", "ew-mltext", "ew-rds",
  "ew-hack",
]
"elektrawatt" = ["ew-ui", "ew-print", "ew-hack"]
"ew" = ["ew-api", "ew-print", "ew-hack"]
"ew-step-worker" = ["ew-step-proto", "ew-hack"]
# The workspace-hack crate (RD43 R17): no workspace edges; every GPL member that hakari wires (all but the importers,
# ARCH §3 rule 4) depends on it.
"ew-hack" = []
"xtask" = []

# Additional edges allowed for dev-dependencies only (for example a test helper crate).
[allowed_dev_edges]
# The G-PP wiring regression reverses new IDs through the viewmodel's test-only source hook; the ew-commands edge
# only carries its `testkit` ([[uniform_test_features]]).
"elektrawatt" = ["ew-viewmodel", "ew-commands"]
# ew-commands' own integration tests enable its `testkit` feature (row dumps, `Preview::ops`, history ops),
# which is crate-private otherwise (ARCH §3 rule 1); the seeded IDs come from ew-testids.
"ew-commands" = ["ew-commands", "ew-testids"]
# ew-testkit's tests and benches load generated projects through the Session facade and run commands
# (WP-S1.05 benchmark harness); the G-SP spike bench measures the ew-derive queries cold and through its memo
# backend `MemoStore` (WP-S1.05, WP-S1.07, `benches/spike.rs`).
"ew-testkit" = ["ew-api", "ew-commands", "ew-derive", "ew-testdir", "ew-testids"]

# ew-derive's agreement tests compare its main-representation and tag rules with the numbering of ew-commands.
"ew-derive" = ["ew-commands"]
# ew-api's golden CSV test compares the derived anchor cells, CPs and tags of the loaded golden model with its
# tables (the importer may not depend on the model, so the test lives in ew-api). Its page-output test (WP-S3.04)
# renders the PNGs of the golden folios (ew-text and ew-dl are normal edges since the export job, FT-59). The
# acceptance runner builds AC-15's path (b) with the golden builder DSL of ew-testkit (WP-S6.01).
"ew-api" = ["ew-derive", "ew-render-cpu", "ew-ids", "ew-testkit", "ew-testdir", "ew-testids"]
# The renderer's and the PDF writer's tests shape their text with the bundled fonts (WP-S3.04).
"ew-render-cpu" = ["ew-text", "ew-units"]
"ew-export" = ["ew-text", "ew-units"]

# ew-reports' unit tests build small model snapshots to run report row queries over a `Q` (no `raw-read`).
"ew-reports" = ["ew-model"]

# FT-569, FT-586: the tests take their fresh temporary directory (`ew_testdir::fresh_dir`) from ew-testdir.
"ew-store" = ["ew-testdir"]
"ew-library" = ["ew-testdir"]
"ew-sqlview" = ["ew-testdir"]
# ew-checks' unit tests build small model snapshots to evaluate rules over a `Q` (no `raw-read`).
"ew-checks" = ["ew-model"]

# [[uniform_test_features]] (RD43 T1): every package whose test build reaches ew-commands requests its `testkit` on a
# dev edge, and every package whose test build reaches ew-viewmodel requests its `testkit` (ew-viewmodel itself too:
# its `probe`, `replay_order` and `jobs` tests use the hooks), so neither crate compiles twice between package sets.
# The `ew-commands` and self entries below are such edges: the package has no normal edge to the crate. (ew-viewmodel
# and ew-ui also take ew-testdir, FT-586.)
"ew-viewmodel" = ["ew-testdir", "ew-commands", "ew-viewmodel"]
"ew-ui" = ["ew-testdir", "ew-commands"]
"ew-mfg" = ["ew-commands"]
"ew-render3d" = ["ew-commands"]
"ew" = ["ew-commands"]

# ARCH §3 Rule 2: only ew-sqlview and ew-library link rusqlite.
[[external_owner]]
crates = ["rusqlite", "libsqlite3-sys"]
owners = ["ew-sqlview", "ew-library"]
reason = "ARCH §3 rule 2 (SQLite)"

# ARCH §3 Rule 3: only ew-ui, ew-viewer, the app binary and the ew-wiring-viewer binary know egui.
[[external_owner]]
crates = ["egui", "eframe", "egui-wgpu", "egui_*", "egui-*"]
owners = ["ew-ui", "ew-viewer", "elektrawatt", "ew-wiring-viewer"]
reason = "ARCH §3 rule 3 (UI toolkit)"

# ARCH §3 Rule 3: only the renderers know wgpu.
[[external_owner]]
crates = ["wgpu", "wgpu-*"]
owners = ["ew-render2d", "ew-render3d"]
reason = "ARCH §3 rule 3 (GPU)"

# 18 §5.2 CI-PR-09 feature bans: test-only or unsafe features that must never be enabled on a non-test edge.
# allowed_kinds lists the dependency kinds (normal, dev, build) on which enabling the feature is fine.
# WP-S2.01 part 1, spec section 4 rule 5: the application build needs no system package. wgpu-hal's `gles`
# feature turns on `wayland-sys/dlopen`; without it wayland-sys' build script runs pkg-config for libwayland and
# links it. `cargo xtask check-features` fails when either feature leaves the resolved graph while its crate is in it.
[[required_features]]
crate = "eframe"
feature = "clipboard"
reason = "the desktop must publish Copy/Cut and read Paste through the operating-system clipboard"

[[required_features]]
crate = "egui-winit"
feature = "clipboard"
reason = "without it the desktop silently falls back to an app-internal clipboard"

[[required_features]]
crate = "wgpu-hal"
feature = "gles"
reason = "it gives wayland-sys its dlopen feature (no pkg-config probe, no libwayland at link time)"

[[required_features]]
crate = "wayland-sys"
feature = "dlopen"
reason = "without it the build script probes pkg-config and the binary links libwayland (a system package on the CI image)"

# The row dumps, `Preview::ops` and the history's ops of ew-commands (ARCH §3 rule 1, F9) are for tests only.
[[banned_features]]
crate = "ew-commands"
feature = "testkit"
allowed_kinds = ["dev"]

# WP-S2.03 §7.6: the probe tool's seam (`ShellModel::set_tool_for_tests`) is for tests only; the binaries never build
# it, so no shipped path can install a tool that commits.
[[banned_features]]
crate = "ew-viewmodel"
feature = "testkit"
allowed_kinds = ["dev"]

# RD43 T1: the two test-only features above are on in every test build, so no package set compiles their crates (and
# everything above them) a second way. `cargo xtask check-features` fails when a package whose test build reaches the
# crate does not request the feature on a dev edge, and names the line to add. The seeded ID source needs no rule:
# it is the dev-only crate ew-testids (banned_crates), which changes no feature of ew-ids.
[[uniform_test_features]]
crate = "ew-commands"
feature = "testkit"

[[uniform_test_features]]
crate = "ew-viewmodel"
feature = "testkit"

[[banned_features]]
crate = "rhai"
feature = "unchecked"
allowed_kinds = []

[[banned_features]]
crate = "egui"
feature = "inspection"
allowed_kinds = []

# `ew` declares no `test-confirm` feature: doc 18 §3.15's test-build confirmation hook is an injected terminal. The
# ban stays as the guard doc 18 names for it, and CI-R-09's release assertions check it (ID-1082).
[[banned_features]]
crate = "ew"
feature = "test-confirm"
allowed_kinds = ["dev"]

# Doc 05 §3.1, §10.3: canonical JSON needs serde_json's sorted `Map`; `preserve_order` switches every
# `Map` in the build to insertion order through feature unification and would change the bytes of unknown
# records and manifest members. Requested on no edge of any kind; ew-format's unit test
# `serde_json_objects_serialise_in_key_order` catches a third-party crate that enables it.
[[banned_features]]
crate = "serde_json"
feature = "preserve_order"
allowed_kinds = []

# Doc 18 §3.5, FT-317: identifier and random generators outside the one ID generator (ew-ids, `getrandom` and the
# seeded source of ew-testids). These `uuid` and `rand` features compile `Uuid::new_v4`, `Uuid::now_v7` and an
# OS-seeded thread generator, whose paths the generated clippy.toml bans with `allow-invalid` (so it only bites
# once they exist): enabling one is a design change, so it is allowed on dev edges only.
[[banned_features]]
crate = "uuid"
feature = "v4"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "uuid"
feature = "v7"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "uuid"
feature = "fast-rng"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "rand"
feature = "thread_rng"
allowed_kinds = ["dev"]

# ARCH §3 rule 1, ADR-0002 decision 1: the untracked read API of ew-model. The tracked read layer, the
# transaction layer and the writer may enable it; any crate may enable it for tests.
[[banned_features]]
crate = "ew-model"
feature = "raw-read"
allowed_kinds = ["dev"]
allowed_packages = ["ew-derive", "ew-commands", "ew-store"]

# ARCH §3 Rule 4: importers depend on ew-interop-api, their parsers and permissive helpers only; they never
# see ew-model. Packages matching `pattern` may depend on permissive workspace crates only.
[importers]
pattern = "ew-import-*"

# ADR-0024 decision 4 and NFR-LIC-05: QET-derived code is confined. Only ew-api depends on ew-import-qet;
# ew-plugin-host and the permissive crates never reach it, directly or transitively ("@permissive" stands
# for every crate of the permissive layer).
[[confined]]
crate = "ew-import-qet"
only_direct_dependents = ["ew-api"]
never_reached_from = ["ew-plugin-host", "@permissive"]
reason = "ADR-0024 decision 4 (QET-derived code)"

# `cargo xtask check-raw-read` (ADR-0001 amendment 2, decision log ID-50, FT-01) guards the raw readers that
# ew-model declares under its `raw-read` feature, in two halves (details: the module doc of xtask/src/raw_read.rs).
#
# Calls: the workspace-root `clippy.toml` (`clippy_config`) is GENERATED from ew-model's own source by
# `cargo xtask check-raw-read --bless` and lists every reader as a clippy `disallowed-methods` path
# (`ew_model::Model::row`, ...), which clippy resolves through the type. The reader crates opt out with
# `#![allow(clippy::disallowed_methods)]` at each target root; no other crate may. The check fails when the
# committed file is missing, stale or hand-edited, when another `clippy.toml`/`.clippy.toml` shadows it, when
# `.cargo/config.toml` or a workflow mentions `CLIPPY_CONF_DIR` or `disallowed_methods`, and when a reader is
# not re-exported at ew-model's crate root (clippy would only warn about the unresolvable path).
#
# Lexical rules: the non-test Rust source of a workspace package outside `readers` (that reaches ew-model through
# normal dependencies) must not invoke the `raw_read!` macro, name the `raw-read` feature, or suppress the guard
# (`allow`/`expect` of `disallowed_methods`, `clippy::style`, `clippy::all` or `warnings`, also in `cfg_attr`); its
# manifest must not enable the feature or set `disallowed_methods`, `style` or `all` to `allow` under
# `[lints.clippy]` (nor may `[workspace.lints.clippy]`). Test code is exempt: the `tests/`, `benches/` and
# `examples/` directories, and items under `#[cfg(test)]` or `#[cfg(all(test, ..))]`; a `cfg(any(test, ..))` is
# production code.
#
# A false positive gets an `[[raw_read.allow]]` entry (file, item, reason); the item of a suppression finding is
# `disallowed_methods`. Inline suppressions of this check are not honoured, and an entry that matches nothing fails.
[raw_read]
crate = "ew-model"
feature = "raw-read"
macro = "raw_read"
readers = ["ew-model", "ew-derive", "ew-commands", "ew-store"]
# The generated clippy configuration, relative to the workspace root.
clippy_config = "clippy.toml"
# The guard's own source names the feature and the macro.
exempt_packages = ["xtask"]

# The allows of `disallowed_methods` below are for the wall-clock, environment and randomness list that shares the
# lint (FT-317, doc 18 §3.5), not for a raw reader. Each sits on a one-line helper that wraps the one call, and the
# entry's `count` is the number of those helpers: a further allow in the file is a finding here, and
# `cargo xtask check-disallowed-methods` reviews each site (ci/disallowed-methods-allow.toml).
[[raw_read.allow]]
path = "bin/ew/src/cli.rs"
item = "disallowed_methods"
count = 2
reason = "the helpers source_date_epoch and content_dir, the CLI's program-boundary environment reads; reviewed in ci/disallowed-methods-allow.toml"

[[raw_read.allow]]
path = "bin/elektrawatt/src/main.rs"
item = "disallowed_methods"
count = 1
reason = "the helper dbus_env_path, the portal availability heuristic (two D-Bus variables); reviewed in ci/disallowed-methods-allow.toml"

[[raw_read.allow]]
path = "crates/ew-viewmodel/src/settings.rs"
item = "disallowed_methods"
count = 1
reason = "the helper env_path, the shell's program-boundary environment read (EW_CONFIG_DIR and the platform directories, read once at start-up); reviewed in ci/disallowed-methods-allow.toml"

[[raw_read.allow]]
path = "crates/ew-sqlview/src/sandbox.rs"
item = "disallowed_methods"
count = 1
reason = "the helper deadline_now, the monotonic deadline of a sandboxed query; reviewed in ci/disallowed-methods-allow.toml"

[[raw_read.allow]]
path = "crates/ew-testkit/src/bench.rs"
item = "disallowed_methods"
count = 2
reason = "the helpers class_var and timer_start of the bench harness; reviewed in ci/disallowed-methods-allow.toml"

# [[raw_read.allow]]
# path = "crates/ew-example/src/lib.rs"   # relative to the workspace root, forward slashes
# item = "raw_read!"                      # "raw_read!", "raw-read" or "disallowed_methods"
# reason = "a third-party macro that is not ew-model's"
# count = 1                             # optional: exactly this many findings in the file; one more fails

# Asset presence (FT-382, decision log ID-575, ARCH §3 rule 1). The bytes under an asset hash never change, so reading
# them is no freshness hazard and sits outside the read gate; whether the model HOLDS an asset can change without a
# revision, so no memoised query may read it. In the non-test source of `packages` (the crate whose queries can reach
# the model; the reader crates are scanned too), a call `.asset(`, `.assets(`, `.has_asset(` or a path `::asset`,
# `::assets`, `::has_asset` is a finding unless the innermost function around it is listed below. A second reader is
# not added here: asset presence then becomes a tracked input of the memo engine (ADR-0002, ID-575).
[raw_read.asset_presence]
packages = ["ew-derive"]
accessors = ["asset", "assets", "has_asset"]

[[raw_read.asset_presence.allow]]
path = "crates/ew-derive/src/q.rs"
function = "logo_asset"
reason = "Q::logo_asset, the one named exception of ID-575: the format and size of a bare-hash logo; recorded as a read of the project row, safe while an asset becomes present only at open or through project.company.set, which changes that row"

# The crate table of docs/design/04-architecture.md §3, one table per crate of [layers] permissive and gpl and per
# planned crate, in the table's row order (the order of these headers). `cargo xtask docs-gen` writes the table between
# the `<!-- generated:crate-table -->` markers of doc 04; `cargo xtask check-deps` fails when a crate of those layers
# has no table here, or a table names no such crate. The cells:
# - Crate: the crate and the crates whose `row` names it, then `crate_note`;
# - Layer: `P` or `GPL` from [layers] (`planned_layer` for a planned crate, then `(planned)`), then `layer_note`;
# - Responsibility: `responsibility`; Key dependencies: `key_deps` (both Markdown, one line, no `|`).

[crates."ew-units"]
responsibility = '`Nm(i64)`, `Pt2`, `Rect`, rational `Grid{num,den}`, `Orient2` (8 variants), `Angle2(i32)` (10⁻³ degree; free texts and graphics only), `Pose3` (nm + quaternion rounded to 1e-9), fixed-point `Dec3` (mm², A, V)'
key_deps = 'serde 1.0.229; kurbo 0.13.1 and glam 0.34.1 conversions behind features'

[crates."ew-ids"]
responsibility = '`Id<T>`: UUIDv7 for new records, UUIDv5 for instantiated, imported and generated ones; per-session `u32` interner'
key_deps = 'uuid 1.28.0'

