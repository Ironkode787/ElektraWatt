# The rules between crates that the manifests alone do not state. `cargo xtask rules` checks them over
# `cargo metadata` (the direct, declared dependencies of every workspace package, all kinds and targets).
#
# A crate's layer is its licence: a crate whose manifest says `MIT OR Apache-2.0` is permissive, every other one is
# GPL. A crate's dependencies are its manifest's. Nothing here repeats either; a new crate needs no entry.
#
# The check fails when:
# - a permissive crate depends on a GPL workspace crate (any dependency kind);
# - a crate with an [allowed_edges] entry depends on a workspace crate outside it (dev-dependencies may also use
#   [allowed_dev_edges]);
# - an external crate matched by an [[external_owner]] rule is a direct dependency of a non-owner;
# - an importer depends on a workspace crate outside the permissive layer;
# - a [[confined]] crate has a direct dependent outside its list, or is reachable from a forbidden crate.
#
# The feature rules below ([[banned_features]], banned_crates, [[uniform_test_features]], [[required_features]])
# keep test-only features and crates, and network clients, out of the shipped binaries.

# Crates that may appear as dev-dependencies only (18 §5.2 CI-PR-09: egui_mcp in any non-test target).
# ew-testids, the seeded ID source of the tests (doc 18 §2.2), likewise; and ew-testkit, the test-only crate of the
# golden builders and the hostile corpus (doc 18 §11.2, WP-S6.04 D8).
# WP-S6.05 D3 (ADR-0029's interim rule): no HTTP, TLS, DNS or crash-upload client in the shipped binaries; a dev edge
# (1.0's mock server) stays allowed.
banned_crates = [
  "egui_mcp", "ew-testids", "ew-testkit",
  "attohttpc", "curl", "curl-sys", "h2", "hickory-resolver", "hyper", "isahc", "minreq", "native-tls", "openssl",
  "reqwest", "rustls", "sentry", "trust-dns-resolver", "ureq",
]

[layers]
# Development-only packages; they may not be depended on.
tools = ["xtask"]

# The two crates whose dependencies are the architecture: the window reaches the model only through the view model,
# and the view model only through `ew-api`. A crate without an entry here may depend on what its manifest says.
[allowed_edges]
"ew-viewmodel" = ["ew-api", "ew-hack"]
"ew-ui" = ["ew-viewmodel", "ew-render2d", "ew-render-cpu", "ew-hack"]

# Their tests may also use these.
[allowed_dev_edges]
"ew-viewmodel" = ["ew-testdir", "ew-commands", "ew-viewmodel", "ew-testkit"]
"ew-ui" = ["ew-testdir", "ew-commands"]

# ARCH §3 Rule 2: only ew-sqlview and ew-library link rusqlite.
[[external_owner]]
crates = ["rusqlite", "libsqlite3-sys"]
owners = ["ew-sqlview", "ew-library"]
reason = "ARCH §3 rule 2 (SQLite)"

# Only ew-ui and the app binary know egui.
[[external_owner]]
crates = ["egui", "eframe", "egui-wgpu", "egui_*", "egui-*"]
owners = ["ew-ui", "elektrawatt"]
reason = "ARCH §3 rule 3 (UI toolkit)"

# ARCH §3 Rule 3: only the renderers know wgpu.
[[external_owner]]
crates = ["wgpu", "wgpu-*"]
owners = ["ew-render2d"]
reason = "ARCH §3 rule 3 (GPU)"

# 18 §5.2 CI-PR-09 feature bans: test-only or unsafe features that must never be enabled on a non-test edge.
# allowed_kinds lists the dependency kinds (normal, dev, build) on which enabling the feature is fine.
# WP-S2.01 part 1, spec section 4 rule 5: the application build needs no system package. wgpu-hal's `gles`
# feature turns on `wayland-sys/dlopen`; without it wayland-sys' build script runs pkg-config for libwayland and
# links it. `cargo xtask check-features` fails when either feature leaves the resolved graph while its crate is in it.
[[required_features]]
crate = "eframe"
feature = "clipboard"
reason = "the desktop must publish Copy/Cut and read Paste through the operating-system clipboard"

[[required_features]]
crate = "egui-winit"
feature = "clipboard"
reason = "without it the desktop silently falls back to an app-internal clipboard"

[[required_features]]
crate = "wgpu-hal"
feature = "gles"
reason = "it gives wayland-sys its dlopen feature (no pkg-config probe, no libwayland at link time)"

[[required_features]]
crate = "wayland-sys"
feature = "dlopen"
reason = "without it the build script probes pkg-config and the binary links libwayland (a system package on the CI image)"

# The row dumps, `Preview::ops` and the history's ops of ew-commands (ARCH §3 rule 1, F9) are for tests only.
[[banned_features]]
crate = "ew-commands"
feature = "testkit"
allowed_kinds = ["dev"]

# WP-S2.03 §7.6: the probe tool's seam (`ShellModel::set_tool_for_tests`) is for tests only; the binaries never build
# it, so no shipped path can install a tool that commits.
[[banned_features]]
crate = "ew-viewmodel"
feature = "testkit"
allowed_kinds = ["dev"]

# RD43 T1: the two test-only features above are on in every test build, so no package set compiles their crates (and
# everything above them) a second way. `cargo xtask check-features` fails when a package whose test build reaches the
# crate does not request the feature on a dev edge, and names the line to add. The seeded ID source needs no rule:
# it is the dev-only crate ew-testids (banned_crates), which changes no feature of ew-ids.
[[uniform_test_features]]
crate = "ew-commands"
feature = "testkit"

[[uniform_test_features]]
crate = "ew-viewmodel"
feature = "testkit"

[[banned_features]]
crate = "rhai"
feature = "unchecked"
allowed_kinds = []

[[banned_features]]
crate = "egui"
feature = "inspection"
allowed_kinds = []

# `ew` declares no `test-confirm` feature: doc 18 §3.15's test-build confirmation hook is an injected terminal. The
# ban stays as the guard doc 18 names for it, and CI-R-09's release assertions check it (ID-1082).
[[banned_features]]
crate = "ew"
feature = "test-confirm"
allowed_kinds = ["dev"]

# Doc 05 §3.1, §10.3: canonical JSON needs serde_json's sorted `Map`; `preserve_order` switches every
# `Map` in the build to insertion order through feature unification and would change the bytes of unknown
# records and manifest members. Requested on no edge of any kind; ew-format's unit test
# `serde_json_objects_serialise_in_key_order` catches a third-party crate that enables it.
[[banned_features]]
crate = "serde_json"
feature = "preserve_order"
allowed_kinds = []

# Doc 18 §3.5, FT-317: identifier and random generators outside the one ID generator (ew-ids, `getrandom` and the
# seeded source of ew-testids). These `uuid` and `rand` features compile `Uuid::new_v4`, `Uuid::now_v7` and an
# OS-seeded thread generator, whose paths the generated clippy.toml bans with `allow-invalid` (so it only bites
# once they exist): enabling one is a design change, so it is allowed on dev edges only.
[[banned_features]]
crate = "uuid"
feature = "v4"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "uuid"
feature = "v7"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "uuid"
feature = "fast-rng"
allowed_kinds = ["dev"]

[[banned_features]]
crate = "rand"
feature = "thread_rng"
allowed_kinds = ["dev"]

# ARCH §3 rule 1, ADR-0002 decision 1: the untracked read API of ew-model. The tracked read layer, the
# transaction layer and the writer may enable it; any crate may enable it for tests.
[[banned_features]]
crate = "ew-model"
feature = "raw-read"
allowed_kinds = ["dev"]
allowed_packages = ["ew-derive", "ew-commands", "ew-store"]

# ARCH §3 Rule 4: importers depend on ew-interop-api, their parsers and permissive helpers only; they never
# see ew-model. Packages matching `pattern` may depend on permissive workspace crates only.
[importers]
pattern = "ew-import-*"

# ADR-0024 decision 4 and NFR-LIC-05: QET-derived code is confined. Only ew-api depends on ew-import-qet;
# ew-plugin-host and the permissive crates never reach it, directly or transitively ("@permissive" stands
# for every crate of the permissive layer).
[[confined]]
crate = "ew-import-qet"
only_direct_dependents = ["ew-api"]
never_reached_from = ["@permissive"]
reason = "ADR-0024 decision 4 (QET-derived code)"

# `cargo xtask check-raw-read` (ADR-0001 amendment 2, decision log ID-50, FT-01) guards the raw readers that
# ew-model declares under its `raw-read` feature, in two halves (details: the module doc of xtask/src/raw_read.rs).
#
# Calls: the workspace-root `clippy.toml` (`clippy_config`) is GENERATED from ew-model's own source by
# `cargo xtask check-raw-read --bless` and lists every reader as a clippy `disallowed-methods` path
# (`ew_model::Model::row`, ...), which clippy resolves through the type. The reader crates opt out with
# `#![allow(clippy::disallowed_methods)]` at each target root; no other crate may. The check fails when the
# committed file is missing, stale or hand-edited, when another `clippy.toml`/`.clippy.toml` shadows it, when
# `.cargo/config.toml` or a workflow mentions `CLIPPY_CONF_DIR` or `disallowed_methods`, and when a reader is
# not re-exported at ew-model's crate root (clippy would only warn about the unresolvable path).
#
# Lexical rules: the non-test Rust source of a workspace package outside `readers` (that reaches ew-model through
# normal dependencies) must not invoke the `raw_read!` macro, name the `raw-read` feature, or suppress the guard
# (`allow`/`expect` of `disallowed_methods`, `clippy::style`, `clippy::all` or `warnings`, also in `cfg_attr`); its
# manifest must not enable the feature or set `disallowed_methods`, `style` or `all` to `allow` under
# `[lints.clippy]` (nor may `[workspace.lints.clippy]`). Test code is exempt: the `tests/`, `benches/` and
# `examples/` directories, and items under `#[cfg(test)]` or `#[cfg(all(test, ..))]`; a `cfg(any(test, ..))` is
# production code.
#
# The lint also lists wall-clock, environment and randomness calls. A helper that wraps one such call allows the lint
# on itself and gives its reason in the attribute (`#[allow(clippy::disallowed_methods, reason = "...")]`): an allow
# with a reason on one item passes, a crate-wide one does not. Any other false positive gets an `[[raw_read.allow]]`
# entry (file, item, reason); an entry that matches nothing fails.
[raw_read]
crate = "ew-model"
feature = "raw-read"
macro = "raw_read"
readers = ["ew-model", "ew-derive", "ew-commands", "ew-store"]
# The generated clippy configuration, relative to the workspace root.
clippy_config = "clippy.toml"
# The guard's own source names the feature and the macro.
exempt_packages = ["xtask"]

# [[raw_read.allow]]
# path = "crates/ew-example/src/lib.rs"   # relative to the workspace root, forward slashes
# item = "raw_read!"                      # "raw_read!", "raw-read" or "disallowed_methods"
# reason = "a third-party macro that is not ew-model's"
# count = 1                             # optional: exactly this many findings in the file; one more fails

# Asset presence (FT-382, decision log ID-575, ARCH §3 rule 1). The bytes under an asset hash never change, so reading
# them is no freshness hazard and sits outside the read gate; whether the model HOLDS an asset can change without a
# revision, so no memoised query may read it. In the non-test source of `packages` (the crate whose queries can reach
# the model; the reader crates are scanned too), a call `.asset(`, `.assets(`, `.has_asset(` or a path `::asset`,
# `::assets`, `::has_asset` is a finding unless the innermost function around it is listed below. A second reader is
# not added here: asset presence then becomes a tracked input of the memo engine (ADR-0002, ID-575).
[raw_read.asset_presence]
packages = ["ew-derive"]
accessors = ["asset", "assets", "has_asset"]

[[raw_read.asset_presence.allow]]
path = "crates/ew-derive/src/q.rs"
function = "logo_asset"
reason = "Q::logo_asset, the one named exception of ID-575: the format and size of a bare-hash logo; recorded as a read of the project row, safe while an asset becomes present only at open or through project.company.set, which changes that row"
