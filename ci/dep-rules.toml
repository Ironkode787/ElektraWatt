[crates."ew-step-worker"]
crate_note = '(bin)'
layer_note = '(links LGPL OCCT)'
responsibility = 'STEP reading, tessellation, feature edges, hulls, mounting frames'
key_deps = 'occt-sys 7.8.1, opencascade 0.3.0, gltf 1.4.1'

[crates."ew-testkit"]
responsibility = 'Golden builders (CSV bootstrap through `ew-import-tables`, command DSL), S–XL and XL-A generators, oracle comparator, acceptance runner; the seeded S–XL generator ew_testkit::synth and the cold-operation benchmark harness ew_testkit::bench (WP-S1.05); the G-SP spike bench (`benches/spike.rs`)'
key_deps = "ew-model, ew-schema, ew-ids, ew-units, ew-mltext, ew-rds (the generator); ew-import-tables (golden builders, allowed edge); serde, serde_json (the builder DSL speaks the JSON parameters of the commands through a `CommandSink` the caller implements over its `Session`, so the edges to ew-api and ew-commands stay dev-only; cycle 15); dev: ew-api, ew-commands with testkit, ew-testids, ew-testdir (FT-569), ew-derive (the spike measures the connectivity families cold and through `ew-derive`'s `MemoStore`, which is how it reaches `ew-memo`: there is no direct edge to `ew-memo`; decision log ID-223, ID-263), serde_json; later: insta 1.49.0, proptest 1.12.0, dify 0.8.0, hayro 0.8.0 (test use); criterion 0.8.2 only as a front end of the nightly performance gate (NFR-PERF-20). Dev-only everywhere: no crate may take it as a normal dependency."

[crates."ew-hack"]
responsibility = '*As built (cycle 43, RD43 R17, a trial).* The workspace-hack crate of cargo-hakari: no code; its manifest, generated by `cargo hakari generate` (`cargo xtask settle`, step `hakari`), depends on the third-party crates the GPL members share with the union of their features, so building one package set after another reuses them. Every GPL member except the importers (rule 4) depends on it; the permissive crates and `xtask` never do, and the owner-only crates of rules 2 and 3 (egui, eframe, wgpu, rusqlite, `libsqlite3-sys`) and the shader translator of wgpu (naga, `naga-types`) are not in it (`.config/hakari.toml`). `publish = false`; no edges to workspace crates'
key_deps = 'third-party crates only, as generated; an empty `build.rs` so that its build-dependencies count'

