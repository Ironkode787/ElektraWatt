# The table of the CI-PR-08 path filter (ci/fuzz-smoke-targets.py, FT-335): for each cargo-fuzz target of `fuzz/`,
# its `-max_len`, the direct path dependencies of `ew-fuzz` that its code uses (`roots`) and the path-dependency
# closure of those (`closure`: every crate whose source the target is built from). A change of a crate in a target's
# closure runs that target. The closure is not guessed: a test of xtask
# (`workflows::tests::the_fuzz_smoke_table_is_the_path_dependency_closure_of_each_target`) computes it from the
# Cargo.toml files of the crates (normal and build dependencies, path dependencies only) and fails when this file
# differs, when a direct dependency of `ew-fuzz` is the root of no target, or when a target of `fuzz/Cargo.toml` or of
# the deep nightly's matrix is missing here. A new crate dependency of a target changes the closure and fails the
# test until the list is regenerated (`cargo xtask fuzz-smoke-table`, which keeps this header and the roots); the
# `max_len` values are those of the matrix of deep-nightly.yml (the self-test of the script compares them).
#
# `jsonl_loader` feeds `ew-format` alone (src/loader.rs); `migration_chain` opens a project directory with `ew-store`
# (src/open_path.rs); `command_sequence` runs the seeded command generator of `ew-testkit`
# (crates/ew-testkit/tests/command_fuzz, included as modules) through the `ew-api` facade, so it reaches the
# whole command, derivation, import and export stack. `png_pdf` feeds PNG bytes to `ew-render-cpu`'s decoder and the PDF
# writer of `ew-export` (src/png_pdf.rs). `ewz_read` feeds bytes to the strict `.ewz` reader of `ew-store`
# (src/ewz_read.rs). `merge_file` feeds three sides and a path to the three-way merge of `ew-format`
# (src/merge_file.rs). WP-S6.04's `sql_sandbox`, `textconv`, `table_round_trip` and `command_log` run on the golden
# project's in-memory session through the `ew-api` facade (src/golden.rs: `ew-format`'s loader, `ew-testkit`'s ID
# source); `svg_asset` feeds the asset sniff of `ew-schema` and the SVG path of `ew-scene`; `image_decode` feeds
# `ew-render-cpu`'s decoder through `ew-export`.
# `qet_project`, `qet_element`, `golden_tables` and `parts_table` feed the importers through the import front door of
# `ew-api` (src/importers.rs, WP-S3.09 D15), so they reach the import and command stack. `ewlib_read` writes a `.ewlib`
# directory and opens it with `ew-library`'s registry through `ew-api` (src/ewlib_read.rs, WP-S6.04, ID-1354).

[targets.jsonl_loader]
max_len = 65536
roots = ["ew-format"]
closure = ["ew-format", "ew-ids", "ew-mltext", "ew-rds", "ew-schema", "ew-units"]

[targets.migration_chain]
max_len = 65
roots = ["ew-format", "ew-model", "ew-store"]
