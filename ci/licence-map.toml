# ---------------------------------------------------------------------------------------------------------------
# L5: the JSON Schemas generated by ew-schema (05 §10.4). JSON cannot carry a header; REUSE.toml annotates them.
[[path]]
glob = "schemas/**"
allowed = ["MIT OR Apache-2.0"]

# ---------------------------------------------------------------------------------------------------------------
# L7: symbols, function definitions, frames, forms, templates and macros shipped as data (CC-BY-SA-4.0; the design
# exception of ADR-0024 is added to the expression once adopted, LG-2). JSON cannot carry headers: REUSE.toml.
[[path]]
glob = "content/**"
allowed = ["CC-BY-SA-4.0"]

# L8: the generic starter parts (WP-S2.18 D5) are part facts (CC0-1.0); the longer glob beats the L7 rule above.
[[path]]
glob = "content/libraries/ew-starter-parts.ewlib/**"
allowed = ["CC0-1.0"]

# L14: bundled third-party fonts keep their own licence and notices (OFL-1.1 for Noto Sans, ADR-0028); the
# notice rule lists the path under [notices].third_party. Binary files: REUSE.toml annotations.
[[path]]
glob = "assets/fonts/**"
allowed = ["OFL-1.1"]

# L14: the vendored Tabler Icons outline SVGs (MIT, WP-S2.17 D9); REUSE.toml annotations, provenance in NOTICE.
[[path]]
glob = "assets/icons/tabler/**"
allowed = ["MIT"]

# L1: the project's own icon glyphs (WP-S2.17 D9), the application's licence; REUSE.toml annotations.
[[path]]
glob = "assets/icons/ew/**"
allowed = ["GPL-3.0-or-later"]

# ---------------------------------------------------------------------------------------------------------------
# L9: documentation and the root prose files (CC-BY-4.0). LICENSE.md is L11 (below).
[[path]]
glob = "docs/**"
allowed = ["CC-BY-4.0"]

# The generated reference pages of the user guide (`cargo xtask docs-gen`) are made of the doc comments of the GPL
# crates (command schemas of ew-commands, rule catalogue of ew-checks): they keep the crates' licence (owner ruling,
# cycle 16). The longer globs beat `docs/**`; REUSE.toml annotates the same paths.
[[path]]
glob = "docs/book/src/reference/commands/**"
allowed = ["GPL-3.0-or-later"]

[[path]]
glob = "docs/book/src/reference/rules/**"
allowed = ["GPL-3.0-or-later"]

# WP-S2.08 part 1 (D5 (b)): the glossary page is generated from ew-viewmodel's glossary file (GPL, like the crate).
[[path]]
glob = "docs/book/src/reference/glossary.md"
allowed = ["GPL-3.0-or-later"]

# WP-S2.08 part 2: the keymap page is generated from ew-viewmodel's keymap sheet (GPL, like the crate).
[[path]]
glob = "docs/book/src/reference/keymaps.md"
allowed = ["GPL-3.0-or-later"]

# The blind drafter's files (WP-S6.13, ID-622, FT-415): the prompts, personas, task sheets, recordings and the harness
# help are prose and data written for agents, CC-BY-4.0 like docs/ (L9); the generated reference files under
# tools/blind/reference/ are made of ew-viewmodel's strings (the action labels and the describe vocabulary), so they
# keep that crate's licence, as the generated command and rule pages do (the docs-gen precedent). The harness code is
# xtask's (xtask/**, MIT OR Apache-2.0). The longer glob beats `tools/blind/**`; REUSE.toml annotates the same paths.
[[path]]
glob = "tools/blind/**"
allowed = ["CC-BY-4.0"]

[[path]]
glob = "tools/blind/reference/**"
allowed = ["GPL-3.0-or-later"]

[[path]]
glob = "*.md"
allowed = ["CC-BY-4.0"]

# The Contributor Covenant 3.0 text is licensed CC-BY-SA-4.0 by its steward (its Attribution section), not
# CC-BY-4.0 as 19 §2.1 L9 and §2.3 first assumed ("verify"). The file keeps the Covenant's own licence, as 19
# §2.1 and §2.3 now record.
[[path]]
glob = "CODE_OF_CONDUCT.md"
allowed = ["CC-BY-SA-4.0"]

