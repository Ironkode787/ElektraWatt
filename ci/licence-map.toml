# The path-to-licence map of docs/design/19-open-source-governance.md §2.1 (ADR-0024 decision 1 and
# amendment 2) in machine form, checked by `cargo xtask check-licence-map` (19 §5.1, rules LR-01 … LR-04).
#
# Every committed file except the licence texts under LICENSES/ must match at least one [[path]] glob. The
# longest matching glob (in characters) wins; two different rules with the same length that both match a file
# are a policy error. The file's SPDX licence expression, read from its header (first 10 lines) or from its
# REUSE.toml annotation, must be one of the rule's `allowed` expressions. A rule with `crate = true` covers a
# workspace crate: the `license` field of the crate's Cargo.toml must equal its single allowed expression.
#
# Glob syntax is the one of REUSE.toml (REUSE specification 3.3): `*` matches any run of characters except
# `/`, `**` matches any run of characters including `/`; there are no other special characters. A path not
# matched by any rule fails (LR-11: unknown files, such as a committed third-party fixture, are rejected).
#
# Changing a row here is a licence change: it needs the matching change in 19 §2.1 and LICENSE.md, and the
# RFC process of 19 §3.4 (label `licence`).

# ---------------------------------------------------------------------------------------------------------------
# L1: application and GPL-layer crates, binaries. `GPL-3.0-or-later WITH LicenseRef-ElektraWatt-plugin-exception`
# once ADR-0025 is accepted; until then plain `GPL-3.0-or-later` (ADR-0025 "Pending", LG-2).
# Crates of 19 §2.1 that do not exist yet (ew-viewer, ew-py, ew-wiring-viewer) are listed so that they land
# in the right row.
