# The AI-assistance configuration (agent roles, settings, workflows).
[[path]]
glob = ".claude/**"
allowed = ["CC0-1.0"]

[[path]]
glob = "docs/plan/tools/.gitignore"
allowed = ["CC0-1.0"]

# L8 (test fixtures): own test fixtures under crates/*/tests/fixtures/ are CC0-1.0 (19 §2.1 L8, LR-11); the
# longer glob beats the crate rule. A crate rule longer than this glob (26 characters) would win instead; such a
# crate needs its own lengthened fixtures glob, e.g. `crates/<crate>/tests/fixtures/**`.
[[path]]
glob = "crates/*/tests/fixtures/**"
allowed = ["CC0-1.0"]

# L8 (golden fixture): golden/ holds the anonymised golden project, its tables, generator and expected outputs
# (19 §2.1 L8, ADR-0024, doc 20 §3.1).
[[path]]
glob = "golden/**"
allowed = ["CC0-1.0"]

# ---------------------------------------------------------------------------------------------------------------
# L12: CI workflows, scripts and tools (MIT OR Apache-2.0), so that others may copy the gates.
[[path]]
glob = ".github/workflows/**"
allowed = ["MIT OR Apache-2.0"]

[[path]]
glob = "ci/**"
allowed = ["MIT OR Apache-2.0"]

# Prose in ci/ is documentation (L9).
[[path]]
glob = "ci/**.md"
allowed = ["CC-BY-4.0"]

[[path]]
glob = "xtask/**"
allowed = ["MIT OR Apache-2.0"]
crate = true

[[path]]
glob = "docs/plan/tools/**"
allowed = ["MIT OR Apache-2.0"]

# ---------------------------------------------------------------------------------------------------------------
# LR-04 and NFR-LIC-05: GPL-2.0 (ported QElectroTech code) may appear only here, in files and in the rows above.
[gpl2]
only_in = "crates/ew-import-qet/src/qet_port/**"

# ---------------------------------------------------------------------------------------------------------------
# Files that may carry third-party copyright lines above the collective notice (NFR-LIC-10, 19 §2.3). Every
# other file carries exactly one copyright line, `<year> The ElektraWatt contributors`.
[notices]
third_party = [
  "CODE_OF_CONDUCT.md",
  "crates/ew-import-qet/src/qet_port/**",
  "assets/fonts/**",
  "assets/icons/tabler/**",
  "crates/ew-ui/src/icons/generated.rs",
  "crates/ew-schema/tests/fixtures/svg-exporters/**",
  "crates/ew-export/tests/fixtures/raster-exporters/**",
]

# ---------------------------------------------------------------------------------------------------------------
# The licence-boundary allowlist (NFR-MAINT-02, 19 LR-03, ADR-0024 decision 2 and amendment 3): every package in
# the dependency closure (normal, build and dev, all features) of every permissive crate must have a `license`
# expression that is satisfiable from these licences. An OR needs one allowed operand, an AND needs all.
[boundary]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
