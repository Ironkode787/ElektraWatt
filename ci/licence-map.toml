# The cargo-fuzz crate (FT-297): GPL-3.0-or-later like the crates it fuzzes (it includes the GPL test modules of
# ew-testkit). It is not a workspace member (its own workspace, excluded in the root Cargo.toml), so the rule is
# not `crate = true`; its manifest carries the licence all the same. Its lock file, its toolchain file, the seed
# corpora (made from the golden project) and the committed crash inputs are CC0-1.0, its README CC-BY-4.0 (L9).
