allowed = ["MIT OR Apache-2.0"]

# ---------------------------------------------------------------------------------------------------------------
# L9: documentation and the root prose files (CC-BY-4.0). LICENSE.md is L11 (below).
[[path]]
glob = "docs/**"
allowed = ["CC-BY-4.0"]

[[path]]
glob = "*.md"
allowed = ["CC-BY-4.0"]

# The Contributor Covenant 3.0 text is licensed CC-BY-SA-4.0 by its steward (its Attribution section), not
# CC-BY-4.0 as 19 §2.1 L9 and §2.3 first assumed ("verify"). The file keeps the Covenant's own licence, as 19
# §2.1 and §2.3 now record.
[[path]]
glob = "CODE_OF_CONDUCT.md"
allowed = ["CC-BY-SA-4.0"]

# ---------------------------------------------------------------------------------------------------------------
# L11: repository metadata and configuration without creative content (CC0-1.0).
[[path]]
glob = "LICENSE.md"
allowed = ["CC0-1.0"]

[[path]]
glob = "REUSE.toml"
allowed = ["CC0-1.0"]

[[path]]
glob = ".gitignore"
allowed = ["CC0-1.0"]

[[path]]
glob = ".gitattributes"
allowed = ["CC0-1.0"]

[[path]]
glob = "Cargo.toml"
allowed = ["CC0-1.0"]

[[path]]
glob = "Cargo.lock"
allowed = ["CC0-1.0"]

[[path]]
glob = "rust-toolchain.toml"
allowed = ["CC0-1.0"]

[[path]]
glob = "rustfmt.toml"
allowed = ["CC0-1.0"]

[[path]]
glob = "deny.toml"
allowed = ["CC0-1.0"]

[[path]]
glob = "about.toml"
allowed = ["CC0-1.0"]

[[path]]
glob = ".cargo/**"
allowed = ["CC0-1.0"]

[[path]]
glob = ".config/**"
allowed = ["CC0-1.0"]

[[path]]
glob = ".github/**"
allowed = ["CC0-1.0"]

# cargo-vet rewrites these files and drops comments, so they are annotated in REUSE.toml.
[[path]]
glob = "supply-chain/**"
allowed = ["CC0-1.0"]

# The AI-assistance configuration (agent roles, settings, workflows).
[[path]]
glob = ".claude/**"
allowed = ["CC0-1.0"]

[[path]]
glob = "docs/plan/tools/.gitignore"
allowed = ["CC0-1.0"]

# ---------------------------------------------------------------------------------------------------------------
# L12: CI workflows, scripts and tools (MIT OR Apache-2.0), so that others may copy the gates.
[[path]]
glob = ".github/workflows/**"
allowed = ["MIT OR Apache-2.0"]

[[path]]
glob = "ci/**"
allowed = ["MIT OR Apache-2.0"]

# Prose in ci/ is documentation (L9).
[[path]]
glob = "ci/**.md"
allowed = ["CC-BY-4.0"]

[[path]]
glob = "xtask/**"
allowed = ["MIT OR Apache-2.0"]
crate = true

[[path]]
glob = "docs/plan/tools/**"
allowed = ["MIT OR Apache-2.0"]

# ---------------------------------------------------------------------------------------------------------------
# LR-04 and NFR-LIC-05: GPL-2.0 (ported QElectroTech code) may appear only here, in files and in the rows above.
[gpl2]
only_in = "crates/ew-import-qet/src/qet_port/**"

# ---------------------------------------------------------------------------------------------------------------
# Files that may carry third-party copyright lines above the collective notice (NFR-LIC-10, 19 §2.3). Every
# other file carries exactly one copyright line, `<year> The ElektraWatt contributors`.
[notices]
third_party = ["CODE_OF_CONDUCT.md", "crates/ew-import-qet/src/qet_port/**"]

# ---------------------------------------------------------------------------------------------------------------
# The licence-boundary allowlist (NFR-MAINT-02, 19 LR-03, ADR-0024 decision 2 and amendment 3): every package in
# the dependency closure (normal, build and dev, all features) of every permissive crate must have a `license`
# expression that is satisfiable from these licences. An OR needs one allowed operand, an AND needs all.
[boundary]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
