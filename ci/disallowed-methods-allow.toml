# The reviewed allow sites of the wall-clock, environment and randomness lint (FT-317, WP-S6.02, doc 18
# §3.5): every place that allows `clippy::disallowed_methods` for `SystemTime::now`, `Instant::now`,
# `std::env::var` and its siblings, `RandomState::new` or `getrandom` because the value never reaches a
# persisted, exported or printed result, or because the place is a sanctioned source (the ID generator,
# the program boundary, a timer of a test or bench). In the reader crates, which opt out of the whole
# lint for the raw readers, a site is the call itself, found lexically. Keyed by crate and item path (no
# file, no line) with the number of sites. `cargo xtask check-disallowed-methods` fails when the source
# and this list differ, so a new allow is reviewed in the change that adds it; `--bless` rewrites the file.

