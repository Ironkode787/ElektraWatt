[[audits.gif]]
who = "Ironkode787"
criteria = "safe-to-deploy"
version = "0.14.2"
notes = "AI-performed, owner-delegated (2026-10-23), cycle 25 lane D lead audit (FT-406), krilla raster-images. Read all src (7 files, 2.9k lines) and benches (38.7 KB crate). forbid(unsafe_code), no_std+alloc; deps weezl (in graph) and color_quant (encoder only); no build.rs; fs only in doc examples and benches. 50 MB per-frame memory limit by default. DoS caveat: StreamingDecoder::update spins if fed data after the trailer (the Trailer state consumes nothing); Decoder stops at the trailer. Reached only through krilla Image::from_gif, which ElektraWatt never calls."

[[audits.image-webp]]
who = "Ironkode787"
criteria = "safe-to-deploy"
version = "0.2.4"
notes = "AI-performed, owner-delegated (2026-10-23), cycle 25 lane D lead audit (FT-406), krilla raster-images. Read all src (14 files, 7.6k lines; src/mod.rs is stale and not compiled; 68.5 KB crate). forbid(unsafe_code); deps byteorder-lite, quick-error (in graph); no build.rs, no fs/net/env. DoS caveats (bugs): memory limit usize::MAX, so ICCP/EXIF/XMP reads allocate the declared chunk size (to 4 GiB) before reading; VP8 allocates planes from the header size (about 400 MB) before data; the animated canvas size w*h*4 is computed in u32 and can overflow into a slice panic. Reached only through krilla Image::from_webp, which ElektraWatt never calls."

