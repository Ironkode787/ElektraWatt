[[audits.lzma-rust2]]
who = "Ironkode787"
criteria = "safe-to-deploy"
version = "0.23.0"
notes = "AI-performed, owner-delegated (2026-10-22), cycle 53 lane FIX25b targeted audit (ID-1460). Compiled with std and optimization only (sevenz-rust2 forces both; no encoder, lzip or xz): no dependency, no build.rs, no fs/env/net/process in library code (std::fs only in bcj.rs's tests). Read the decoding paths: lzma_reader.rs, lzma2_reader.rs, lz/lz_decoder.rs, range_dec.rs, decoder.rs, state.rs and the bcj and delta filters. The window grows with the decoded output (try_reserve_exact, capped at the declared dictionary), not up front. The decoder's unsafe is range_dec.rs's two inline-asm decode_direct_bits loops (x86_64, aarch64; nostack, readonly, pure): each read index is clamped to buf.len() - 1, and is_buffer() keeps an empty slice off the asm path (RangeDecoderBuffer is created at 64 KiB). The other unsafe (lz/mod.rs extend_match with get_unchecked and read_unaligned, lz_encoder.rs's SIMD normalisation) is reached only by the encoder's match finders, which no decoding path calls. lzma2_reader_mt.rs spawns worker threads only for a thread count of two or more; ElektraWatt sets one. Caveat: out-of-bounds input reads return 1 by design, failing later as dist overflow; malformed input fails with an error, which ElektraWatt calls under its own header bounds and the import front door's catch_unwind."

