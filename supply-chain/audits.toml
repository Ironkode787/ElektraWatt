[[audits.sevenz-rust2]]
who = "Ironkode787"
criteria = "safe-to-deploy"
version = "0.24.2"
notes = "AI-performed, owner-delegated (2026-10-22), cycle 53 lane FIX25b targeted audit (ID-1460). Compiled without default features (no aes256, bzip2, compress, ppmd or util): dependencies crc32fast and lzma-rust2 only, no build.rs, no unsafe anywhere in the crate. Read the compiled modules: lib.rs, archive.rs, block.rs, bitset.rs, decoder.rs, error.rs, time.rs, encryption/password.rs and reader.rs (header parsing, stream map, BoundedReader, Crc32VerifyingReader, NamesReader, build_decode_stack and for_each_entries). Every header count is bounded by the header's length and allocated fallibly; the next header is bounded by the file length; names are UTF-16 with fallible growth. File access only in the path-based Archive::open and ArchiveReader::open, which ElektraWatt never calls (it reads a Cursor). Caveats: the LZMA2 and PPMd memory limit is usize::MAX, the LZMA dictionary is not bounded, a header that declares millions of entries allocates for them before failing, and the multi-stream (BCJ2) path seeks with unchecked i64 casts; ElektraWatt walks the header under its own bounds first (ew-import-eplan src/seven.rs: counts, sizes, dictionaries, ratio, copy, LZMA and LZMA2 only, simple coders), so none of these is reached."

