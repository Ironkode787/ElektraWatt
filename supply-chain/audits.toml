[[audits.ashpd]]
who = "Ironkode787"
criteria = "safe-to-deploy"
version = "0.13.13"
notes = "AI-performed, owner-delegated (2026-10-22), cycle 47 lane P47 targeted audit (WP-S3.07 part 3, D11); confirmed by the cycle-47 review. Used on Linux only with default features off and async-io + print: the gtk4, wayland and raw-handle modules (all of the crate's unsafe blocks) are not compiled. Read the compiled paths: the Print portal proxy (prepare_print, print with a borrowed fd), Request/Response handling, the handle token (getrandom), the helpers (is_flatpak reads /.flatpak-info's existence, is_snap reads /proc/<pid>/cgroup) and WindowIdentifier, whose unsafe impl Send/Sync is sound with its String and integer (X11 c_ulong) variants, the only ones compiled. No build.rs, no subprocess, no network beyond the session D-Bus through zbus (already audited in the graph). Caveat: request.rs can panic on a malformed portal reply; ElektraWatt calls it under catch_unwind (ew-print's chain)."

[[audits.async-executor]]
who = "Ironkode787"
criteria = "safe-to-deploy"
delta = "1.14.0 -> 1.14.1"
notes = "AI-performed, owner-delegated (2026-10-22), cycle 47 lane SC47. Delta over the exempt 1.14.0, read in full (about 110 changed source lines in src/lib.rs and src/static_executors.rs; the rest is the version bump, the changelog and the vendored Cargo.lock of the crate's own dev tree). Upstream's fix for a use-after-free when a Waker fires during Executor::drop (1.14.0 regression, yanked): the task's schedule closure again holds an Arc<State> clone instead of a lifetime-extended Pin<&State>, so the state outlives any Waker. The one new unsafe block is state_as_arc, Arc::from_raw on the pointer the Executor owns from Arc::into_raw, then clone and mem::forget (the Arc::increment_strong_count pattern), sound while the Executor lives; spawn_inner's own precondition is unchanged. StaticExecutor::leak now calls state_ptr, which allocates when still null, and forgets the executor so its own count is never released. The Pin plumbing is removed and the MSRV drops from 1.65 to 1.63. No build.rs, no new dependency, no I/O, no network, no subprocess."

[[audits.clipboard-win]]
who = "Ironkode787"
criteria = "safe-to-deploy"
version = "5.4.3"
notes = "AI-performed, owner-delegated (2026-10-26), full source review by a GPT-6.1 Sol coder and completed independent GPT-6.1 Sol lead review; pending owner confirmation before a distributed binary. Read all nine library source files, all shipped tests, manifests/package metadata, README and the pinned upstream BSL-1.0 licence (omitted from the archive). No build.rs, file-path opening, environment read, subprocess or remote network in library code. Win32 clipboard/FFI uses open/close guards and GlobalLock/Unlock guards; successful SetClipboardData transfers the global allocation to Windows, and failed publication frees it. Shipping egui-winit/arboard reaches Unicode get_string/set_string and automatic image-paste fallback through get_vec for PNG or CF_DIBV5; image fallback is not Unicode-only. The HTML fragment fix uses checked UTF-8 slicing and extend_from_slice; HTML/file-list APIs and the new_attempts retry helper are not requested by current application callers. The 5.4.3 new_attempts helper now sleeps 5 ms; arboard owns its own Clipboard::new retry loop. Monitor is disabled, windows-win absent. Caveats: clipboard buffers and allocations are unbounded; Code-established length casts turn get_string UTF-16 count 0xffffffff (8 GiB minus 2 bytes) and set_string input 0xffffffff bytes (4 GiB minus 1 byte) into Win32 i32 -1, selecting a NUL-terminated scan; OS acceptance and exploitability at those sizes are unverified. The unchecked second text-conversion result also retains OS/stability assumptions, with no general memory-safety or denial-of-service guarantee. Pre-existing bitmap helpers allocate a 40-byte header then form a 44-byte BITMAPINFO reference for 24/32bpp, and bitmap setting trusts header/FFI size assumptions; arboard does not call these helpers (its reached image fallback copies raw bytes instead). This full audit is not a delta over the exempt 5.4.1. Existing error-code 3.4.0 remains exempt and is not audited here. The targeted update replaces yanked 5.4.1 with non-yanked 5.4.3; upstream issue 42 confirms the HTML security fix in 5.4.2, retained here. No application-source changes."

