[alias]
# Repository policy checks and the local mirror of the per-PR CI set: `cargo xtask --help`.
xtask = "run --quiet --package xtask --"

# Local Windows builds link with rust-lld, the LLVM linker that ships in the rustup toolchain's own `rustc`
# component (rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe, no extra download); rustc finds it in its sysroot.
# It links the test binaries in about half the time of link.exe (cycle 32: a rebuild of ew-api's test binaries
# after a change to the crate, 58 s with link.exe, 33 s with rust-lld). The MSVC libraries are still found
# through the Visual Studio installation, as for link.exe.
#
# These are config rustflags, so the RUSTFLAGS environment variable replaces them. The workflows that build on
# Windows set RUSTFLAGS: `ci.yml` workflow-wide (`-D warnings`) and `cli-artefact.yml` in its `cli-artefact` job
# (`-D warnings`; its `release-check` job, on Linux, exports the path remaps). So CI and the Windows release
# artefact keep link.exe. A local build with RUSTFLAGS set links with link.exe too (and rebuilds everything when
# RUSTFLAGS changes).
[target.x86_64-pc-windows-msvc]
rustflags = ["-Clinker=rust-lld.exe"]
