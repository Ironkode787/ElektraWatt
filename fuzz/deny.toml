# cargo-deny configuration for the fuzz crate's own dependency graph (the crate is outside the workspace, so the
# workspace's deny.toml run does not see it). Run by the job `fuzz-deny` of .github/workflows/deep-nightly.yml, report-only:
#   cargo deny --locked --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check licenses advisories
# The policy is the workspace's (../deny.toml; a test of xtask keeps the licence allowlist equal) with one exception:
# libfuzzer-sys is `(MIT OR Apache-2.0) AND NCSA` because it carries LLVM's libFuzzer runtime. NCSA is OSI-approved and
# permissive, but it is not on the project allowlist (NFR-LIC-04), and the crate is a development tool that is never
# distributed, so the exception is per crate and not an allowlist change.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",
]
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]
confidence-threshold = 0.93
unused-allowed-license = "allow"
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
