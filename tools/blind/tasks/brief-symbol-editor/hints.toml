[[hint]]
text = "New symbol on the Draw tab, or in Parts, draws a symbol of your own. The user guide has a drawing tutorial."
[[hint]]
text = "Properties, right of the drawing, takes exact coordinates and each pin's name and potential. The short sheet left of the drawing holds the symbol's name and what it is; Save keeps it with your parts."
