[[item]]
id = "A1"
kind = "hard"
what = "The tester authored graphics and a physical connection point. Picture fidelity is assessed separately from the frames and saved symbol, not inferred from these actions."
how = "outcomes"
actions = ["symbol.draw", "symbol.cp"]

[[item]]
id = "A2"
kind = "hard"
what = "The saved project contains a placed copy of the new supply block: a test copy or the saved symbol with its own function definition (a key made from its name), or a test copy on a scratch page (the scratch page found by its title in either window language). The six pin designations, mapping and native grid are checked separately in the saved symbol."
how = "work"
query = "SELECT f.id FROM api_v1_function f LEFT JOIN api_v1_page p ON p.id = f.page_id WHERE f.page_id IS NOT NULL AND f.ip_name IS NULL AND (f.fndef LIKE 'user.%.function' OR p.title LIKE 'Symbol test: %' OR p.title LIKE 'Symbooltest: %')"
expect = ">= 1"

[[item]]
id = "A3"
kind = "hard"
what = "The tester authored a text slot and opened an orientation preview. Slot kind, anchor placement and visual quality are checked separately in the saved symbol and frames."
how = "outcomes"
actions = ["symbol.slot", "symbol.variant"]

[[item]]
id = "A4"
kind = "hard"
what = "The symbol was saved with his parts and a test copy was placed in the saved project."
how = "work, outcomes"
actions = ["parts.save", "symbol.scratch or symbol.place", "file.save"]
