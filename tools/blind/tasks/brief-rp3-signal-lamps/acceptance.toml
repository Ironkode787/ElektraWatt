# The acceptance list of RP3, on a copy of the sample, whose check report is clean, so no item
# asks for a clean report that the persona's change alone could spoil. Correctness is A1 and A2 (`ew sql`); the
# measures are A4 and A7 here and `ew layout <project> --page 102` in the round's report: its hard rules must be 0, and
# its crossings and bends are written beside the keep score and the sample's own `ew layout` line. A finding of the
# run is written as a row of the round's report: the run, the item or the measure, what the tester did, what the
# program showed, a frame.

[[item]]
id = "A1"
kind = "hard"
what = "-102E1 stands two columns to the right of where it was, in 102-E7."
how = "pages"
query = "SELECT tag FROM api_v1_device WHERE tag = '-102E1' AND main_folio = '102' AND main_cell = 'E7'"
expect = "== 1"

[[item]]
id = "A2"
kind = "hard"
what = "A second lamp is wired in parallel with -102E1: a lamp other than -102E1 on both of its potentials."
how = "connections"
query = "SELECT f.device_tag FROM api_v1_function f WHERE f.fndef = 'ew.fn.lamp' AND f.device_tag <> '-102E1' AND f.device_tag IN (SELECT from_tag FROM api_v1_wire WHERE potential_name = '24V/102Q1:14' UNION SELECT to_tag FROM api_v1_wire WHERE potential_name = '24V/102Q1:14') AND f.device_tag IN (SELECT from_tag FROM api_v1_wire WHERE potential_name = '0V' UNION SELECT to_tag FROM api_v1_wire WHERE potential_name = '0V')"
expect = ">= 1"

[[item]]
id = "A3"
kind = "hard"
what = "The tester let the program route the lamps' wires again (Route)."
how = "outcomes"
actions = ["layout.route"]

[[item]]
id = "A4"
kind = "hard"
what = "No drawn wire passes a connection point it does not join, runs along another wire or through a symbol, and no wire is left without a route."
how = "check"
query = "SELECT fingerprint FROM api_v1_message WHERE rule IN ('EW-CORE-067', 'EW-CORE-068', 'EW-CORE-069', 'EW-CORE-073')"
expect = "== 0"

[[item]]
id = "A5"
kind = "hard"
what = "The tester ran the check."
how = "outcomes"
actions = ["messages.check"]

[[item]]
id = "A6"
kind = "hard"
what = "Delivered: the tester saved the project and exported the PDF itself."
how = "pdf, work, outcomes"

[[item]]
id = "A7"
kind = "soft"
what = "No wire runs through a text, and no junction joins four wires."
how = "check"
query = "SELECT fingerprint FROM api_v1_message WHERE rule IN ('EW-CORE-070', 'EW-CORE-072')"
expect = "== 0"
