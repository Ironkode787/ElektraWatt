# The acceptance list: doc 16 section 19.4's success criterion of T2 as items. `stop` decides each item
# mechanically on the saved project; `check-brief` decides them on the reference solution.

[[item]]
id = "A1"
kind = "hard"
what = "A wire joins the incoming 24 V (the + of the power supply -101G1, through the interruption point 24V) to input 1 of the breaker -102F1."
how = "connections"
query = "SELECT number FROM api_v1_wire WHERE (from_tag = '-101G1' AND from_cp = '+' AND to_tag = '-102F1' AND to_cp = '1') OR (to_tag = '-101G1' AND to_cp = '+' AND from_tag = '-102F1' AND from_cp = '1')"
expect = "== 1"

[[item]]
id = "A2"
kind = "hard"
what = "A wire joins output 2 of -102F1 to terminal 1 of the strip -X1021."
how = "connections"
query = "SELECT number FROM api_v1_wire WHERE (from_tag = '-102F1' AND from_cp = '2' AND to_tag = '-X1021:1') OR (to_tag = '-102F1' AND to_cp = '2' AND from_tag = '-X1021:1')"
expect = "== 1"

[[item]]
id = "A3"
kind = "hard"
what = "No unconnected-connection-point finding on -102F1."
how = "check"
query = "SELECT fingerprint FROM api_v1_message WHERE rule = 'EW-POT-009' AND target_tags LIKE '-102F1:%'"
expect = "== 0"
