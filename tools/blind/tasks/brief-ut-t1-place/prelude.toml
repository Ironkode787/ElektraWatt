# The class of every step of `prelude.uiscript`, in order: setup only. The start project is a copy of the sample
# (`task.toml`: `start = "sample"`); the prelude opens it and deletes the 24 V breaker -102F1 of folio 102 with its two
# wires (the former GP-UT), the start state of T1.

[[step]]
action = "file.open"
class = "setup"

[[step]]
action = "page.goto"
class = "setup"

[[step]]
action = "select.set"
class = "setup"

[[step]]
action = "edit.delete_selection"
class = "setup"

[[step]]
action = "file.save"
class = "setup"
