# The acceptance list (WP-S2.12 D7): ADR-0007's probe A7 ("the device back in place with its connection points
# connected to those ends") as items. `stop` decides each item mechanically on the saved project; `check-brief`
# decides them on the reference solution.

[[item]]
id = "A1"
kind = "hard"
what = "The lamp -102E1 is back in its place, cell E5 of folio 102."
how = "pages"
query = "SELECT tag FROM api_v1_device WHERE tag = '-102E1' AND main_folio = '102' AND main_cell = 'E5'"
expect = "== 1"

[[item]]
id = "A2"
kind = "hard"
what = "Its connection X1 is wired to -102Q1:14 again."
how = "connections"
query = "SELECT number FROM api_v1_wire WHERE (from_tag = '-102Q1' AND from_cp = '14' AND to_tag = '-102E1' AND to_cp = 'X1') OR (to_tag = '-102Q1' AND to_cp = '14' AND from_tag = '-102E1' AND from_cp = 'X1')"
expect = "== 1"

[[item]]
id = "A3"
kind = "hard"
what = "Its connection X2 is still wired to its 0V terminal -X1021:7."
how = "connections"
query = "SELECT number FROM api_v1_wire WHERE (from_tag = '-X1021:7' AND to_tag = '-102E1' AND to_cp = 'X2') OR (to_tag = '-X1021:7' AND from_tag = '-102E1' AND from_cp = 'X2')"
expect = "== 1"

[[item]]
id = "A4"
kind = "soft"
what = "No connection point of -102E1 is left unconnected."
how = "check"
query = "SELECT fingerprint FROM api_v1_message WHERE rule = 'EW-POT-009' AND target_tags LIKE '-102E1:%'"
expect = "== 0"
