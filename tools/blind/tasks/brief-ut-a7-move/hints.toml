# The hints (WP-S2.12 D8), from where to look to what to do, in the user's words; `hint` gives them one at a time.

[[hint]]
text = "The lamp -102E1 stands two columns to the right of its place on folio 102; its place is straight below the contact -102Q1:13-14, so that X1 lines up under the contact's lower end."

[[hint]]
text = "Select the lamp and move it back two columns to the left; moving it does not draw the lost wire, so draw the wire from the contact to the lamp's X1 again afterwards."

[[hint]]
text = "Click the lamp, choose Move, put it under the contact and confirm; then choose Wire in the Draw menu and click the contact's lower end and then the lamp's X1."
