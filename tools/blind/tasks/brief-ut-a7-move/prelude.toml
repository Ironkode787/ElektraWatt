# The class of every step of `prelude.uiscript`, in order: setup only. The start project is a copy of Golden A
# (`task.toml`: `start = "golden-a"`); the prelude deletes the wire W18 (S56:14 to E56:X1) and moves E56's
# representation twelve grid steps to the right (to 101-E16), saves, and shows folio 101.

[[step]]
action = "file.open"
class = "setup"

[[step]]
action = "command.run"
class = "setup"

[[step]]
action = "command.run"
class = "setup"

[[step]]
action = "file.save"
class = "setup"

[[step]]
action = "page.goto"
class = "setup"
