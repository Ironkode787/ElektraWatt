# The acceptance list (WP-S2.12 D7): doc 16 section 19.4's success criterion of T6 ("-102G1, -102F1, -102F2 with parts
# and wires; PDF") as items; the 30 minutes of NFR-UX-04 are a person's time and no item (D9). `stop` decides each item
# mechanically on the saved project; `check-brief` decides them on the reference solution.

[[item]]
id = "A1"
kind = "hard"
what = "Folio 102 holds -102G1 with the part 2904602, -102F1 with A9F78116 and -102F2 with MICO 4.10."
how = "pages, bom"
query = "SELECT tag FROM api_v1_device WHERE main_folio = '102' AND ((tag = '-102G1' AND part_number = '2904602') OR (tag = '-102F1' AND part_number = 'A9F78116') OR (tag = '-102F2' AND part_number = 'MICO 4.10'))"
expect = "== 3"

[[item]]
id = "A2"
kind = "hard"
what = "Two wires join the + outputs of -102G1 to input 1 of -102F1."
how = "connections"
query = "SELECT number FROM api_v1_wire WHERE (from_tag = '-102G1' AND from_cp = '+' AND to_tag = '-102F1' AND to_cp = '1') OR (to_tag = '-102G1' AND to_cp = '+' AND from_tag = '-102F1' AND from_cp = '1')"
expect = "== 2"

[[item]]
id = "A3"
kind = "hard"
what = "Two wires join output 2 of -102F1 to the 24VDC inputs of -102F2."
how = "connections"
query = "SELECT number FROM api_v1_wire WHERE (from_tag = '-102F1' AND from_cp = '2' AND to_tag = '-102F2' AND to_cp = '24VDC') OR (to_tag = '-102F1' AND to_cp = '2' AND from_tag = '-102F2' AND from_cp = '24VDC')"
expect = "== 2"

[[item]]
id = "A4"
kind = "hard"
what = "The tester exported the drawing as a PDF."
how = "pdf, outcomes"

[[item]]
id = "A5"
kind = "soft"
what = "No + output of -102G1, no connection point of -102F1 and no 24VDC input of -102F2 is left unconnected."
how = "check"
query = "SELECT fingerprint FROM api_v1_message WHERE rule = 'EW-POT-009' AND (target_tags LIKE '-102G1:+%' OR target_tags LIKE '-102F1:%' OR target_tags LIKE '-102F2:24VDC%')"
expect = "== 0"
