# The class of every step of `prelude.uiscript`, in order: a brief's prelude is `setup` only (the first-run flow's
# company-standard wizard with its defaults, the new project, and the part copy the brief needs: the power supply unit,
# until a starter parts library exists, FT-592); the page and the drawing are the tester's work.

[[step]]
action = "tools.company_standard"
class = "setup"

[[step]]
action = "wizard.finish"
class = "setup"

[[step]]
action = "wizard.cancel"
class = "setup"

[[step]]
action = "file.new"
class = "setup"

[[step]]
action = "command.run"
class = "setup"
